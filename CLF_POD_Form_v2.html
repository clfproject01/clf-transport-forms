<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CLF POD</title>
<!--
  RETIRED 2026-11-24 (owner's instruction). This was the July trial POD form. It had no scanning and no
  barcode check and used the old save flow. Old bookmarks now open the current form, CLF_POD_Form.html.
  The query string (for example ?branch=KTN) and the hash are passed on unchanged.
  Without JavaScript the page still forwards (the branch is then the default one) and shows a plain link.
-->
<script>
(function () {
  try { location.replace('CLF_POD_Form.html' + location.search + location.hash); } catch (e) {}
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=CLF_POD_Form.html"></noscript>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#FAF7F2;color:#1A1B2E;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;}
  .card{width:100%;max-width:380px;padding:26px 22px;border-radius:20px;background:#FFFFFF;box-shadow:0 1px 2px rgba(26,27,46,.05),0 8px 24px rgba(26,27,46,.07);text-align:center;}
  h1{margin:0 0 6px;font-size:20px;font-weight:800;color:#141C77;}
  p{margin:0 0 6px;font-size:15px;}
  .en{color:#5F6072;font-size:13px;}
  a.go{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:16px;padding:10px 20px;border-radius:999px;background:#141C77;color:#FFFFFF;font-size:16px;font-weight:800;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>Borang POD sudah berpindah</h1>
    <p>Halaman lama ini tidak digunakan lagi. Borang POD yang baru sedang dibuka.</p>
    <p class="en">This old page is no longer used. Opening the current POD form.</p>
    <a class="go" id="go" href="CLF_POD_Form.html">Buka borang POD</a>
  </div>
<script>
(function () {
  // if the forward did not happen, the button still carries the same query string
  try { document.getElementById('go').href = 'CLF_POD_Form.html' + location.search + location.hash; } catch (e) {}
})();
</script>
</body>
</html>
