<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLF POD Admin — Barcode Board</title>
<!--
  ============================================================================
  CLF POD Admin Board  (Program B of the POD digital-archive plan)
  ----------------------------------------------------------------------------
  Office/admin screen: shows every delivered invoice per lorry, its signed POD
  photo, and a re-drawn barcode the admin scans straight into EFI — so EFI entry
  happens the moment the driver saves, before the lorry returns.

  SELF-CONTAINED: no CDN, no external library (barcode is drawn in-page). Deploy
  to clfproject01/clf-transport-forms (GitHub Pages), same as the other forms.

  BACKEND CONTRACT (implemented by the WebApp paste file — Program A):
    GET  ?action=getPodAdminBoard&date=YYYY-MM-DD&branch=MTK|KTN
         -> { status:'ok', date, branch, lorries:[ { vehicleNo, drivers, shipmentKey,
                invoices:[ { invoiceNo, barcodeRaw, customer, custCode, area, amount,
                status:'delivered'|'failed'|'pending', deliveredAt, deliveredDate,
                photoUrls:[], matchSource:'barcode'|'ai'|'none', mismatch:bool,
                efiScanned:bool, efiBy, failReason, photoOk:bool, photoOkBy,
                reupBy:'<empNo>'|'' } ],
                nas:{ state, at, by, files, msg } } ] }   (reupBy + nas: see the two POSTs below)
    POST data={ formType:'MARK_PHOTO_OK', shipmentKey, invoiceNo, ok:1|0, authToken, clientToken }
         -> { status:'success' }  [2026-11-23] office checked the photo: it IS this invoice
    POST data={ formType:'MARK_EFI_SCANNED', shipmentKey, invoiceNo, scanned:1|0,
                authToken, clientToken }  (no-cors + poll getImportResult)
         -> { status:'success' } (idempotent). POST (not GET) so the session
            authToken travels in the body, never in the access log / URL.
    POST data={ formType:'REUPLOAD_POD_PHOTO', shipmentKey, invoiceNo, photos:[{ name, data }],
                authToken, clientToken }   [2026-11] office replaces an unclear photo
         photos = 1..5 JPEGs, downscaled in the browser to max 2000 px on the long side, quality 0.85;
         data = base64 WITHOUT the "data:image/jpeg;base64," prefix. The old photo is kept in Drive.
         -> { status:'success', photoUrls:[...], reupBy:'<empNo>' }
            The page then shows the new photo, clears barcodeRaw + photoOk and tags the row
            "Re-uploaded <empNo>" (photoCheck = 'reup': verified, not "Needs check").
            The board must send the field reupBy on invoices ('' when none) - the Re-upload button
            only appears when that field exists, so this page can go live before the backend.
    POST data={ formType:'ARCHIVE_POD_NAS', shipmentKey, date, branch, authToken, clientToken }
         [2026-11] one button per lorry, after the office checked everything: copy its POD files to the NAS
         -> { status:'success', nas:{ state:''|'queued'|'done'|'error', at:'<ISO or HH:mm>', by:'<empNo>',
                                       files:<n>, msg:'' } }
            The board must send the same nas object on every lorry (state '' = not on the NAS) - the
            NAS pill, button and summary tile only appear when that field exists. The button is enabled
            only when no invoice of the lorry is still pending and no delivered invoice needs a check.

  PHOTO CHECK (2026-10-24): barcodeRaw = the barcode the driver's phone read on the photo filed under
    that invoice. BC✓ only when it IS this invoice; another number = "Wrong photo" on that row only, and
    the EFI barcode is still drawn from the invoice number. "Needs check" = wrong photo / no photo /
    no barcode read (deliveries from 2026-10-24) / AI-matched / driver sent an unclear photo.

  ⚠ PROPOSE-FIRST (do NOT ship the ACL decision without the boss):
    The unlock reuses the EXISTING, verified PALLET_UNLOCK endpoint + Pallet_Access
    roster — no NEW auth system is invented here. Open question for the boss only:
    should office/admin staff be added to Pallet_Access, or does he want a separate
    POD_Admin_Access roster (a backend change)? Until he decides, unlock accepts
    anyone already on Pallet_Access. See the deploy checklist README.

  BARCODE: Code 39 (default). A hand-drawn Code 39 encoder ships here so the board
    works with zero dependencies and is universally readable by handheld/imager
    scanners. The exact symbology of the *re-drawn* barcode does not need to match
    EFI's printed symbology — a scanner decodes both to the same characters; EFI
    only cares that the decoded string equals the invoice number. The barcode MUST
    still pass the pilot scan-test (aim a real scanner at the screen) before go-live.
  ============================================================================
-->
<style>
  /* ==========================================================================
     LOOK: "direction B - Brand" (2026-11). Navy band + white logo + 3px red line
     (red is used ONLY there), warm page, white cards, pill buttons and tags.
     navy = actions, green = done, amber = check, dark red = fault, lime = a dot.
     The barcode box (.bc-box) is deliberately left exactly as before: pure black
     on pure white, no radius, no shadow, nothing drawn over it.
     ========================================================================== */
  :root{
    --page:#FAF7F2; --surface:#FFFFFF; --text:#1A1B2E; --muted:#5F6072; --line:#ECE7DE; --soft:#F4F0EA; --hover:#FCFBF8;
    --ctl:#C5C8E0; --navy:#141C77; --navy-2:#2A3189; --navy-tint:#EEF0FA; --on-navy:#D9DBF2;
    --ok:#15803D; --ok-tint:#ECFDF3; --warn:#B45309; --warn-tint:#FFFBEB; --fault:#C8101E; --fault-tint:#FDF1F1;
    --red:#FC091B; --lime:#87C329;
    --shadow:0 1px 2px rgba(26,27,46,.05),0 8px 24px rgba(26,27,46,.07);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:60px;}
  h1{margin:0;}
  button,input{font:inherit;color:inherit;}
  button{cursor:pointer;}
  button:disabled{cursor:default;}
  code{font-family:Consolas,"SFMono-Regular",monospace;font-size:.95em;}
  :focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
  .band :focus-visible,.lock :focus-visible,#lightbox :focus-visible{outline-color:#fff;}
  .lock input:focus-visible,.lock button:focus-visible{outline-color:var(--navy);}

  /* line icons (24px grid, drawn inline - no icon font, no emoji) */
  .i{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;}
  .i.i12{width:12px;height:12px;stroke-width:2.6;vertical-align:-1px;}
  .i.i14{width:14px;height:14px;stroke-width:2.4;vertical-align:-2px;}
  .i.i16{width:16px;height:16px;vertical-align:-3px;}
  .i.i32{width:32px;height:32px;stroke-width:1.75;}

  /* ---- navy band ---- */
  .band{position:relative;background:var(--navy);color:#fff;overflow:hidden;padding:13px 0;}
  .band::after{content:"";position:absolute;right:-60px;top:-260px;width:600px;height:600px;border-radius:50%;background:#1B2485;}
  .band__in{position:relative;z-index:1;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;max-width:1328px;margin:0 auto;padding:0 24px;}
  .band__logo{display:block;height:40px;width:auto;}
  .band__sep{width:1px;height:38px;background:#4148A0;}
  .band h1{font-size:21px;font-weight:800;line-height:1.2;}
  .band__meta{display:flex;align-items:center;gap:8px;margin-top:2px;min-height:18px;color:var(--on-navy);font-size:13px;font-weight:600;}
  .band__meta::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--lime);}
  .band__meta:empty::before{display:none;}
  .sp{flex:1 1 auto;}
  .band__link{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--navy-2);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;}
  .band__link:hover{background:#373F9C;}
  .redline{height:3px;background:var(--red);}

  .wrap{max-width:1328px;margin:0 auto;padding:16px 24px 24px;}

  /* ---- toolbar ---- */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .field{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--muted);}
  .field input[type=date]{height:30px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--text);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
  .seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);}
  .seg-btn{height:32px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--navy);font-size:13px;font-weight:800;white-space:nowrap;}
  .seg-btn:hover{background:var(--navy-tint);}
  .seg-btn.active{background:var(--navy);color:#fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ctl);background:var(--surface);color:var(--navy);font-size:13px;font-weight:800;white-space:nowrap;text-decoration:none;}
  .btn:hover{background:var(--navy-tint);}
  .btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-tint);color:var(--warn);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;}
  .btn .cnt.zero{background:var(--soft);color:var(--muted);}
  .btn-primary .cnt,.btn-primary .cnt.zero{background:#fff;color:var(--navy);}

  .demo-banner{display:none;align-items:center;gap:8px;background:var(--warn-tint);color:var(--warn);font-size:13px;font-weight:700;padding:9px 14px;border-radius:14px;margin-bottom:14px;}
  .demo-banner.show{display:flex;}
  .err-banner{display:none;background:var(--fault-tint);color:var(--fault);font-size:13px;font-weight:600;padding:9px 9px 9px 14px;border-radius:14px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;}
  .err-banner.show{display:flex;}

  /* ---- today's numbers: one calm card, cells split by hairlines ---- */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .stat{display:block;min-width:0;margin:0;padding:11px 18px 13px;border:0;border-radius:0;background:transparent;text-align:left;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);}
  .stat .l{font-size:12px;font-weight:700;color:var(--muted);}
  .stat .n{font-size:26px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--text);}
  .stat .n small{font-size:13px;font-weight:700;color:var(--muted);}
  .stat .n.zero{color:var(--muted);}
  .stat.prob .n{color:var(--fault);} .stat.chk .n{color:var(--warn);}
  .stat.prob .n.zero,.stat.chk .n.zero{color:var(--muted);}
  .stat .bar{height:6px;background:#E6E8F4;border-radius:999px;overflow:hidden;margin-top:5px;}
  .stat .bar i{display:block;height:100%;background:var(--navy);border-radius:999px;transition:width .3s;}
  .stat.ver .bar i,.stat.onnas .bar i{background:var(--ok);}
  .stat.chk{cursor:pointer;width:100%;}
  .stat.chk:hover{background:var(--hover);}
  .stat.chk .hint{font-size:12px;font-weight:600;color:var(--muted);}
  .stat.chk .hint::after{content:"Click to show only these";}
  .stat.chk.on{background:var(--warn-tint);box-shadow:inset 0 0 0 2px var(--warn);}
  .stat.chk.on .hint{color:var(--warn);}
  .stat.chk.on .hint::after{content:"Filter is on - click to clear";}
  .stat.chk:focus-visible{outline-offset:-3px;}

  /* ---- pills (status words always come with an icon or a word, never colour alone) ---- */
  .badge,.lh-bad,.st-warn,.nas-pill,.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums;}
  .badge.done,.nas-pill.is-done{background:var(--ok-tint);color:var(--ok);}
  .badge.prob,.badge.mismatch,.lh-bad,.nas-pill.is-error{background:var(--fault-tint);color:var(--fault);}
  .badge.pend,.nas-pill.is-none{background:var(--soft);color:var(--muted);}
  .badge.check,.st-warn{background:var(--warn-tint);color:var(--warn);}
  .nas-pill.is-queued,.pill.is-navy{background:var(--navy-tint);color:var(--navy);}

  /* ---- lorry card ---- */
  .lorry{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .lorry-head{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:9px 18px 9px 12px;cursor:pointer;user-select:none;}
  .lorry-head:hover{background:var(--hover);}
  .lorry.open>.lorry-head{border-bottom:1px solid var(--line);}
  .lorry .lorry-body{display:none;}
  .lorry.open .lorry-body{display:block;}
  .tog{display:inline-flex;align-items:center;gap:8px;min-height:36px;max-width:100%;padding:0 8px 0 4px;border:0;border-radius:999px;background:transparent;text-align:left;flex-wrap:wrap;}
  .chev{display:inline-flex;color:var(--muted);transition:transform .15s;}
  .lorry.open>.lorry-head .chev,.station.open>.station-head .chev{transform:rotate(90deg);}
  .lorry-head .plate{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:.01em;white-space:nowrap;}
  .lorry-head .crew{font-size:13px;font-weight:600;color:var(--muted);}
  .lorry-head .mini{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .lorry-head .mini b{font-weight:800;color:var(--text);}
  .nas{display:inline-flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin-left:auto;cursor:default;}
  .nas-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:800;white-space:nowrap;}
  .nas-btn:hover{background:var(--navy-2);}
  .nas-btn:disabled{background:var(--soft);color:var(--muted);cursor:not-allowed;}
  .nas-why{font-size:12px;font-weight:700;color:var(--warn);}

  /* ---- one shop inside a lorry ---- */
  .station{border-top:1px solid var(--line);}
  .station:first-child{border-top:none;}
  .station-head{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;min-height:50px;padding:5px 18px 5px 12px;cursor:pointer;user-select:none;}
  .station-head:hover{background:var(--hover);}
  .st-meta{display:flex;align-items:center;gap:2px 10px;flex-wrap:wrap;min-width:0;}
  .st-cust{font-size:14px;font-weight:700;color:var(--text);}
  .st-area{font-size:13px;color:var(--muted);}
  .st-count,.st-efi{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .st-photos .thumbs{justify-content:flex-end;}
  .station-body{display:none;}
  .station.open .station-body{display:block;}

  /* ---- invoice table (dense: one barcode-high row per invoice) ---- */
  .tblwrap{overflow-x:auto;}
  table.inv{width:100%;min-width:1120px;table-layout:fixed;border-collapse:collapse;font-size:13px;}
  /* fixed columns: every shop of every lorry lines up, so the eye runs straight down the barcodes */
  table.inv th.c-inv{width:200px;} table.inv th.c-ph{width:104px;} table.inv th.c-amt{width:96px;text-align:right;}
  table.inv th.c-time{width:116px;} table.inv th.c-bc{width:340px;} table.inv th.c-efi{width:104px;}
  table.inv th{height:28px;padding:0 10px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;background:var(--soft);}
  table.inv td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle;}
  table.inv tr:first-child td{border-top:none;}
  table.inv th:first-child,table.inv td:first-child{padding-left:42px;}
  table.inv th:last-child,table.inv td:last-child{padding-right:18px;}
  table.inv tr.row-mismatch td{background:var(--fault-tint);}
  table.inv tr.row-mismatch td:first-child{box-shadow:inset 3px 0 0 var(--fault);}
  table.inv tr.row-pend .inv-no,table.inv tr.row-pend .amt{color:var(--muted);}
  .inv-no{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .src-line{display:block;margin-top:3px;}
  .amt{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;white-space:nowrap;}
  .src{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
  .src.bc{background:var(--ok-tint);color:var(--ok);}          /* the barcode on the photo is this invoice */
  .src.ai{background:var(--warn-tint);color:var(--warn);}      /* matched by AI - look */
  .src.q{background:var(--warn-tint);color:var(--warn);}       /* no barcode read - look */
  .src.no{background:var(--soft);color:var(--muted);}          /* before the barcode era */
  .src.bad{background:var(--fault-tint);color:var(--fault);}   /* another invoice / no photo */
  .src.chk{background:var(--navy-tint);color:var(--navy);}     /* the office checked or replaced the photo */
  table.inv tr.row-mismatch .src.bad,table.inv tr.row-mismatch .badge.mismatch{background:#fff;}
  .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;}
  .ok-btn,.reup-btn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ctl);background:var(--surface);color:var(--navy);font-size:12px;font-weight:800;white-space:nowrap;}
  .ok-btn:hover,.reup-btn:hover{background:var(--navy-tint);}
  .ok-btn{border-color:var(--navy);background:var(--navy);color:#fff;}
  .ok-btn:hover{background:var(--navy-2);}
  .ok-btn.undo{border-color:transparent;background:transparent;color:var(--muted);font-weight:700;}
  .ok-btn.undo:hover{background:var(--soft);}
  .ok-btn:disabled,.reup-btn:disabled{opacity:.6;cursor:default;}
  .bc-warn{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--fault);font-weight:700;margin-top:3px;text-align:center;}
  td.hidden-ok{font-size:12px;color:var(--muted);}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap;}
  .thumbs{display:flex;gap:4px;flex-wrap:wrap;}
  .thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--soft);}
  .thumb:hover{border-color:var(--navy);}
  .thumb-link{display:inline-flex;width:38px;height:38px;border-radius:8px;border:1px solid var(--ctl);align-items:center;justify-content:center;text-decoration:none;font-size:12px;font-weight:800;color:var(--navy);background:var(--surface);}
  button.thumb-more{display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:12px;font-weight:800;color:var(--navy);background:var(--navy-tint);border:1px solid var(--ctl);}
  .thumb-none{font-size:12px;color:var(--muted);}
  /* barcode: unchanged geometry - do not round, shade or cover */
  td.bc-cell{width:340px;}
  .bc-box{width:320px;max-width:100%;}
  .bc-box svg{display:block;width:100%;height:auto;}
  .bc-txt{font-family:Consolas,"SFMono-Regular",monospace;font-size:12px;color:var(--muted);margin-top:1px;text-align:center;letter-spacing:.04em;}
  .bc-na{font-size:12px;color:var(--muted);}
  .efi-wrap{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .efi-wrap input{width:19px;height:19px;margin:0;accent-color:var(--navy);cursor:pointer;}
  .efi-wrap .by{font-size:12px;font-weight:600;color:var(--muted);}

  .empty{text-align:center;color:var(--muted);font-size:14px;font-weight:600;padding:40px 16px;}
  .empty .big{margin-bottom:8px;color:var(--ctl);}
  .loading{text-align:center;color:var(--muted);font-size:14px;padding:40px 16px;}
  .spin{display:inline-block;width:26px;height:26px;border:3px solid var(--ctl);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:160;max-width:90%;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 6px 18px rgba(26,27,46,.25);opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.ok{background:var(--ok);} .toast.err{background:var(--fault);} .toast.show{opacity:1;}

  /* ---- confirm sheet (re-upload, save to NAS) ---- */
  .sheet{display:none;position:fixed;inset:0;z-index:140;background:rgba(20,28,119,.42);align-items:center;justify-content:center;padding:20px;}
  .sheet.show{display:flex;}
  .sheet__card{width:100%;max-width:440px;padding:22px;border-radius:20px;background:var(--surface);box-shadow:0 20px 60px rgba(26,27,46,.3);}
  .sheet__title{font-size:17px;font-weight:800;line-height:1.3;margin-bottom:6px;}
  .sheet__text{font-size:14px;}
  .sheet__thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .sheet__thumbs:empty{display:none;}
  .sheet__thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft);}
  .sheet__note{margin-top:10px;font-size:12px;font-weight:700;color:var(--warn);}
  .sheet__note:empty{display:none;}
  .sheet__acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* ---- photo viewer ---- */
  #lightbox{display:none;position:fixed;inset:0;z-index:150;background:rgba(14,16,40,.9);align-items:center;justify-content:center;flex-direction:column;padding:24px;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:96vw;max-height:82vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #lightbox .lb-cap{color:#fff;font-size:13px;font-weight:600;margin-top:12px;text-align:center;}
  #lightbox .lb-nav{position:absolute;top:70px;bottom:0;width:80px;z-index:5;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;user-select:none;opacity:.75;}
  #lightbox .lb-nav:hover{opacity:1;} #lightbox .lb-prev{left:0;} #lightbox .lb-next{right:0;}
  #lightbox .lb-prev .i{transform:rotate(180deg);}
  #lightbox .lb-close{position:absolute;top:12px;right:14px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#fff;cursor:pointer;z-index:30;background:rgba(255,255,255,.16);border-radius:50%;}
  #lightbox .lb-close:hover{background:rgba(255,255,255,.28);}

  /* ---- sign-in overlay (built in JS, same logic as CLF_Pallet_Store) ---- */
  .lock{position:fixed;inset:0;z-index:200;background:rgba(20,28,119,.96);display:flex;align-items:center;justify-content:center;padding:20px;}
  .lock__card{width:100%;max-width:360px;padding:26px 22px 22px;border-radius:20px;background:var(--surface);box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .lock__ic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;margin:0 auto;border-radius:16px;background:var(--navy-tint);color:var(--navy);}
  .lock__title{font-weight:800;font-size:18px;text-align:center;margin:10px 0 2px;}
  .lock__sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px;}
  .lock label{display:block;font-size:13px;font-weight:700;}
  .lock input{display:block;width:100%;margin:4px 0 12px;padding:11px 14px;font-size:15px;border:1.5px solid var(--ctl);border-radius:14px;background:#fff;}
  .lock__err{min-height:18px;font-size:13px;color:var(--fault);font-weight:700;}
  .lock__btn{width:100%;height:48px;margin-top:8px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;}
  .lock__btn:hover{background:var(--navy-2);}
  .lock__btn:disabled{opacity:.6;}

  /* ---- narrow screens: stack, never scroll the page sideways ---- */
  @media (max-width:720px){
    .band__in,.wrap{padding-left:14px;padding-right:14px;}
    .band__sep,.sp{display:none;}
    .band__logo{height:32px;}
    .band h1{font-size:18px;}
    .summary{grid-template-columns:1fr 1fr;}
    .nas{margin-left:0;width:100%;padding-left:4px;}
    .lorry-head .mini{padding-left:4px;}
    .controls .btn,.controls .field{height:40px;}
  }
</style>
</head>

var BARCODE_SYMBOLOGY = 'code39';      // 'code39' (default, shipped) | 'code128b' (also implemented below)
// Photo display mode (approved 2026-07-11: hybrid thumbnail-vs-link):

//   'link'                = always an open-in-Drive link, never inline (fallback if thumbnails prove flaky)
// Neither requires public sharing — folder sharing to the office account + Google login gates access.
var PHOTO_DISPLAY = 'thumbnail';

var _boardData = null;      // last good board payload
var _openKeys = new Set();  // collapsed by DEFAULT — office expands the lorry they are scanning (survives auto-refresh)
var _openStations = new Set();  // per-customer collapse INSIDE a lorry — click a customer to reveal its barcodes (survives auto-refresh)
var _refreshTmr = null;

var _lbSets = {};           // station key -> { urls, caps }: every photo of one shop, each captioned with ITS invoice

// had one, so "no barcode" only counts as a photo to check from here.
var BC_SINCE = '2026-10-24';
var THUMB_ONERR = 'this.onerror=null;var a=document.createElement(\'a\');a.href=this.src;a.target=\'_blank\';a.rel=\'noopener\';a.className=\'thumb-link\';a.textContent=\'Open\';this.replaceWith(a);';

/* ============================================================================
   UTIL
   ============================================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n); if(isNaN(n)) return ''; return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayKL(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kuala_Lumpur'}); }
function _newToken(p){ return (p||'adm')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,10); }
function _auth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
function _authToken(){ var a=_auth(); return (a&&a.token)?a.token:''; }
function _operator(){ var a=_auth(); return (a&&a.empNo)?a.empNo:''; }
function fmtTime(dateStr, timeStr){
  // recent-list rule (lesson #15): show date context, never bare HH:mm
  if(!dateStr && !timeStr) return '';
  var t = timeStr || '';
  if(!dateStr) return t;
  if(dateStr === todayKL()) return 'Today ' + t;

/* ============================================================================
   BARCODE — self-contained Code 39 (default) + Code 128B, drawn as inline SVG.
   No CDN, no library. Verified against the Code 39 / Code 128 spec tables.
   Returns an SVG string, or '' if the value can't be encoded (caller shows text).
   ============================================================================ */
// Code 39: 9 elements per char (B S B S B S B S B), '1'=narrow '2'=wide.
var C39 = {
  '0':'111221211','1':'211211112','2':'112211112','3':'212211111','4':'111221112',
  '5':'211221111','6':'112221111','7':'111211212','8':'211211211','9':'112211211',
  'A':'211112112','B':'112112112','C':'212112111','D':'111122112','E':'211122111',
  'F':'112122111','G':'111112212','H':'211112211','I':'112112211','J':'111122211',
  'K':'211111122','L':'112111122','M':'212111121','N':'111121122','O':'211121121',
  'P':'112121121','Q':'111111222','R':'211111221','S':'112111221','T':'111121221',
  'U':'221111112','V':'122111112','W':'222111111','X':'121121112','Y':'221121111',
  'Z':'122121111','-':'121111212','.':'221111211',' ':'122111211','$':'121212111',
  '/':'121211121','+':'121112121','%':'111212121','*':'121121211'
};
function code39svg(value, opt){
  opt = opt || {};
  var narrow = opt.narrow || 2, ratio = opt.ratio || 2.5, height = opt.height || 42, quiet = 10*narrow;
  // Use the value EXACTLY as given — do NOT uppercase. The barcode must decode to
  // the identical string EFI expects; any char outside Code 39 -> '' -> text fallback,
  // so we never draw a barcode that scans as something different from the source.
  var v = String(value==null?'':value);
  var chars = ('*'+v+'*').split('');
  for(var i=0;i<chars.length;i++){ if(!C39[chars[i]]) return ''; }   // unsupported char -> caller falls back to text
  var wNarrow = narrow, wWide = Math.round(narrow*ratio);
  var x = quiet, rects = '';
  for(var c=0;c<chars.length;c++){
    var pat = C39[chars[c]];
    for(var e=0;e<9;e++){
      var w = (pat[e]==='2') ? wWide : wNarrow;
      if(e % 2 === 0){ rects += '<rect x="'+x+'" y="0" width="'+w+'" height="'+height+'"/>'; } // even index = bar
      x += w;
    }
    x += wNarrow; // inter-character narrow gap
  }
  var total = x - wNarrow + quiet;
  return '<svg width="'+total+'" height="'+height+'" viewBox="0 0 '+total+' '+height+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="0" y="0" width="'+total+'" height="'+height+'" fill="#fff"/><g fill="#000">'+rects+'</g></svg>';
}

// Code 128B (optional). Values 0..102 -> module-width patterns (6 elements each).
var C128_PAT = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128svg(value, opt){
  opt = opt || {};
  var mod = opt.module || 2, height = opt.height || 42, quiet = 10*mod;
  var v = String(value==null?'':value);
  var codes = [104]; // Start B
  for(var i=0;i<v.length;i++){ var cc=v.charCodeAt(i); if(cc<32||cc>126) return ''; codes.push(cc-32); }
  var sum = 104; for(var k=1;k<codes.length;k++){ sum += codes[k]*k; }
  codes.push(sum % 103);           // checksum
  codes.push(106);                 // Stop
  var x = quiet, rects='';
  for(var c=0;c<codes.length;c++){
    var pat = C128_PAT[codes[c]];
    for(var e=0;e<pat.length;e++){
      var w = parseInt(pat[e],10)*mod;
      if(e % 2 === 0){ rects += '<rect x="'+x+'" y="0" width="'+w+'" height="'+height+'"/>'; }
      x += w;
    }
  }
  var total = x + quiet;
  return '<svg width="'+total+'" height="'+height+'" viewBox="0 0 '+total+' '+height+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="0" y="0" width="'+total+'" height="'+height+'" fill="#fff"/><g fill="#000">'+rects+'</g></svg>';
}
// Prefer the barcode's decoded RAW string (what the driver's phone read = EFI's printed content).
// Fall back to the invoice number when no raw string was captured (Gemini-matched rows).
function barcodeSvg(rawOrInvoice, opt){
  if(BARCODE_SYMBOLOGY === 'code128b') return code128svg(rawOrInvoice, opt);
  return code39svg(rawOrInvoice, opt);
}

// POST + no-cors + poll getImportResult (same readback the forms use, for token-carrying writes)
async function postWithToken(payload, token){
  var fd=new FormData(); fd.append('data', JSON.stringify(payload));
  try{ await fetch(SCRIPT_URL,{ method:'POST', mode:'no-cors', body:fd }); }
  catch(e){ return { status:'error', message:'No connection · Tiada sambungan' }; }
  for(var t=0;t<8;t++){
    await new Promise(function(r){ setTimeout(r,1500); });
    try{ var rb=await fetch(SCRIPT_URL+'?action=getImportResult&token='+encodeURIComponent(token)); var rd=await rb.json(); if(rd && rd.status && rd.status!=='pending') return rd; }
    catch(e){}
  }
  return { status:'error', message:'No confirmation · Tiada pengesahan' };
}

// [2026-10-24] Photo check per invoice. The driver form files each photo under one invoice and keeps the barcode it
// read on that photo (Shipment_Items col 18 = barcodeRaw). Verified = that code IS this invoice. The server's
// matchSource says 'barcode' for ANY code, and its mismatch flag (DRIVER_FORCED) is stamped on every invoice of the
// save, so neither can say which invoice is wrong.
function bcNorm(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }   // same rule as the driver form
// [2026-11-23] "Photo OK": the office opened the photo and it IS this invoice (the phone misread the barcode, or
// read nothing). photoOk comes from the board (Shipment_Items col 19 token PHOTO_OK:<staff>); such a row is no
// longer "wrong" / "needs check". A driver re-save of the invoice clears it (new photo = look again).
function photoCheck(v){   // '' (not delivered) | ok | wrong | unread | ai | nophoto | checked | reup
  var c=photoCheck0(v);
  // [2026-11] 'reup': the office replaced the photo (Re-upload). It stands as verified whatever the phone read on
  // the old one. The other values are decided exactly as before.
  if(v.reupBy && c && c!=='nophoto') return 'reup';
  return (v.photoOk && (c==='wrong' || c==='unread' || c==='ai')) ? 'checked' : c;
}
function photoCheck0(v){
  if(String(v.status||'').toLowerCase()!=='delivered') return '';
  if(!(v.photoUrls||[]).length) return 'nophoto';
  var raw=bcNorm(v.barcodeRaw);
  if(raw) return raw===bcNorm(v.invoiceNo) ? 'ok' : 'wrong';
  return v.matchSource==='ai' ? 'ai' : 'unread';
}
function _bcEra(v){ return String(v.deliveredDate || (_boardData && _boardData.date) || '') >= BC_SINCE; }
function needsCheck(v){
  var c=photoCheck(v);

  if(v.photoOk && c && c!=='nophoto') return false;

  return '';
}
// Group a lorry's invoices into stations (one customer = one photo set).
// Preserves first-seen order; unions+dedupes the photo URLs. Older saves wrote the same photo set to every invoice
// of the stop; since POD save v2 (2026-10-24) each invoice holds only its OWN photo. photos[i].inv = the one invoice
// holding that photo ('' when several share it), so the viewer can caption each photo with its invoice.
function groupStations(invs){
  var map={}, order=[];
  (invs||[]).forEach(function(v){
    var key=String(v.custCode||v.customer||v.customerName||v.area||'—');
    if(!map[key]){ map[key]={custKey:key, customer:v.customer||v.customerName||v.custCode||'', area:v.area||'', invs:[], photoUrls:[], _holders:{}}; order.push(key); }
    var S=map[key];
    S.invs.push(v);
    if(!S.area && v.area) S.area=v.area;
    if(!S.customer && (v.customer||v.customerName)) S.customer=v.customer||v.customerName;
    // DELIVERED photos only — a failed invoice's proof photo (closed shopfront etc.)
    // belongs on its own row, not in the delivery set / the photos-vs-delivered ⚑ check
    if(String(v.status).toLowerCase()==='delivered'){
      (v.photoUrls||[]).forEach(function(u){
        if(!u) return;
        if(!S._holders[u]){ S._holders[u]=[]; S.photoUrls.push(u); }
        if(S._holders[u].indexOf(String(v.invoiceNo))<0) S._holders[u].push(String(v.invoiceNo));
      });
    }
  });
  return order.map(function(k){
    var S=map[k];
    S.photos = S.photoUrls.map(function(u){ var h=S._holders[u]; return { u:u, inv: h.length===1 ? h[0] : '' }; });
    S.idxOf = {}; S.photos.forEach(function(p, i){ S.idxOf[p.u]=i; });
    S.sd = S.invs.filter(function(v){ return String(v.status).toLowerCase()==='delivered'; }).length;
    S.warn = !!(S.photoUrls.length && S.sd && S.photoUrls.length!==S.sd);
    delete S._holders;
    return S;
  });
}

function photoCell(v){
  var urls=v.photoUrls||[];

  if(PHOTO_DISPLAY==='link'){
    return '<div class="thumbs">'+urls.map(function(u,i){

    }).join('')+'</div>';

  // 'thumbnail' mode (default): XSS-safe inline thumbnail — no data injected into a JS string.
  // Invoice + index go in data-* attrs (HTML-attribute context, esc() is sufficient) and a
  // delegated click opens the lightbox. onerror: if the Drive thumbnail can't load (viewer not

function wireEfiCheckboxes(){

  boxes.forEach(function(b){ b.addEventListener('change', function(){ markEfi(b); }); });
}
var _writesInFlight = 0;   // suppress auto-refresh while a write is pending (don't detach the box)
function _liveEfiBox(ship, inv){
  var found=null;
  document.querySelectorAll('.efi-wrap input[type=checkbox]').forEach(function(b){
    if(b.getAttribute('data-ship')===ship && b.getAttribute('data-inv')===inv) found=b;
  });
  return found;
}
async function markEfi(box){
  if(DEMO){ toast('ok','Demo: EFI mark not sent'); return; }
  if(!_authToken()){ box.checked=!box.checked; showLock('Unlock to record EFI entry · Buka untuk rekod'); return; }
  var ship=box.getAttribute('data-ship'), inv=box.getAttribute('data-inv'), scanned=box.checked?1:0;
  box.disabled=true; _writesInFlight++;
  var tok=_newToken('efi');
  // POST (not GET) so authToken is in the body, and the backend dispatches on formType (matches spec A3).
  var rd = await postWithToken({ formType:'MARK_EFI_SCANNED', shipmentKey:ship, invoiceNo:inv,
                                 scanned:scanned, authToken:_authToken(), clientToken:tok }, tok);
  _writesInFlight--;
  // a concurrent refresh may have re-rendered the row — re-query the live checkbox by data-*.
  var live = _liveEfiBox(ship, inv) || box;
  if(rd && rd.status==='success'){
    _patchCache(ship, inv, scanned?true:false);
    if(live){
      live.checked = !!scanned; live.disabled=false;
      var wrap=live.parentElement, by=wrap.querySelector('.by');
      if(scanned){ if(!by){ by=document.createElement('span'); by.className='by'; wrap.appendChild(by); } by.textContent=_operator(); }
      else if(by){ by.remove(); }
    }
    toast('ok', (scanned?'EFI recorded ✓':'EFI unmarked')+' · '+esc(inv));
  } else {
    if(live){ live.checked = !scanned; live.disabled=false; }   // revert
    toast('err','Not saved: '+esc((rd&&rd.message)||'server error'));
  }
}
function _patchCache(ship, inv, val){
  if(!_boardData) return;
  (_boardData.lorries||[]).forEach(function(L){ if(String(L.shipmentKey)===String(ship)){ (L.invoices||[]).forEach(function(v){ if(String(v.invoiceNo)===String(inv)){ v.efiScanned=val; v.efiBy=val?_operator():''; } }); } });
}

/* ============================================================================
   RE-UPLOAD — the office replaces an unclear photo            [2026-11]
   Pick 1..5 images -> confirm sheet -> downscale in the browser -> POST
   REUPLOAD_POD_PHOTO. The old photo is kept in Drive by the backend.
   Shown only when the board sends the field reupBy on invoices (_canReup).
   ============================================================================ */
var _canReup = false;
var REUP_MAX_FILES = 5, REUP_MAX_SIDE = 2000, REUP_QUALITY = 0.85;
var _reupTarget = null;     // { ship, inv } of the row whose file picker is open
var _reupBusy = {};         // 'ship|inv' -> true while its upload runs (survives a re-render)
function reupBtn(L, v){
  if(!_canReup || String(v.status||'').toLowerCase()!=='delivered') return '';
  var busy=_reupBusy[String(L.shipmentKey||'')+'|'+String(v.invoiceNo)];
  return '<button type="button" class="reup-btn" data-ship="'+esc(L.shipmentKey||'')+'" data-inv="'+esc(String(v.invoiceNo))+'"'
    +' title="Replace the photo with a clearer one (the old photo is kept in Drive)"'+(busy?' disabled>Uploading…':'>'+ic('upload',14)+'Re-upload')+'</button>';
}
// Every photo of this row belongs to this invoice alone: one photo from the driver form, or 1..5 after a Re-upload.
function _ownPhotos(v, S){
  var urls=v.photoUrls||[];
  return urls.length>0 && (urls.length===1 || !!v.reupBy) && urls.every(function(u){ var i=S.idxOf[u]; return i!=null && S.photos[i].inv===String(v.invoiceNo); });
}
function rowActs(L, v){ var a=okBtn(L, v)+reupBtn(L, v); return a ? '<div class="acts">'+a+'</div>' : ''; }
function askReup(btn){
  if(!DEMO && !_authToken()){ showLock('Unlock to re-upload a photo'); return; }
  _reupTarget={ ship:btn.getAttribute('data-ship'), inv:btn.getAttribute('data-inv') };
  var f=$('reupFile'); f.value=''; f.click();
}
function reupPicked(files){
  var t=_reupTarget; if(!t) return;
  var all=Array.prototype.slice.call(files||[]).filter(function(f){ return String(f.type||'').indexOf('image/')===0; });
  if(!all.length){ toast('err','Choose a photo file (JPG or PNG)'); return; }
  var use=all.slice(0, REUP_MAX_FILES);
  openSheet({ title:'Re-upload photo', text:'Replace the photo of invoice '+t.inv+'? The old photo is kept in Drive.', files:use,
    note: all.length>use.length ? 'Only the first '+REUP_MAX_FILES+' of the '+all.length+' photos you picked will be used.' : '',
    okText:'Replace', onOk:function(){ doReup(t.ship, t.inv, use); } });
}
// One picked image -> JPEG, max 2000 px on the long side, quality 0.85, base64 without the "data:" prefix.
function _reupShrink(file){
  return new Promise(function(resolve, reject){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1, REUP_MAX_SIDE/Math.max(w, h, 1));
        var cw=Math.max(1, Math.round(w*k)), ch=Math.max(1, Math.round(h*k));
        var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
        var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cw,ch); cx.drawImage(img,0,0,cw,ch);
        var du=cv.toDataURL('image/jpeg', REUP_QUALITY);
        URL.revokeObjectURL(url);
        var base=String(file.name||'photo'), dot=base.lastIndexOf('.');
        resolve({ name:(dot>0?base.slice(0,dot):base)+'.jpg', data:du.slice(du.indexOf(',')+1) });
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('could not read '+(file.name||'the photo')+' - use a JPG or PNG')); };
    img.src=url;
  });
}
async function doReup(ship, inv, files){
  var key=String(ship)+'|'+String(inv);
  function patch(urls, by){
    ((_boardData && _boardData.lorries)||[]).forEach(function(L){ if(String(L.shipmentKey)===String(ship)){ (L.invoices||[]).forEach(function(v){
      if(String(v.invoiceNo)===String(inv)){ v.photoUrls=urls; v.reupBy=by; v.barcodeRaw=''; v.photoOk=false; v.photoOkBy=''; } }); } });
    render();
  }
  if(_reupBusy[key]) return;
  if(DEMO){ patch(files.map(function(f){ return URL.createObjectURL(f); }), 'DEMO'); toast('ok','Demo: photo not sent'); return; }
  if(!_authToken()){ showLock('Unlock to re-upload a photo'); return; }
  var btn=_liveBtn('reup-btn', ship, inv);
  if(btn){ btn.disabled=true; btn.textContent='Uploading…'; }
  _reupBusy[key]=true; _writesInFlight++;
  var rd;
  try{
    var photos=[];
    for(var i=0;i<files.length;i++){ photos.push(await _reupShrink(files[i])); }
    var tok=_newToken('reup');
    rd=await postWithToken({ formType:'REUPLOAD_POD_PHOTO', shipmentKey:ship, invoiceNo:inv, photos:photos,
                             authToken:_authToken(), clientToken:tok }, tok);
  }catch(e){ rd={ status:'error', message:(e && e.message) || 'could not read the photo' }; }
  _writesInFlight--; delete _reupBusy[key];
  if(rd && rd.status==='success' && Array.isArray(rd.photoUrls) && rd.photoUrls.length){
    patch(rd.photoUrls, rd.reupBy || _operator());
    toast('ok','Photo replaced &#10003; · '+esc(inv));
  } else {
    // nothing was patched: the row keeps its photo, tag and marks; only the button comes back
    btn=_liveBtn('reup-btn', ship, inv) || btn;
    if(btn){ btn.disabled=false; btn.innerHTML=ic('upload',14)+'Re-upload'; }

/* ============================================================================
   SAVE TO NAS — one button per lorry, after the office checked everything  [2026-11]
   L.nas = { state:''|'queued'|'done'|'error', at, by, files, msg }.
   Shown only when the board sends the field nas on lorries (_canNas).
   ============================================================================ */
var _canNas = false;
var _nasBusy = {};          // shipmentKey -> true while its request runs (survives a re-render)
function nasState(L){ var s=String((L && L.nas && L.nas.state) || '').toLowerCase(); return (s==='queued' || s==='done' || s==='error') ? s : ''; }
// What still blocks a lorry, and how many POD files it has (one per distinct photo of a delivered invoice).
function nasCounts(L){
  var pending=0, check=0, files=0, seen={};
  ((L && L.invoices)||[]).forEach(function(v){
    var st=String(v.status||'').toLowerCase();
    if(st==='delivered'){
      if(needsCheck(v)) check++;
      (v.photoUrls||[]).forEach(function(u){ if(u && !seen[u]){ seen[u]=1; files++; } });
    } else if(st!=='failed') pending++;
  });
  return { pending:pending, check:check, files:files };
}
function nasWhy(L){   // '' = complete, the button is enabled; otherwise the reason in plain words
  var c=nasCounts(L), why=[];
  if(c.check) why.push(c.check+' photo'+(c.check===1?'':'s')+' to check');
  if(c.pending) why.push(c.pending+' not delivered yet');
  if(!why.length && !c.files) why.push('no POD photo yet');
  return why.join(' · ');
}
function nasTime(at){   // 'HH:mm' stays; an ISO time becomes HH:mm (today) or "23 Nov, 14:02" - Malaysia time
  var s=String(at==null?'':at).trim(); if(!s) return '';
  if(s.length<=5 && s.indexOf(':')>0) return s;
  var d=new Date(s); if(isNaN(d.getTime())) return s;
  var hm=d.toLocaleTimeString('en-GB',{ timeZone:'Asia/Kuala_Lumpur', hour:'2-digit', minute:'2-digit', hour12:false });
  if(d.toLocaleDateString('en-CA',{ timeZone:'Asia/Kuala_Lumpur' })===todayKL()) return hm;
  return d.toLocaleDateString('en-MY',{ timeZone:'Asia/Kuala_Lumpur', day:'2-digit', month:'short' })+', '+hm;
}
function nasPill(L){
  var n=(L && L.nas) || {}, s=nasState(L);
  if(s==='queued') return '<span class="nas-pill is-queued" data-state="queued" title="Waiting for the NAS to copy the files'+(n.by?' (sent by '+esc(n.by)+')':'')+'">'+ic('clock',14)+'Queued for NAS</span>';
  if(s==='done'){
    var bits=['On NAS'], t=nasTime(n.at);
    if(n.files!=null && n.files!=='') bits.push(n.files+' file'+(Number(n.files)===1?'':'s'));
    if(t) bits.push(t);
    return '<span class="nas-pill is-done" data-state="done" title="Saved on the NAS'+(n.by?' by '+esc(n.by):'')+'">'+ic('check',14)+esc(bits.join(' · '))+'</span>';
  }
  if(s==='error') return '<span class="nas-pill is-error" data-state="error" title="'+esc(n.msg || 'The NAS did not take the files')+'">'+ic('warn',14)+'NAS error — try again</span>';
  return '<span class="nas-pill is-none" data-state=""'+(n.msg?' title="'+esc(n.msg)+'"':'')+'>Not on NAS'+(n.msg?' · photo changed':'')+'</span>';
}
function nasCell(L){
  if(!_canNas) return '';
  var s=nasState(L), h='<span class="nas">'+nasPill(L);
  if(s==='' || s==='error'){
    var ship=String(L.shipmentKey||''), why=nasWhy(L), busy=!!_nasBusy[ship];
    h+='<button type="button" class="nas-btn" data-ship="'+esc(ship)+'"'+((why || busy || !ship)?' disabled':'')+'>'
      +(busy ? 'Sending…' : ic(s==='error'?'refresh':'nas',14)+(s==='error'?'Try again':'Save to NAS'))+'</button>'
      +(why?'<span class="nas-why">'+esc(why)+'</span>':'');
  }
  return h+'</span>';
}
function _lorryName(L){ var hb=L.handledBy && L.handledBy.type==='SALESMAN' ? L.handledBy : null; return hb ? ('salesman '+(hb.id||'')) : String(L.vehicleNo||'this lorry'); }
function askNas(btn){
  var ship=btn.getAttribute('data-ship'), L=_findLorry(ship); if(!L || nasWhy(L)) return;
  if(!DEMO && !_authToken()){ showLock('Unlock to save to the NAS'); return; }
  var n=nasCounts(L).files;
  openSheet({ title:'Save to NAS', text:'Save all '+n+' POD file'+(n===1?'':'s')+' of '+_lorryName(L)+' to the NAS?',
    okText:'Save to NAS', onOk:function(){ saveNas(ship); } });
}
async function saveNas(ship){
  var L=_findLorry(ship); if(!L || _nasBusy[ship]) return;
  if(DEMO){
    L.nas={ state:'queued', at:new Date().toLocaleTimeString('en-GB',{ timeZone:'Asia/Kuala_Lumpur', hour:'2-digit', minute:'2-digit', hour12:false }), by:'DEMO', files:nasCounts(L).files, msg:'' };
    render(); toast('ok','Demo: Save to NAS not sent'); return;
  }
  if(!_authToken()){ showLock('Unlock to save to the NAS'); return; }
  var btn=_liveBtn('nas-btn', ship), label=btn ? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  _nasBusy[ship]=true; _writesInFlight++;
  var tok=_newToken('nas');
  var rd=await postWithToken({ formType:'ARCHIVE_POD_NAS', shipmentKey:ship, date:String((_boardData && _boardData.date) || $('date').value),
                               branch:BRANCH, authToken:_authToken(), clientToken:tok }, tok);
  _writesInFlight--; delete _nasBusy[ship];
  L=_findLorry(ship);
  if(rd && rd.status==='success' && rd.nas && L){
    L.nas=rd.nas; render();
    var s=nasState(L);
    if(s==='error') toast('err','NAS error: '+esc(rd.nas.msg || 'try again'));
    else toast('ok',(s==='done'?'Saved on the NAS &#10003;':'Queued for the NAS')+' · '+esc(_lorryName(L)));
  } else {
    btn=_liveBtn('nas-btn', ship) || btn;
    if(btn){ btn.disabled=false; if(label) btn.innerHTML=label; }
    toast('err','Not saved to the NAS: '+esc((rd && rd.message) || 'server error'));
  }
}

/* ============================================================================
   READ GRANT (management reads)                                  [2026-07-30]
   The analytics reads used to answer any anonymous caller — all 59 drivers'
   compliance rankings and company fuel spend were world-readable. They now need
   a short-lived grant: POST the office session once, get a 6h grant, append it
   to the read URLs. The 30-day session token itself never rides in a URL.
   ============================================================================ */
var RG_KEY = 'clf_read_grant';
function _rgCached(){
  try{
    var g = JSON.parse(localStorage.getItem(RG_KEY) || 'null');
    if (g && g.grant && (Date.now() - (g.ts||0)) < 5.5*3600e3) return g.grant;   // refresh before the 6h server TTL
  }catch(e){}
  return '';
}
function _rgClear(){ try{ localStorage.removeItem(RG_KEY); }catch(e){} }
function _rgUrl(url){
  var g = _rgCached();
  return g ? (url + (url.indexOf('?') >= 0 ? '&' : '?') + 'grant=' + encodeURIComponent(g)) : url;
}
async function _rgEnsure(){
  var g = _rgCached();
  if (g) return g;
  var a = _rgAuth();
  if (!a || !a.token) return '';
  var tok = 'rg_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
  var fd = new FormData();
  fd.append('data', JSON.stringify({ formType:'GET_READ_GRANT', authToken:a.token, clientToken:tok }));
  try{ await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body:fd }); }catch(e){ return ''; }
  for (var t=0; t<8; t++){
    await new Promise(function(r){ setTimeout(r, 1200); });
    try{
      var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(tok));
      var rd = await rb.json();
      if (rd && rd.status && rd.status !== 'pending'){
        if (rd.status === 'success' && rd.grant){
          try{ localStorage.setItem(RG_KEY, JSON.stringify({ grant:rd.grant, ts:Date.now() })); }catch(e){}
          return rd.grant;
        }
        return '';
      }
    }catch(e){}
  }
  return '';
}
function _rgAuth(){ try{ return JSON.parse(localStorage.getItem('clf_pallet_auth') || 'null'); }catch(e){ return null; } }
