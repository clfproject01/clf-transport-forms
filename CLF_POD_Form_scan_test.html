    try{ var pp = s.video.play(); if (pp && pp.catch) pp.catch(function(){}); }catch(e){}
    var t0 = Date.now();
    while (_acLive(s) && !_acReady(s) && Date.now() - t0 < AC_READY_TIMEOUT_MS){
      await new Promise(function(r){ setTimeout(r, 100); });
    }
    if (!_acLive(s)) return;   // closeAutoCapture already stopped s.stream
    if (!_acReady(s)) throw new Error('camera not ready');
    s.ready = true;
    if (!ev) setTimeout(function(){ if (_acLive(s)) _acGhost(0, true); }, AC_GHOST_MS);
    try{ window._acCamRes = [s.video.videoWidth, s.video.videoHeight]; _scanDebug_(); }catch(e){}
    try{
      var caps = (s.track && s.track.getCapabilities) ? s.track.getCapabilities() : {};
      if (caps && caps.torch){ s.torchOK = true; _acEl('acTorch').style.display = 'inline-flex'; }
    }catch(e){}
    _acStatus(ev ? (s.kind === 'pallet' ? L('Take a photo of the pallets', 'Ambil gambar pallet') : L('Take a photo of the shop or the problem', 'Ambil gambar kedai atau masalah'))
                 : L('Put the invoice in the frame', 'Letak invois dalam bingkai'), 0);
    s.lastTick = 0;
    s.raf = requestAnimationFrame(function(){ _acTick(s); });
  }catch(err){
    clearTimeout(wd);
    console.warn('AutoCap unavailable:', err);
    if (stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    if (_acLive(s)) _acFallback(s, (err && err.name) || (err && err.message) || 'error', false);   // a stale rejection must not touch a newer session
  }
}

function _acTorch(s, on){
  if (!s || !s.track || !s.torchOK) return;
  try{ s.track.applyConstraints({ advanced: [{ torch: !!on }] }).then(function(){ s.torchOn = !!on; var b = _acEl('acTorch'); if (b && _acLive(s)) b.style.background = on ? '#FBBF24' : 'rgba(255,255,255,.15)'; }).catch(function(){}); }catch(e){}
}

function _acTick(s){
  if (!_acLive(s)) return;
  s.raf = requestAnimationFrame(function(){ _acTick(s); });
  var now = Date.now();
  if (now - s.lastTick < AC_INTERVAL_MS || s.busy) return;
  s.lastTick = now;
  var v = s.video;
  if (s.track && s.track.readyState !== 'live'){ _acFallback(s, 'camera stopped', false); return; }   // another app took the camera
  if (!(v.videoWidth > 0)) return;
  if (s.mode === 'evidence') return;   // proof / pallet photo: the driver frames it and taps — nothing to analyse
  try{
    // 1) working copy ≤640px (same scale class the after-the-fact gate uses)
    var c = s.canvas, ctx = s.ctx, W = v.videoWidth, H = v.videoHeight, sc = 640 / Math.max(W, H);
    c.width = Math.max(8, Math.round(W * sc)); c.height = Math.max(8, Math.round(H * sc));
    ctx.drawImage(v, 0, 0, c.width, c.height);
    // 2) 48px luminance map → mean brightness, motion vs previous frame, and distance from the frame we last SHOT
    var m = s.mini, mx = s.minictx; m.width = 48; m.height = Math.max(8, Math.round(48 * c.height / c.width));
    mx.drawImage(c, 0, 0, m.width, m.height);
    var d = mx.getImageData(0, 0, m.width, m.height).data, n = m.width * m.height, lum = new Float32Array(n), sum = 0;
    for (var i = 0, p = 0; p < n; i += 4, p++){ lum[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; sum += lum[p]; }
    var mean = sum / n, motion = 999, hasPrev = !!(s.prevLum && s.prevLum.length === n);
    if (hasPrev){ var md = 0; for (var q = 0; q < n; q++) md += Math.abs(lum[q] - s.prevLum[q]); motion = md / n; }
    s.prevLum = lum;
    // distance from the captured frame accumulates over a slow paper swap and returns to ~0 after a bump-and-settle (review F4)
    var fromShot = 0;
    if (s.capturedLum){
      if (s.capturedLum.length === n){ var cd = 0; for (var q2 = 0; q2 < n; q2++) cd += Math.abs(lum[q2] - s.capturedLum[q2]); fromShot = cd / n; }
      else fromShot = 999;   // stream resized (rotation) after the shot — cannot compare, treat as changed (review N3)
    }
    // 3) after a shot: cool down, then insist the scene really changed (next invoice) before re-arming
    if (s.cooldownUntil > now){ s.stable = 0; if (s.cooldownMsg) _acStatus(s.cooldownMsg, 0, 'ok'); return; }   // after a FAILED shot the "Not clear" text stays (review N1)
    if (s.pendingEntry){ s.stable = 0; return; }   // "Upload anyway" is waiting for the driver — no auto re-shoot, manual shutter still works (review N2)
    if (!s.changedSinceCapture){
      if (fromShot > AC_CHANGE_MIN){ s.changedSinceCapture = true; s.capturedLum = null; }
      else { s.stable = 0; _acPulse(now - s.lastShotAt > AC_MANUAL_HINT_MS); _acStatus(L('Put the NEXT invoice in the frame', 'Letak invois SETERUSNYA dalam bingkai'), 0, 'warn'); return; }
    }
    // 4) the very same three checks as the upload gate
    var qr = checkPhotoQuality_(c, ctx), r = qr.reasons || [], msg = null;
    if (r.indexOf('exposure') >= 0) msg = mean < 40 ? L('Too dark, more light please', 'Terlalu gelap, perlu cahaya') : L('Too bright or glare', 'Terlalu terang atau silau');
    else if (r.indexOf('cut') >= 0) msg = L('Fit the whole invoice in the frame', 'Masukkan seluruh invois dalam bingkai');
    else if (r.indexOf('blur') >= 0) msg = mean < 90 ? L('Put the invoice in the frame', 'Letak invois dalam bingkai') : L('Move closer and hold steady', 'Dekat sikit dan pegang stabil');
    else if (motion > AC_MOTION_MAX) msg = L('Hold still…', 'Pegang stabil…');
    if (msg){
      s.stable = 0;
      _acPulse(now - Math.max(s.openedAt, s.lastShotAt) > AC_MANUAL_HINT_MS);
      _acStatus(msg, 0, r.length ? 'warn' : null);
      return;
    }
    s.stable++;
    _acPulse(false);
    if (s.stable === 1) _acGhost(0, true);
    _acStatus(L('Hold…', 'Tahan…'), s.stable / AC_STABLE_FRAMES, 'ok');
    if (s.stable >= AC_STABLE_FRAMES){ s.stable = 0; _acCapture(s, false); }
  }catch(e){
    console.warn('AutoCap tick failed:', e);   // fail-open: the manual shutter and the OS-camera link still work
  }
}

async function _acCapture(s, manual){
  if (!_acLive(s) || s.busy) return;
  s.busy = true;
  s.pendingEntry = null; _acShowAnyway(false);   // a new attempt always supersedes a stale "Upload anyway" candidate (review F3)
  try{
    var v = s.video;
    if (!(v.videoWidth > 0)) throw new Error('no frame');
    var fc = document.createElement('canvas'); fc.width = v.videoWidth; fc.height = v.videoHeight;
    fc.getContext('2d').drawImage(v, 0, 0);
    var shotLum = s.prevLum;   // the analysed frame closest to this shot — the "did the scene change" reference
    var blob = await new Promise(function(res){ fc.toBlob(res, 'image/jpeg', 0.92); });
    fc.width = 0; fc.height = 0; fc = null;   // [Scanner] a 4K frame is ~33 MB on a 2 GB phone
    if (!blob) throw new Error('toBlob failed');
    var entry;
    try{ entry = await compressImage(blob); }catch(e){ entry = await readFileAsDataUrl(blob); }
    if (!_acLive(s)) return;   // overlay closed / re-opened while compressing — drop, never land on another stop (review F2)
    if (s.mode === 'evidence'){
      // proof / pallet photo: no quality gate, no scan — any clear shot of the shop or the pallets will do
      var cb = s.onPhoto;
      try{ if (navigator.vibrate) navigator.vibrate(60); }catch(e){}
      closeAutoCapture();
      if (cb) cb(entry);
      return;
    }
    if (entry.quality && !entry.quality.ok){
      // Auto mode can get here too (full-res vs 640px resample near a threshold) — count it, say why, and
      // offer "Upload anyway" at 3 either way, instead of silently re-shooting every second (review F5).
      var TXT = { cut: L('cut off', 'terpotong'), blur: L('blurry', 'kabur'), exposure: L('too bright or dark', 'terlalu terang atau gelap') };
      var why = entry.quality.reasons.map(function(x){ return TXT[x] || x; }).join(', ');
      s.fails++;
      if (s.fails >= 3){ s.pendingEntry = entry; _acShowAnyway(true); _acStatus(L('Not clear: ' + why + '. Retake, or tap Upload anyway.', 'Tidak jelas: ' + why + '. Ambil semula, atau tekan Hantar juga.'), 0, 'warn'); }
      else if (manual || s.fails >= 2) _acStatus(L('Not clear: ' + why + '. Retake.', 'Tidak jelas: ' + why + '. Ambil semula.'), 0, 'warn');
      s.cooldownMsg = null; s.cooldownUntil = Date.now() + 800;   // brief pause so the loop does not re-fire on the very next frame
      return;
    }
    // [Scanner] show the scan copy; Retake keeps the camera on the SAME invoice
    try{
      var _rev = await scanAndReview_(blob, entry);
      if (!_acLive(s)){   // camera closed during the review (screen lock, call): keep a photo the driver chose to Use
        if (_rev){ try{ var _kept = _addPhotoToGroup(s.gKey, _rev, null); if (_kept.added){ renderShipmentList(); _palletToast('ok', L('Photo kept', 'Foto disimpan'), 'top'); } }catch(e){} }
        return; }
      if (!_rev){ s.cooldownMsg = null; s.cooldownUntil = Date.now() + 900; s.stable = 0;
        _acStatus(L('Retake the same invoice', 'Ambil semula invois yang sama'), 0, 'warn'); return; }
      entry = _rev;
    }catch(scanErr){ console.warn('scan review failed open:', scanErr); }
    s.capturedLum = shotLum;
    try{ entry.name = 'autocap_' + Date.now() + ((entry.name || '').match(/_scan[CF]/) || [''])[0] + '.jpg'; }catch(e){}   // office can tell auto shots apart; keeps compressImage's _scanC/_scanF marker
    _acAccept(s, entry);
  }catch(e){
    console.warn('AutoCap capture failed:', e);
    if (_acLive(s)) _acStatus(L('Could not take the photo, try again', 'Gagal ambil foto, cuba lagi'), 0, 'warn');
  }finally{ s.busy = false; }
}

function _acAccept(s, entry){
  if (!_acLive(s)) return;
  var g = _acGroupOf(s);
  var res = _addPhotoToGroup(s.gKey, entry, g);
  if (!res.added){ closeAutoCapture(); renderShipmentList(); return; }
  s.fails = 0; s.captures++; s.pendingEntry = null; _acShowAnyway(false); _acPulse(false); _qGateTries = 0;
  try{ var f = _acEl('acFlash'); if (f){ f.style.opacity = '.55'; setTimeout(function(){ f.style.opacity = '0'; }, 160); } }catch(e){}
  try{ if (navigator.vibrate) navigator.vibrate(60); }catch(e){}
  try{
    if (s.audio){ var o = s.audio.createOscillator(), gn = s.audio.createGain();
      o.frequency.value = 1200; gn.gain.value = 0.08; o.connect(gn); gn.connect(s.audio.destination); o.start(); o.stop(s.audio.currentTime + 0.07); }
  }catch(e){}
  g = res.group;
  var need = _acPending(g).length, have = (g.photos || []).length;
  if (have >= need){
    closeAutoCapture();
    renderShipmentList();
    _palletToast('ok', L('<b>All photos taken &#10003;</b> Tap <b>Save</b>.', '<b>Semua foto siap &#10003;</b> Tekan <b>Simpan</b>.'), 'top');   // top: never covers the Save button (D5)
    try{ var card = document.querySelector('.ship-save[data-i="' + _shipGroups.indexOf(g) + '"]'); if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }catch(e){}
    return;
  }
  s.cooldownMsg = '&#10003; ' + L('Next invoice', 'Invois seterusnya');
  s.cooldownUntil = Date.now() + AC_COOLDOWN_MS;
  s.lastShotAt = Date.now();
  s.changedSinceCapture = false; s.stable = 0;
  _acHeader(s);
}

function _acFallback(s, reason, userGesture){
  console.warn('AutoCap fallback:', reason);
  if (s) s.fellBack = true;   // closeAutoCapture must not count this close a second time
  closeAutoCapture(true);
  // Only DEFINITIVE reasons switch this session to the phone camera for good (permission denied, no camera).
  // Camera busy / slow start / stream died are retried on the next tap; two soft failures in a row also switch (audit M3).
  // [Round1 2026-10-23] there is no "Use phone camera" button any more — the phone camera is only this emergency path.
  if (/NotAllowed|NotFound|Security|OverconstrainedError/i.test(String(reason || ''))){ _acOff = true; }
  else { _acFails++; if (_acFails >= 2) _acOff = true; }
  // These failures arrive outside a tap; browsers refuse a programmatic file-input click there, so do NOT leave
  // _deliverIdx armed (it would silence the visibilitychange re-sync all day — review F1).
  _deliverIdx = -1;
  renderShipmentList();   // photos captured before the camera died must show on the card (review S1)
  _palletToast('warn', _acOff
    ? L('The camera cannot open here. Tap the camera button again to use the phone camera.', 'Kamera tidak dapat dibuka di sini. Tekan butang kamera sekali lagi untuk guna kamera telefon.')
    : L('Camera stopped. Tap the camera button to try again.', 'Kamera terhenti. Tekan butang kamera untuk cuba lagi.'), 'top');
}

function closeAutoCapture(keepDeliverIdx){
  var s = _ac;
  if (!s) return;
  s.closed = true;
  try{ document.documentElement.style.overflow = ''; document.body.style.overflow = ''; }catch(e){}
  // closed with × while the camera never got going (D2): count it, so a phone whose camera never
  // delivers frames ends up on the OS camera after the second try instead of stalling every stop
  if (!s.fellBack){
    if (!s.ready && Date.now() - s.openedAt > 2500){ _acFails++; if (_acFails >= 2) _acOff = true; }
    else if (s.ready) _acFails = 0;
  }
  try{ if (s.raf) cancelAnimationFrame(s.raf); }catch(e){}
  try{ if (s.torchOn) _acTorch(s, false); }catch(e){}
  try{ if (s.stream) s.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  try{ s.video.srcObject = null; }catch(e){}
  try{ if (s.audio && s.audio.close) s.audio.close(); }catch(e){}
  var ov = _acEl('acOverlay'); if (ov) ov.style.display = 'none';
  _ac = null;
  if (!keepDeliverIdx) _deliverIdx = -1;
}
// The camera must never keep running behind a backgrounded tab (battery, privacy) or across navigation.
document.addEventListener('visibilitychange', function(){ if (document.hidden && _ac){ _ac.fellBack = true; closeAutoCapture(); renderShipmentList(); } });   // fellBack: a call/app-switch is not a camera failure (review N1)
window.addEventListener('pagehide', function(){ if (_ac){ _ac.fellBack = true; closeAutoCapture(); } });

// [Scanner TEST] what Save would upload: scan copies + backup originals, sizes and scan facts
function _scanTestSummary_(g, photos, originals, invoiceNos){
  var kb = function(b64){ return Math.round((b64 || '').length * 0.75 / 1024); };
  var sTot = photos.reduce(function(a, p){ return a + kb(p.base64); }, 0), oTot = originals.reduce(function(a, p){ return a + kb(p.base64); }, 0);
  var rows = g.photos.map(function(p, k){
    var sc = p.scan || {}, st = sc.ok ? (sc.cropped ? (sc.adjusted ? L('scanned (corners adjusted)', 'diimbas (sudut dilaras)') : L('scanned', 'diimbas')) : L('whitened, edges not found', 'diputihkan, tepi tidak dikesan')) : L('plain photo', 'foto biasa') + (sc.err ? ' — ' + _esc(sc.err) : '');
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #E2E8F0;">'
      + '<img src="' + p.dataUrl + '" style="width:84px;border:1px solid #CBD5E1;border-radius:4px;background:#fff;">'
      + (p.origDataUrl ? '<img src="' + p.origDataUrl + '" style="width:58px;border:1px solid #CBD5E1;border-radius:4px;opacity:.85;">' : '')
      + '<div style="font-size:12px;line-height:1.45;color:#0F172A;"><b>' + _esc(invoiceNos[k] || ('#' + (k + 1))) + '</b><br>' + st
      + '<br>' + L('scan ', 'imbasan ') + kb(photos[k].base64) + ' KB' + (sc.out ? ' · ' + sc.out[0] + '×' + sc.out[1] : '')
      + (p.origDataUrl ? '<br>' + L('original ', 'asal ') + kb(p.origDataUrl.split(',')[1]) + ' KB' : '') + (sc.ms ? '<br>' + sc.ms + ' ms' : '') + '</div></div>';
  }).join('');
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9900;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:14px;';
  ov.innerHTML = '<div style="background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:16px;">'
    + '<div style="font-size:16px;font-weight:800;color:#B91C1C;">' + L('TEST — nothing was saved', 'UJIAN — tiada apa disimpan') + '</div>'
    + '<div style="font-size:13px;color:#475569;margin:2px 0 10px;">' + L('A real Save would upload:', 'Simpan sebenar akan muat naik:') + '</div>'
    + '<div style="font-size:13px;color:#0F172A;"><b>' + photos.length + '</b> ' + L(photos.length === 1 ? 'scan copy' : 'scan copies', 'salinan imbasan') + ' (' + sTot + ' KB)'
    + ' + <b>' + originals.length + '</b> ' + L(originals.length === 1 ? 'backup original' : 'backup originals', 'foto asal simpanan') + ' (' + oTot + ' KB) = <b>' + (sTot + oTot) + ' KB</b></div>'
    + rows
    + '<div style="display:flex;gap:8px;margin-top:12px;">'
    +   '<button type="button" id="stKeep" style="flex:1;padding:12px;background:#fff;color:#0F172A;border:1.5px solid #CBD5E1;border-radius:10px;font-weight:700;">' + L('Keep photos', 'Simpan foto') + '</button>'
    +   '<button type="button" id="stClear" style="flex:1;padding:12px;background:#141C77;color:#fff;border:none;border-radius:10px;font-weight:700;">' + L('Clear &amp; try again', 'Padam &amp; cuba lagi') + '</button>'
    + '</div></div>';
  document.body.appendChild(ov);
  ov.querySelector('#stKeep').onclick = function(){ ov.remove(); };
  ov.querySelector('#stClear').onclick = function(){
    var cur = _shipGroups.filter(function(x){ return x.key === g.key; })[0];   // the re-read after Save rebuilds the groups
    if (g.photos) g.photos.length = 0; g.photos = []; if (cur) cur.photos = []; ov.remove(); renderShipmentList(); };
}

// STEP 2: Save → submit the buffered photos → mark this customer's invoices delivered
async function saveDelivery(i){
  var g = _shipGroups[i];
  if (!g) return;
  // Double-tap guard: a 2nd tap before the overlay paints used to re-enter and double-submit
  // (duplicate POD rows + double KPI credit) — same fix as the fuel form's submit button.
  if (g._saving) return;
  g._saving = true;
  if (!g.photos || !g.photos.length){ g._saving = false; alert(L('Take a photo first', 'Sila ambil foto dulu')); return; }
  var _tagged = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered' && !x._untag; }).map(function(x){ return x.invoiceNo; });
  if (!_tagged.length){ g._saving=false; alert(L('Select at least one invoice to deliver', 'Pilih sekurang-kurangnya satu invois')); return; }
  if (g.photos.length !== _tagged.length){ g._saving=false; alert(L('Photos must equal invoices: ' + g.photos.length + ' photos, ' + _tagged.length + ' invoices', 'Bilangan foto mesti sama dengan invois: ' + g.photos.length + ' foto, ' + _tagged.length + ' invois')); return; }
  // [Round2] no driver picked = a POD that counts for nobody (KPI): send the driver to the trip card first
  if (!_smMode && !document.getElementById('driverName').value){
    g._saving = false;
    _tripOpen = true; _tripRender();
    var _ed = document.getElementById('err-driver'); if (_ed) _ed.classList.add('show');
    try{ var _ds = document.getElementById('driverSearch'); _ds.focus(); _ds.scrollIntoView({ block: 'center' }); }catch(e){}
    _palletToast('err', L('Choose the driver first, then tap Save again.', 'Pilih pemandu dulu, kemudian tekan Simpan semula.'), 'top');
    return;
  }
  var overlay = document.getElementById('loadingOverlay');
  document.querySelector('.loading-text').textContent = L('Saving…', 'Menyimpan…');
  overlay.classList.add('show');
  try{
    var photos = g.photos.map(function(p){ return { base64: p.dataUrl.split(',')[1], name: p.name, type: p.type }; });
    // [Scanner] backup originals, index-aligned with photos[] (forIndex). The live backend must store
    // these in a separate folder/column before this ships — an old backend simply ignores the field.
    var originals = g.photos.map(function(p, k){ return p.origDataUrl ? { base64: p.origDataUrl.split(',')[1],
      name: String(p.name || ('invoice_' + k)).replace(/(_scan[CF])?\.jpg$/i, '') + '_orig.jpg', type: 'image/jpeg', forIndex: k } : null; }).filter(Boolean);
    if (SCAN_TEST){ overlay.classList.remove('show'); g._saving = false; _scanTestSummary_(g, photos, originals, _tagged); return; }
    var pendingInvs = _tagged;   // [untag] only the invoices the driver kept tagged (delivered)
    var _drv = document.getElementById('driverName').value;
    var _sd  = document.getElementById('secondDriver').value || '';
    if (_sd === _drv) _sd = '';   // same name twice → drop helper (avoid double KPI count)
    var now = new Date();
    // A3: send a clientToken and poll the read-back endpoint for the REAL result —
    // no-cors alone can't see server errors, so before this fix a failed save still showed "Delivered".
    var token = 'pod_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    var payload = { formType:'SUBMIT_POD_FOR_INVOICE', branch: BRANCH, shipmentKey:_shipKey, invoiceNos:pendingInvs,
      driverName: _drv, secondDriver: _sd,
      vehicleNo: document.getElementById('vehicleNo').value, deliveryDate: document.getElementById('deliveryDate').value,
      timestamp: now.toISOString(), photos: photos, originals: originals, clientToken: token,
      // [E5] true if ANY included photo was force-uploaded past the quality gate
      qualityFlag: g.photos.some(function(p){ return !!p.qualityFlag; }) };
    if (_smMode){ payload.salesmanId = _smId; payload.pin = _smPin; payload.gps = _smGps || null; payload.driverName = ''; payload.secondDriver = ''; }   // [Salesman] server resolves identity
    var fd = new FormData(); fd.append('data', JSON.stringify(payload));
    // 90s upload timeout — on dead signal fetch can hang forever behind the overlay, and drivers
    // kill the tab (losing buffered photos). Abort → catch → photos kept + clear retry message.
    var _ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var _tmo = _ctrl ? setTimeout(function(){ _ctrl.abort(); }, 90000) : null;
    try{
      await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: fd, signal: _ctrl ? _ctrl.signal : undefined });
    } finally { if (_tmo) clearTimeout(_tmo); }

    document.querySelector('.loading-text').textContent = L('Confirming…', 'Mengesahkan…');
    var confirmed = null;
    for (var t = 0; t < 8; t++){
      await new Promise(function(r){ setTimeout(r, 1500); });
      try{
        var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token));
        var rd = await rb.json();
        if (rd && rd.status && rd.status !== 'pending'){ confirmed = rd; break; }
      }catch(e){ /* keep polling */ }
    }
    if (confirmed && confirmed.status === 'error'){
      // REAL failure — keep the photos so the driver can just hit Save again.
      alert(L('NOT saved!\n' + (confirmed.message || 'Server error') + '\n\nYour photos are kept. Please tap Save again.',
              'TIDAK disimpan!\n' + (confirmed.message || 'Ralat pelayan') + '\n\nFoto anda masih ada. Sila tekan Simpan semula.'));
    } else if (confirmed){
      g.invs.forEach(function(x){ if(!x._untag && String(x.status).toLowerCase()!=='delivered') x.status='delivered'; x._untag=false; });   // [untag] only tagged ones delivered; untagged stay pending
      g.photos = [];
      if (!_smMode){ firePalletDrop(g); firePalletCollect(g); }   // [Salesman] private cars carry no pallets
      renderShipmentList();
    } else {
      // No confirmation (weak signal) — show as delivered but KEEP the photos; the read-back
      // below re-syncs with the server and only drops photos once it confirms delivered.
      g.invs.forEach(function(x){ x.status='delivered'; });
      if (!_smMode){ firePalletDrop(g); firePalletCollect(g); }   // [Salesman] private cars carry no pallets
      renderShipmentList();
    }
  }catch(err){
    alert(L('Save failed, please try again.\n(Your photos are kept.)', 'Simpan gagal, sila cuba lagi.\n(Foto anda masih ada.)'));
  }finally{
    g._saving = false;
    overlay.classList.remove('show');
    setTimeout(function(){ checkShipmentForVehicle(true); }, 2500);   // read-back to confirm (no-cors); keep list if read-back fails
  }
}

// mark all of a customer's pending invoices as not-delivered, with a reason
// A5: check the server's ACTUAL response per invoice — only paint "Problem" when the sheet
// really recorded it (before this, a server error still showed red on the phone = wrong data).
async function failGroup(i, reason){
  var g = _shipGroups[i]; if (!g) return;
  if (SCAN_TEST){ var _pc = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered'; }).length;
    alert(L('TEST — nothing saved.\nWould mark ' + _pc + (_pc === 1 ? ' invoice' : ' invoices') + ' as: ' + _reasonLabel(reason),
            'UJIAN — tiada apa disimpan.\nAkan tandakan ' + _pc + ' invois sebagai: ' + _reasonLabel(reason))); return; }
  if (g._saving) return;            // double-tap guard (same as saveDelivery)
  g._saving = true;
  var pending = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered'; });
  var overlay = document.getElementById('loadingOverlay');
  document.querySelector('.loading-text').textContent = L('Saving…', 'Menyimpan…');
  overlay.classList.add('show');
  var errMsg = '';
  try{
    if (g._failProof || _smMode){
      // [FailProof] one batch POST: all pending invoices + the proof photo (uploaded ONCE).
      // no-cors hides the response, so poll the standard clientToken readback for the real result.
      var token = 'flp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      var fd = new FormData();
      fd.append('data', JSON.stringify({ formType:'MARK_INVOICE_FAILED', shipmentKey:_shipKey,
        invoiceNos: pending.map(function(x){ return x.invoiceNo; }), reason: reason,
        photo: g._failProof || null, branch: BRANCH,
        salesmanId: (_smMode ? _smId : undefined), pin: (_smMode ? _smPin : undefined), gps: (_smMode ? (_smGps || null) : undefined),
        driverName: document.getElementById('driverName').value || '', clientToken: token }));
      await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: fd });
      var confirmed = null;
      for (var t = 0; t < 8; t++){
        await new Promise(function(r){ setTimeout(r, 1500); });
        try{
          var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token));
          var rd = await rb.json();
          if (rd && rd.status && rd.status !== 'pending'){ confirmed = rd; break; }
        }catch(pe){ /* keep polling */ }
      }
      if (confirmed && confirmed.status === 'success'){
        var okSet = {}; (confirmed.failed || []).forEach(function(n){ okSet[n] = true; });
        pending.forEach(function(x){ if (okSet[x.invoiceNo]) x.status = 'failed'; });
        g._failProof = null;   // consumed
      } else {
        errMsg = (confirmed && confirmed.message) ? confirmed.message : 'no confirmation - photo kept, try again';
      }
    } else {
      for (var k=0; k<pending.length; k++){
        var res = await fetch(SCRIPT_URL + '?action=MARK_INVOICE_FAILED&shipmentKey=' + encodeURIComponent(_shipKey)
          + '&invoiceNo=' + encodeURIComponent(pending[k].invoiceNo) + '&reason=' + encodeURIComponent(reason));
        var d = null; try{ d = await res.json(); }catch(je){}
        if (d && d.status === 'success'){ pending[k].status = 'failed'; }
        else { errMsg = (d && d.message) ? d.message : 'server error'; }
      }
    }
  }catch(e){ errMsg = 'no connection'; }
  finally{
    g._saving = false;
    overlay.classList.remove('show');
    if (errMsg) alert(L('Some were NOT saved (' + errMsg + '). Please try again.', 'Sebahagian TIDAK disimpan (' + errMsg + '). Sila cuba lagi.'));
    else { delete _shipProblem[g.key]; _shipFailReason[g.key] = reason; }   // [Round1] stop marked: leave Problem mode; [Round2] its pill shows the reason
    renderShipmentList();
  }
}

// wire vehicle + date selection to the shipment check (wrappers so the change-event isn't passed as keepListOnFail)
document.getElementById('vehicleNo').addEventListener('change', function(){
  try{ localStorage.setItem(VEHICLE_KEY, this.value || ''); }catch(e){}   // B5: remember across reloads
  // Clear any auto-filled crew first, so it can't keep showing the PREVIOUS lorry's drivers.
  // The newly-selected lorry's assigned crew re-fills from its own shipment (or stays blank if none matches).
  ['driverName','secondDriver'].forEach(function(id){ var h=document.getElementById(id); if(h) h.value=''; });
  ['driverSearch','secondSearch'].forEach(function(id){ var s=document.getElementById(id); if(s) s.value=''; });
  ['staffIdBadge','staffIdBadge2'].forEach(function(id){ var b=document.getElementById(id); if(b){ b.style.display='none'; b.textContent=''; } });
  _tripRender();
  checkShipmentForVehicle();
});
document.getElementById('deliveryDate').addEventListener('change', function(){ _tripRender(); checkShipmentForVehicle(); });


/* ============================================================================
   SALESMAN MODE (A+B2)                                          [2026-07-24]
   Office marks a DL "handled by salesman"; the rep opens this same form via the
   DSR "My Deliveries" button (?sm=1&id=TER%20500) or the toggle below, signs in
   with staff ID + personal PIN (Salesmen sheet), and gets ONLY his marked DLs —
   station photos / untag / count-match / FailProof reused unchanged. Submits
   carry salesmanId+pin+gps; the backend writes ZERO POD_Data rows (KPI walls).
   ============================================================================ */
var _smMode = false, _smId = '', _smPin = '', _smName = '', _smGps = null;
var SM_AUTH_KEY = 'clf_sm_auth';

function _smAuthed(){ return !!(_smId && _smPin); }
function _smStore(){ try{ localStorage.setItem(SM_AUTH_KEY, JSON.stringify({ id:_smId, pin:_smPin, name:_smName, ts:Date.now() })); }catch(e){} }
function _smRestore(){
  try{
    var a = JSON.parse(localStorage.getItem(SM_AUTH_KEY) || 'null');
    // [sec 2026-07-24] delivery-day TTL (was 30d): a raw PIN sitting in localStorage on a
    // borrowed/shared phone is a takeover risk — keep the remember-window short.
    if (a && a.id && a.pin && (Date.now() - (a.ts||0)) < 20*36e5){ _smId=a.id; _smPin=a.pin; _smName=a.name||''; return true; }
  }catch(e){}
  return false;
}
function _smSignOut(){ try{ localStorage.removeItem(SM_AUTH_KEY); }catch(e){} _smId=''; _smPin=''; _smName=''; smRenderGate(); }

// generic no-cors POST + clientToken readback (same machinery the pallet/admin tools use)
async function smPost(payload){
  var token = 'sm_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
  payload.clientToken = token;
  var fd = new FormData(); fd.append('data', JSON.stringify(payload));
  try{ await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: fd }); }
  catch(e){ return { status:'error', message: L('No connection', 'Tiada sambungan') }; }
  for (var t=0;t<8;t++){
    await new Promise(function(r){ setTimeout(r,1500); });
    try{
      var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token));
      var rd = await rb.json();
      if (rd && rd.status && rd.status !== 'pending') return rd;
    }catch(e){}
  }
  return { status:'error', message: L('No confirmation', 'Tiada pengesahan') };
}

function _smRefreshGps(){
  try{
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(p){ _smGps = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }; },
      function(){}, { enableHighAccuracy:true, timeout:5000, maximumAge:120000 });
  }catch(e){}
}

function _smFields(on){
  ['driverSearch','secondSearch','vehicleNo'].forEach(function(id){
    var el = document.getElementById(id);
    var f = el && el.closest ? el.closest('.field') : null;
    if (f) f.style.display = on ? 'none' : '';
  });
  var man = document.getElementById('manualPodSection');
  if (on && man) man.style.display = 'none';
}
function _smBanner(on){
  var b = document.getElementById('smBanner');
  if (!on){ if (b) b.remove(); return; }
  if (!b){
    b = document.createElement('div'); b.id = 'smBanner';
    b.style.cssText = 'background:#6D28D9;color:#fff;border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;';
    var form = document.getElementById('podForm');
    form.parentNode.insertBefore(b, form);
  }
  b.innerHTML = '<span>&#129333; ' + L('SALESMAN MODE', 'MOD JURUJUAL') + (_smName ? ' &middot; ' + _esc(_smName) : '') + (_smId ? ' (' + _esc(_smId) + ')' : '') + '</span>'
    + '<span><button type="button" id="smSignOut" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;">' + L('Sign out', 'Keluar') + '</button></span>';
  var so = document.getElementById('smSignOut'); if (so) so.onclick = _smSignOut;
}

function smEnter(prefillId){
  _smMode = true;
  document.body.classList.add('sm-mode');
  _smFields(true); _smBanner(true); _tripRender();
  var tl = document.getElementById('smToggleLink'); if (tl) tl.textContent = L('Driver mode', 'Mod pemandu');
  if (prefillId) _smId = String(prefillId).toUpperCase();
  if (_smAuthed()){ smLoadDeliveries(); } else { smRenderGate(); }
}
function smExit(){
  _smMode = false;
  document.body.classList.remove('sm-mode');
  _smFields(false); _smBanner(false); _tripRender();
  var tl = document.getElementById('smToggleLink'); if (tl) tl.textContent = L('Salesman →', 'Jurujual →');
  var sec = document.getElementById('shipmentSection');
  if (sec){ sec.style.display = 'none'; sec.innerHTML = ''; }
  _shipKey = ''; _shipGroups = [];
}

function smRenderGate(msg){
  var sec = document.getElementById('shipmentSection');
  if (!sec) return;
  sec.style.display = 'block';
  sec.innerHTML = '<div style="border:1.5px solid #C4B5FD;background:#F5F3FF;border-radius:12px;padding:16px;">'
    + '<div style="font-weight:800;font-size:15px;color:#5B21B6;margin-bottom:10px;">' + L('Salesman sign in', 'Log masuk jurujual') + '</div>'
    + '<label style="font-size:12px;font-weight:700;color:#4C1D95;">' + L('Staff ID', 'ID staf') + '</label>'
    + '<input id="smIdInput" autocomplete="off" placeholder="' + _escA(L('e.g. TER 500', 'cth. TER 500')) + '" value="' + _esc(_smId) + '" style="width:100%;box-sizing:border-box;margin:4px 0 10px;padding:12px;font-size:16px;border:1.5px solid #C4B5FD;border-radius:9px;">'
    + '<label style="font-size:12px;font-weight:700;color:#4C1D95;">PIN</label>'
    + '<input id="smPinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="' + _escA(L('6-digit PIN', 'PIN 6 digit')) + '" style="width:100%;box-sizing:border-box;margin:4px 0 6px;padding:12px;font-size:16px;border:1.5px solid #C4B5FD;border-radius:9px;">'
    + '<div id="smGateErr" style="min-height:16px;font-size:12px;color:#B91C1C;font-weight:600;">' + (msg ? _esc(msg) : '') + '</div>'
    + '<button type="button" id="smLoadBtn" style="width:100%;margin-top:8px;background:#6D28D9;color:#fff;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;">' + L('Load my deliveries', 'Muat penghantaran saya') + '</button>'
    + '</div>';
  var btn = document.getElementById('smLoadBtn');
  btn.onclick = function(){
    var id = document.getElementById('smIdInput').value.trim().toUpperCase();
    var pin = document.getElementById('smPinInput').value.trim();
    if (!id || !pin){ document.getElementById('smGateErr').textContent = L('Enter your Staff ID and PIN', 'Isi ID staf dan PIN'); return; }
    _smId = id; _smPin = pin;
    smLoadDeliveries();
  };
  var pi = document.getElementById('smPinInput');
  pi.addEventListener('keydown', function(e){ if (e.key === 'Enter') btn.onclick(); });
}

async function smLoadDeliveries(quiet){
  var sec = document.getElementById('shipmentSection');
  if (!sec) return;
  var date = document.getElementById('deliveryDate').value || new Date().toISOString().slice(0,10);
  if (!quiet){ sec.style.display='block'; sec.innerHTML = '<div style="padding:14px;text-align:center;color:#5B21B6;">' + L('Loading your deliveries…', 'Memuatkan penghantaran anda…') + '</div>'; }
  var rd = await smPost({ formType:'GET_SALESMAN_SHIPMENTS', salesmanId:_smId, pin:_smPin, date:date });
  if (!rd || rd.status === 'error'){
    _smPin = quiet ? _smPin : '';
    smRenderGate((rd && rd.message) || L('Could not load. Check your connection.', 'Tidak dapat dimuat. Semak talian anda.'));
    return;
  }
  _smName = (rd.salesman && rd.salesman.name) || _smName;
  _smStore(); _smBanner(true); _smRefreshGps();
  if (!rd.found || !rd.shipments || !rd.shipments.length){
    sec.style.display='block';
    sec.innerHTML = '<div style="padding:18px 14px;text-align:center;color:#5B21B6;font-size:14px;line-height:1.6;border:1.5px solid #C4B5FD;background:#F5F3FF;border-radius:10px;">'
      + '<div style="font-size:30px;margin-bottom:6px;">&#128230;</div>'
      + '<b>' + L('No delivery marked to you for ' + _esc(date) + '.', 'Tiada penghantaran ditandakan kepada anda untuk ' + _esc(date) + '.') + '</b>'
      + '<br><br>' + L('Ask the office to mark the DL to you.', 'Minta pejabat tandakan DL kepada anda.')
      + '</div>';
    _shipKey=''; _shipGroups=[];
    return;
  }
  // multiple marked DLs on one day: let the rep pick which one to work on
  window._smShipments = rd.shipments; window._smItems = rd.items || [];
  if (rd.shipments.length > 1 && !quiet){
    sec.style.display='block';
    sec.innerHTML = '<div style="border:1.5px solid #C4B5FD;background:#F5F3FF;border-radius:12px;padding:14px;">'
      + '<div style="font-weight:800;font-size:14px;color:#5B21B6;margin-bottom:8px;">' + L('Pick a delivery order', 'Pilih DL') + '</div>'
      + rd.shipments.map(function(s,i){
          return '<button type="button" class="sm-pick-dl" data-k="' + _esc(s.shipmentKey) + '" style="display:block;width:100%;text-align:left;margin-bottom:6px;background:#fff;border:1.5px solid #C4B5FD;border-radius:9px;padding:11px 12px;font-size:14px;cursor:pointer;"><b>' + _esc(s.shipmentKey) + '</b> &middot; ' + (s.itemCount||'?') + ' ' + L('invoices', 'invois') + '</button>';
        }).join('')
      + '</div>';
    sec.querySelectorAll('.sm-pick-dl').forEach(function(b){
      b.onclick = function(){ _smUseShipment(b.getAttribute('data-k')); };
    });
    return;
  }
  _smUseShipment((window._smShipments[0] || {}).shipmentKey, quiet);
}
function _smUseShipment(key, quiet){
  if (!key) return;
  _shipKey = key;
  var items = (window._smItems || []).filter(function(it){ return it.shipmentKey === key; });
  _buildGroups(items);
  var man = document.getElementById('manualPodSection'); if (man) man.style.display = 'none';
  var sec = document.getElementById('shipmentSection'); if (sec) sec.style.display = 'block';
  renderShipmentList();
}

// boot: toggle link + deep-link (?sm=1&id=TER%20500 — the DSR "My Deliveries" button)
// Salesman mode is reached ONLY via the DSR "My Deliveries" deep link (?sm=1&id=…) — there is
// deliberately NO toggle on the driver-facing form, so drivers never see a salesman control.
(function smBoot(){
  try{
    var q = new URLSearchParams(location.search);
    if (q.get('sm') === '1'){
      _smRestore();
      smEnter(q.get('id') || '');
    }
  }catch(e){ console.warn('smBoot failed', e); }
})();

</script>
