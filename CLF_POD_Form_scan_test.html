function _palletDisplayName(key){ var m = PALLET_MASTER.filter(function(x){ return x.palletKey === key; })[0]; return m ? (m.displayName || key) : key; }

// POST + no-cors + poll getImportResult — used when a pallet drop/collect carries a photo
// (base64 won't fit a GET URL). Mirrors the POD save's own readback pattern.
async function _palletPostWrite(payload){
  if (SCAN_TEST) return { status: 'error', message: L('TEST build — nothing is saved', 'UJIAN — tiada apa disimpan') };
  var token = payload.clientToken;
  var fd = new FormData();
  fd.append('data', JSON.stringify(payload));
  try{ await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: fd }); }
  catch(e){ return { status: 'error', message: L('No connection', 'Tiada sambungan') }; }
  for (var t = 0; t < 8; t++){
    await new Promise(function(r){ setTimeout(r, 1500); });
    try{
      var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token));
      var rd = await rb.json();
      if (rd && rd.status && rd.status !== 'pending') return rd;
    }catch(e){ /* keep polling */ }
  }
  return { status: 'success', weak: true };   // POST landed; dedup token makes a resend safe
}

// ===== Pallets-on-board banner (default-accept flow) =====
// After the shipment loads: show what the store assigned to this lorry. Correct = do nothing
// (deemed accepted). Wrong = driver taps, edits the actual counts, sends -> PALLET_ACCEPT rows.
var PALLET_ONBOARD = [];   // [{entryId, palletKey, displayName, assigned}]
async function fetchPalletOnboard(){
  try{
    if (!_shipKey) return;
    var res = await fetch(SCRIPT_URL + '?action=getPalletAssignForDate&shipmentKey=' + encodeURIComponent(_shipKey), { method: 'GET' });
    var data = await res.json();
    var sh = (data && data.status === 'ok' && Array.isArray(data.shipments)) ? data.shipments.filter(function(s){ return s.shipmentKey === _shipKey; })[0] : null;
    PALLET_ONBOARD = (sh && sh.lines) ? sh.lines.filter(function(l){ return (Number(l.assigned)||0) > 0; }) : [];
  }catch(e){ PALLET_ONBOARD = []; }
  renderPalletOnboard();
}
function renderPalletOnboard(){
  var sec = document.getElementById('shipmentSection');
  if (!sec) return;
  var box = document.getElementById('palletOnboard');
  if (!PALLET_ONBOARD.length){ if (box) box.remove(); return; }
  if (!box){ box = document.createElement('div'); box.id = 'palletOnboard'; sec.insertBefore(box, sec.firstChild); }
  var summary = PALLET_ONBOARD.map(function(l){ return _esc(l.displayName || l.palletKey) + ' &times;' + l.assigned; }).join(' &middot; ');
  box.innerHTML = '<div class="onboard">'
    + '<div class="ob-h">' + ICO.box + L('Pallets on lorry', 'Pallet atas lori') + '</div>'
    + '<div class="ob-s">' + summary + '</div>'
    + '<div class="ob-n">' + L('Correct? Do nothing.', 'Betul? Tak perlu buat apa-apa.') + '</div>'
    + '<button type="button" class="ob-fix" onclick="togglePalletFix()">' + L('Wrong count? Fix here', 'Jumlah salah? Betulkan') + '</button>'
    + '<div id="palletFixRows" style="display:none;"></div>'
    + '</div>';
}
function togglePalletFix(){
  var rows = document.getElementById('palletFixRows');
  if (!rows) return;
  if (rows.style.display === 'none'){
    rows.innerHTML = PALLET_ONBOARD.map(function(l, i){
      return '<div class="ob-row"><div class="nm">' + _esc(l.displayName || l.palletKey) + '<small>' + L('assigned ', 'diberi ') + l.assigned + '</small></div>'
        + '<input type="number" class="in" id="palletFix-' + i + '" inputmode="numeric" min="0" value="' + l.assigned + '"></div>';
    }).join('')
    + '<button type="button" class="ob-send" onclick="sendPalletFix()">' + L('Send the count you received', 'Hantar jumlah sebenar') + '</button>';
    rows.style.display = 'block';
  } else {
    rows.style.display = 'none';
  }
}
async function sendPalletFix(){
  var driver = document.getElementById('driverName').value || '';
  var changed = [];
  PALLET_ONBOARD.forEach(function(l, i){
    var el = document.getElementById('palletFix-' + i);
    if (!el) return;
    var got = parseInt(el.value, 10);
    if (!isNaN(got) && got !== Number(l.assigned) && l.entryId) changed.push({ entryId: l.entryId, acceptedQty: got, name: l.displayName || l.palletKey });
  });
  if (!changed.length){ _palletToast('ok', L('No change, the counts match', 'Tiada perubahan, jumlah sama')); togglePalletFix(); return; }
  for (var k = 0; k < changed.length; k++){
    var c = changed[k];
    var r = await _palletGetWrite('PALLET_ACCEPT', { entryId: c.entryId, acceptedQty: c.acceptedQty, driverName: driver, clientToken: _palletNewToken('acc') });
    if (r && r.status === 'success') _palletToast('ok', '<b>' + L('Correction sent', 'Pembetulan dihantar') + '</b><br>' + _esc(c.name) + ' → ' + c.acceptedQty);
    else _palletToast('err', '<b>' + L('Not sent', 'Gagal dihantar') + '</b><br>' + _esc(c.name) + ' — ' + _esc((r && r.message) || L('try again', 'cuba lagi')));
  }
  togglePalletFix();
  fetchPalletOnboard();   // re-pull so the banner shows the corrected numbers
}


// [Round1 2026-10-23] stop cards: icons instead of sentences, one language at a time, and Problem as its own
// mode — while the driver picks a reason there is no invoice camera, no Save and no pallet section, only the
// proof photo, the 4 reasons and Back. Classes and data-i / data-x are unchanged, so every click path works as before.
// [Round2 2026-10-23] the approved design: status pill (Belum / Dihantar / reason), invoice chips, one count line,
// thumbnails, pallets, then the big buttons. The ship-* classes the click handler uses are all still there.
var _shipProblem = {};      // g.key → true while that stop's Problem panel is open (survives re-renders and re-syncs)
var _shipFailReason = {};   // g.key → the reason marked on this phone (the delivery list itself does not carry it)
var SHIP_REASONS = [ ['Shop closed', 'Kedai tutup'], ['Rejected', 'Ditolak'], ['Partial', 'Sebahagian'], ['Reschedule', 'Jadual semula'] ];   // [0] = the value the server stores, never translated
function _reasonLabel(v){ for (var k = 0; k < SHIP_REASONS.length; k++){ if (SHIP_REASONS[k][0] === v) return L(SHIP_REASONS[k][0], SHIP_REASONS[k][1]); } return v; }
function _groupByKey(k){ for (var gi = 0; gi < _shipGroups.length; gi++){ if (_shipGroups[gi].key === k) return _shipGroups[gi]; } return null; }
function renderShipGroups(){
  var wrap = document.getElementById('shipGroupsWrap');
  if (!wrap) return;
  var q = String(_shipFilter||'').trim().toLowerCase();
  var disp = _shipGroups.map(function(g,i){ return { g:g, i:i }; });
  if (q){
    disp = disp.filter(function(d){
      return String(d.g.name||'').toLowerCase().indexOf(q)>=0
          || String(d.g.area||'').toLowerCase().indexOf(q)>=0
          || d.g.invs.some(function(x){ return String(x.invoiceNo||'').toLowerCase().indexOf(q)>=0; });
    });
  }
  function rank(g){   // [Round2] still to do first, then problems, delivered at the bottom
    if (g.invs.every(function(x){ return String(x.status).toLowerCase()==='delivered'; })) return 2;
    return g.invs.some(function(x){ return String(x.status).toLowerCase()==='failed'; }) ? 1 : 0;
  }
  disp.sort(function(a,b){ return rank(a.g)-rank(b.g) || a.i-b.i; });
  var html = '';
  if (!disp.length){ html = '<div class="foot">' + L('No match', 'Tiada padanan') + '</div>'; }
  disp.forEach(function(d){
    var g = d.g, i = d.i, n = g.invs.length;
    var gDone = g.invs.every(function(x){ return String(x.status).toLowerCase()==='delivered'; });
    var gFail = !gDone && g.invs.some(function(x){ return String(x.status).toLowerCase()==='failed'; });
    var pill = gDone ? '<span class="pill p-done">' + L('Delivered', 'Dihantar') + '</span>'
             : gFail ? '<span class="pill p-fail">' + _esc(_shipFailReason[g.key] ? _reasonLabel(_shipFailReason[g.key]) : L('Problem', 'Masalah')) + '</span>'
             : '<span class="pill p-wait">' + L('Not yet', 'Belum') + '</span>';
    html += '<article class="card' + (gDone ? ' done' : '') + '"><div class="c-top"><div class="c-main"><div class="c-name">' + _esc(g.name) + '</div>'
      + '<div class="c-meta">' + (g.area ? _esc(g.area) + ' &middot; ' : '') + n + ' ' + L(n === 1 ? 'invoice' : 'invoices', 'invois') + '</div></div>' + pill + '</div>';
    if (gDone){
      html += '<div class="done-inv">' + g.invs.map(function(x){ return String(x.invoiceNo); }).sort(function(a,b){ return a.localeCompare(b); }).map(_esc).join(' &middot; ') + '</div></article>';
      return;
    }
    if (_shipProblem[g.key]){
      // ── Problem mode: proof photo first (the office looks for the closed shop front), then the reason ──
      html += '<div class="prob"><div class="prob-h">' + ICO.warn + L('What went wrong?', 'Apa masalahnya?') + '</div>'
        + (g._failProof
            ? '<div class="proof-ok"><span class="th"><img src="data:' + _escA(g._failProof.type || 'image/jpeg') + ';base64,' + g._failProof.base64 + '" alt="">'
              + '<button type="button" class="ship-proof-x" data-i="'+i+'" aria-label="' + _escA(L('Remove', 'Buang')) + '">&times;</button></span>'
              + ICO.check + L('Proof photo added', 'Foto bukti ada') + '</div>'
            : '<button type="button" class="proof ship-proof" data-i="'+i+'">' + ICO.cam + L('Proof photo', 'Foto bukti') + '</button>')
        + '<div class="reasons">' + SHIP_REASONS.map(function(r){ return '<button type="button" class="reason ship-reason" data-i="'+i+'" data-r="'+_esc(r[0])+'">' + _esc(L(r[0], r[1])) + '</button>'; }).join('') + '</div>'
        + '<button type="button" class="back ship-problem-back" data-i="'+i+'">' + ICO.back + L('Back', 'Kembali') + '</button>'
        + '</div></article>';
      return;
    }
    // [untag+count 2026-07-15] each pending invoice is a tap-to-toggle chip (default = to deliver).
    // Untag the ones not delivered; photo count MUST equal the to-deliver count (no-missing / no-duplicate at source).
    // [tidy 2026-07-18] chips sorted by invoice number + uniform grid. data-x keeps the ORIGINAL g.invs index,
    // so the untag toggle and every count/save path are untouched; only the display order changes.
    var _ord = g.invs.map(function(_x, _xi){ return _xi; }).sort(function(a, b){
      return String(g.invs[a].invoiceNo).localeCompare(String(g.invs[b].invoiceNo));
    });
    html += '<div class="chips">' + _ord.map(function(xi){
        var x = g.invs[xi];
        if (String(x.status).toLowerCase()==='delivered') return '<span class="chip dv">' + ICO.checkS + '<span class="t">' + _esc(x.invoiceNo) + '</span></span>';
        var ut = !!x._untag;
        return '<button type="button" class="chip ship-untag' + (ut ? ' off' : '') + '" data-i="'+i+'" data-x="'+xi+'" aria-pressed="' + (ut ? 'false' : 'true') + '">'
          + (ut ? '' : ICO.checkS) + '<span class="t">' + _esc(x.invoiceNo) + '</span></button>';
      }).join('') + '</div>';
    var toDeliver = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered' && !x._untag; }).length;
    var photos = g.photos || [];
    var matchCount = (photos.length===toDeliver && toDeliver>0);
    // one short line: photos taken / needed (and the 1-invoice-1-photo rule while it still matters)
    html += '<div class="count ' + (matchCount ? 'ok' : (photos.length > toDeliver ? 'bad' : 'no')) + '">'
      + L('Photos', 'Foto') + ' ' + photos.length + '/' + toDeliver + (matchCount ? ' &#10003;' : '')
      + (photos.length > toDeliver ? ' &middot; ' + L('remove ' + (photos.length - toDeliver), 'buang ' + (photos.length - toDeliver)) : '')
      + (toDeliver > 1 && photos.length < toDeliver ? ' <em>&middot; ' + L('1 invoice = 1 photo', '1 invois = 1 foto') + '</em>' : '')
      + '</div>';
    if (photos.length){
      html += '<div class="thumbs">' + photos.map(function(p, pi){
          return '<span class="th"><img src="' + p.dataUrl + '" alt="">'
            + (p.qualityFlag ? '<span class="flag" title="' + _escA(L('Sent although not clear', 'Dihantar walaupun tidak jelas')) + '">!</span>' : '')
            + '<button type="button" class="ship-photo-x" data-g="'+i+'" data-p="'+pi+'" aria-label="' + _escA(L('Remove', 'Buang')) + '">&times;</button></span>';
        }).join('') + '</div>';
    }
    // pallets come BEFORE Save: they are sent together with the Save, so a driver who saves first loses them
    if (!_smMode && PALLET_MASTER.length){
      var pSel = (g._pallet && g._pallet.palletKey) || '';
      var pQty = (g._pallet && g._pallet.qty) || '';
      var pCollect = (g._pallet && g._pallet.collectQty) || '';
      var openPallet = !!(pSel || pQty || pCollect);   // keep open across re-render if partially filled
      var hasPP = !!(g._pallet && g._pallet.photo);
      html += '<button type="button" class="pallet pallet-toggle" data-i="'+i+'" aria-expanded="' + (openPallet ? 'true' : 'false') + '"><span>' + ICO.box + L('Pallets at this stop?', 'Ada pallet di kedai ini?') + '</span>' + ICO.down + '</button>'
        + '<div class="pallet-fields pbox" data-i="'+i+'" style="display:'+(openPallet?'flex':'none')+';">'
        + '<select class="in pallet-type" data-i="'+i+'">'+_palletOptions(pSel)+'</select>'
        + '<div class="pfields">'
        +   '<label><span class="fl">' + L('Drop', 'Beri') + '</span><input type="number" class="in pallet-qty" data-i="'+i+'" inputmode="numeric" min="0" value="'+_esc(pQty)+'" placeholder="0"></label>'
        +   '<label><span class="fl">' + L('Collect', 'Ambil') + '</span><input type="number" class="in pallet-collect" data-i="'+i+'" inputmode="numeric" min="0" value="'+_esc(pCollect)+'" placeholder="0"></label>'
        + '</div>'
        + '<button type="button" class="pphoto pallet-photo' + (hasPP ? ' ok' : '') + '" data-i="'+i+'">'
        +   (hasPP ? ICO.check + L('Pallet photo added', 'Foto pallet ada') : ICO.camS + L('Pallet photo (optional)', 'Foto pallet (pilihan)')) + '</button>'
        + '</div>';
    }
    // actions: the camera icon while photos are missing, Save once photos = invoices, Problem always
    var primary = photos.length < toDeliver
      ? '<button type="button" class="btn b-pri ship-photo" data-i="'+i+'" aria-label="' + _escA(L('Take photo', 'Ambil foto')) + '">' + ICO.cam + '</button>'
      : (matchCount ? '<button type="button" class="btn b-save ship-save" data-i="'+i+'">' + ICO.check + L('Save', 'Simpan') + '</button>' : '');
    html += '<div class="acts">' + primary
      + '<button type="button" class="btn b-ghost ship-fail' + (primary ? '' : ' b-full') + '" data-i="'+i+'">' + ICO.warn + L('Problem', 'Masalah') + '</button>'
      + '</div></article>';
  });
  wrap.innerHTML = html;
}

// [Round1 2026-10-23] Yes / Cancel sheet in the driver's language (window.confirm speaks the phone's own
// language and looks like an error). Resolves true or false.
function _confirmSheet(title, note, yesTxt, noTxt){
  return new Promise(function(resolve){
    var ov = document.createElement('div');
    ov.id = 'confirmSheet'; ov.className = 'scrim';
    ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h3>' + _esc(title) + '</h3>'
      + (note ? '<p>' + _esc(note) + '</p>' : '')
      + '<div class="row"><button type="button" class="no" data-a="no">' + _esc(noTxt) + '</button>'
      + '<button type="button" class="yes" data-a="yes">' + _esc(yesTxt) + '</button></div></div>';
    function done(v){ try{ ov.remove(); }catch(e){} resolve(v); }
    ov.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) done(b.getAttribute('data-a') === 'yes'); else if (e.target === ov) done(false); });
    document.body.appendChild(ov);
  });
}
// proof / pallet photos land on the stop by KEY, after any await — a background re-sync may have replaced
// the stop objects meanwhile (it used to drop a just-taken proof photo)
function _setFailProof(key, dataUrl){
  var grp = _groupByKey(key), m = String(dataUrl || '').match(/^data:([^;]+);base64,(.*)$/);
  if (grp && m){
    grp._failProof = { base64: m[2], type: m[1], name: 'proof.jpg' };
    _shipProblem[key] = true;
    _palletToast('ok', '&#10003; ' + L('Proof photo added. Now choose the reason.', 'Foto bukti ditambah. Sekarang pilih sebab.'));
  }
  renderShipGroups();
}
function _setPalletPhoto(key, dataUrl){
  var grp = _groupByKey(key), m = String(dataUrl || '').match(/^data:([^;]+);base64,(.*)$/);
  if (grp && m){
    if (!grp._pallet) grp._pallet = { palletKey:'', qty:'', collectQty:'' };
    grp._pallet.photo = { base64: m[2], type: m[1], name: 'pallet_' + Date.now() + '.jpg' };
    _palletToast('ok', '&#10003; ' + L('Pallet photo added', 'Foto pallet ditambah'));
  }
  renderShipGroups();
}
// the phone's own camera: ONLY the emergency path when the in-page camera cannot run on this phone
function _osEvidencePhoto(kind, key){
  var id = kind === 'pallet' ? 'palletPhotoInput' : 'proofPhotoInput';
  var inp = document.getElementById(id);
  if (!inp){
    inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
    inp.id = id; inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', async function(){
      var f = inp.files && inp.files[0], k = inp.getAttribute('data-k');
      if (f){
        var entry;
        try { entry = await compressImage(f); } catch(err){ entry = await readFileAsDataUrl(f); }
        // evidence photo: no quality gate — any shot of the closed shop / the pallets is better than none
        if (kind === 'pallet') _setPalletPhoto(k, entry.dataUrl); else _setFailProof(k, entry.dataUrl);
      }
      inp.value = ''; _osCamUntil = 0;
    });
  }
  inp.setAttribute('data-k', key);
  _osCamUntil = Date.now() + 120000;   // no re-sync while the phone camera is open (cleared when the photo lands)
  inp.click();
}

});

// [AutoCap 2026-09-09] one place that lands a photo on a stop — used by the OS-camera path
// (onShipPhoto) and the in-page camera (_acAccept). Re-resolves the group by key because a
// background re-sync may replace _shipGroups while a photo is being compressed.
// [untag+count] cap = this station's pending-invoice count (1 photo per invoice; the Save gate
// requires exact equality anyway). The old hard 10 silently dropped photo #11+ at big stops —
// the limit follows the stop size and the driver is told when it is reached.
function _addPhotoToGroup(gKey, entry, fallbackGroup){
  var cur = null;
  for (var ci=0; ci<_shipGroups.length; ci++){ if (_shipGroups[ci].key === gKey){ cur = _shipGroups[ci]; break; } }
  if (!cur) cur = fallbackGroup;
  if (!cur) return { added: false, group: null };
  if (!cur.photos) cur.photos = [];
  var _cap = (cur.invs && cur.invs.length)
    ? cur.invs.filter(function(x){ return String(x.status).toLowerCase() !== 'delivered'; }).length
    : 99;
  if (cur.photos.length >= _cap){
    _palletToast('err', L('Limit reached: ' + _cap + (_cap === 1 ? ' photo for ' : ' photos for ') + _cap + (_cap === 1 ? ' invoice' : ' invoices') + ' at this stop', 'Had: ' + _cap + ' foto untuk ' + _cap + ' invois di kedai ini'));
    return { added: false, group: cur };
  }
  cur.photos.push({ dataUrl: entry.dataUrl, name: entry.name, type: entry.type, qualityFlag: !!entry.qualityFlag, origDataUrl: entry.origDataUrl || null, scan: entry.scan || null });   // [Scanner] backup original rides along
  return { added: true, group: cur };
}

// ══════════════════════════════════════════════════════════════════════════════════════
// [Scanner 2026-10-22] "Scanner Pro" look at the moment of capture — invoice photos only.
// The driver's shot must already BE the scan copy before it reaches Google Drive, so the office
// no longer converts anything afterwards.
//
// Pipeline per invoice photo (proof / shop-closed photos never come here — they are not paper):
//   1. compressImage() as before → the quality gate still judges the ORIGINAL photo
//      (a scan fills the frame edge to edge, so judging the scan would fail "cut" every time)
//   2. find the paper + flatten it: Scanic (MIT, 104 KB, WASM inlined, self-hosted in /vendor)
//      — chosen because OpenCV.js (30 MB) was ruled out for driver phones in July (2 GB Android
//      kills the tab = a lost delivery). The optional ML detector is NOT used (it fetches 2 MB
//      from an outside CDN). Scanic alone mistook light trousers for paper, so its outlines are
//      checked against our own "paper map" and pushed out to the true edge (_scanDetect_), and
//      the page is set to its true A4 shape (_scanAspect_).
//   3. white page + shadow removal: our own clfWhiten_ (no content is ever redrawn)
//   4. the driver SEES the result: Use / Retake / Adjust corners. A wrong crop is caught on the
//      spot instead of becoming the permanent record.
//   5. the original photo rides along (smaller) as the backup: a crop can still be wrong and the
//      original is the only full evidence of what was there.
// Fail-open everywhere: no Scanic, no WASM, a throw, or a slow phone → the plain photo, exactly
// today's behaviour. Nothing here can block a delivery.
// ══════════════════════════════════════════════════════════════════════════════════════
var SCANNER_ON = true;               // kill switch: false = byte-for-byte today's photo flow
var SCAN_SRC_MAX = 3000;             // longest side fed to the scanner (memory cap on 2 GB phones)
var SCAN_OUT_MAX = 2400;             // longest side of the stored scan (≈ 200 dpi on A4)
var SCAN_OUT_Q   = 0.85;
var ORIG_MAX     = 1600;             // backup original: smaller, it only has to show what was there
var ORIG_Q       = 0.72;
var SCAN_SLOW_MS = 9000;             // a single scan slower than this falls back to the plain photo
var _scanic = null, _scanicState = 'idle', _scanicLoading = null, _scanLast = null, _scanLoadWaited = false;
var _scanSlowCount = 0, _scanHiddenAt = 0;   // 2 too-slow scans → scanner pauses for this page session
document.addEventListener('visibilitychange', function(){ if (document.hidden) _scanHiddenAt = Date.now(); });
function _scanWasHidden_(t0){ return document.hidden || _scanHiddenAt >= t0; }   // locked / switched app: not the phone's fault
// The scan is heavy main-thread work with no natural pauses, so the "use without scanning" button
// and the time limits could never fire mid-scan. Every step yields here (a frame can paint, a tap
// can land) and stops at once when the driver has already moved on.
function _scanYield_(job){
  return new Promise(function(ok, no){ setTimeout(function(){ if (job && job.cancelled) no(new Error('cancelled')); else ok(); }, 0); });
}

function _scanicLoad_(){
  if (!SCANNER_ON) return Promise.resolve(null);
  if (_scanic) return Promise.resolve(_scanic);
  if (_scanicLoading) return _scanicLoading;
  // import() is wrapped in Function so a WebView too old to parse it (pre-Chrome 63) only loses the
  // scanner — written inline it would be a syntax error that kills the whole form
  var imp = null;
  try{ imp = new Function('u', 'return import(u)'); }catch(e){}

  var P = [c.topLeft, c.topRight, c.bottomRight, c.bottomLeft].map(function(p){ return { x: p.x * k, y: p.y * k }; });
  function pap(x, y){ x = Math.round(x); y = Math.round(y); return (x < 0 || y < 0 || x >= w || y >= h) ? 0 : (m[y * w + x] > T ? 1 : 0); }
  var cx = (P[0].x + P[1].x + P[2].x + P[3].x) / 4, cy = (P[0].y + P[1].y + P[2].y + P[3].y) / 4;
  var R = Math.round(0.04 * Math.hypot(w, h)), step = Math.max(1, Math.round(R / 24)), d = 3, lines = [];
  for (var e = 0; e < 4; e++){
    var A = P[e], B = P[(e + 1) % 4], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, nx = dy / L, ny = -dx / L;
    if (((A.x + B.x) / 2 - cx) * nx + ((A.y + B.y) / 2 - cy) * ny < 0){ nx = -nx; ny = -ny; }   // outward
    var best = -2, bsa = 0, bsb = 0;
    for (var sa = 0; sa <= R; sa += step) for (var sb = 0; sb <= R; sb += step){
      var ax = A.x + nx * sa, ay = A.y + ny * sa, bx = B.x + nx * sb, by = B.y + ny * sb, s = 0;
      for (var t = 0; t < 30; t++){
        var f = 0.08 + 0.84 * t / 29, px = ax + (bx - ax) * f, py = ay + (by - ay) * f;
        s += pap(px - nx * d, py - ny * d) - pap(px + nx * d, py + ny * d);
      }
      s = s / 30 - 0.0005 * (Math.abs(sa) + Math.abs(sb));          // ties → stay near the detection
      if (s > best){ best = s; bsa = sa; bsb = sb; }
    }
    lines.push(best > 0.5 ? { ax: A.x + nx * bsa, ay: A.y + ny * bsa, bx: B.x + nx * bsb, by: B.y + ny * bsb }
                          : { ax: A.x, ay: A.y, bx: B.x, by: B.y });   // no clear boundary → keep it
  }
  var out = [], keys = ['topLeft', 'topRight', 'bottomRight', 'bottomLeft'];
  for (var i = 0; i < 4; i++){
    var l1 = lines[(i + 3) % 4], l2 = lines[i];                      // corner i = end of edge i-1 ∩ start of edge i
    var x1 = l1.bx - l1.ax, y1 = l1.by - l1.ay, x2 = l2.bx - l2.ax, y2 = l2.by - l2.ay, den = x1 * y2 - y1 * x2;
    var q = P[i];
    if (Math.abs(den) > 1e-6){
      var u = ((l2.ax - l1.ax) * y2 - (l2.ay - l1.ay) * x2) / den, ix = l1.ax + u * x1, iy = l1.ay + u * y1;
      if (Math.hypot(ix - q.x, iy - q.y) <= 2 * R) q = { x: ix, y: iy };
    }
    out.push(q);
  }
  var r = {}; keys.forEach(function(key, j){ r[key] = { x: out[j].x / k, y: out[j].y / k }; });
  return r;
}

// Tries the candidates cheapest/likeliest first and stops at the first good one.
// Returns { corners, score, how } (corners = null when nothing usable was found).
async function _scanDetect_(src, job){
  var t0 = Date.now(), map = _scanPaperMap_(src, 900), T = _scanOtsu_(map, 0), Tu = _scanOtsu_(map, 0.5), slow = false;
  var cands = [
    function(){ return [src, {}, 1, 'edges']; },
    function(){ return [_scanMask_(map, Tu, 2), {}, map.k, 'paper']; },
    function(){ return [_scanMask_(map, T, 0), {}, map.k, 'paper-wide']; },
    function(){ return [src, { maxProcessingDimension: 1600 }, 1, 'edges-fine']; },
    function(){ return [src, { epsilon: 0.01 }, 1, 'edges-tight']; }
  ];
  var best = { corners: null, score: -1, how: 'none' };
  for (var i = 0; i < cands.length; i++){
    if (i > 0 && (best.score >= SCAN_GOOD || Date.now() - t0 > SCAN_DETECT_MS)) break;
    await _scanYield_(job);
    if (i === 3 && slow) continue;          // 'edges-fine' costs 2–3× the others — not on a slow phone
    var cd = null, tc = Date.now();
    try{
      cd = cands[i]();
      var det = await _scanic.scanDocument(cd[0], Object.assign({ mode: 'detect' }, cd[1]));
      if (det && det.success && det.corners){
        var c = {}, sc = cd[2];
        ['topLeft', 'topRight', 'bottomRight', 'bottomLeft'].forEach(function(key){ c[key] = { x: det.corners[key].x / sc, y: det.corners[key].y / sc }; });
        c = _scanRefine_(map, T, c);          // outward-only and capped at 4% → always kept
        var s = _scanQuadScore_(map, T, c);
        if (s > best.score) best = { corners: c, score: s, how: cd[3] };
      }
    }catch(e){ console.warn('detect candidate failed:', e); }
    if (cd && cd[0] !== src) cd[0].width = 0;
    if (i === 0 && Date.now() - tc > 700) slow = true;
  }
  map.m = null;
  best.score = Math.max(0, Math.round(best.score * 1000) / 1000);
  return best;
}

// Corners → flattened + whitened scan canvas (used by the first pass and by "Adjust corners").
// extractDocument is ASYNC (Promise<ScannerResult>) — treating it as sync silently returns the
// uncropped photo with no error, so it is awaited here and its success flag is checked.
async function _scanFromCorners_(srcCanvas, corners, job){
  var flat = null, hw = null;
  if (corners){
    await _scanYield_(job);
    var r = await _scanic.extractDocument(srcCanvas, corners, { output: 'canvas' });
    if (r && r.success !== false && r.output && r.output.width){
      flat = r.output;
      hw = _scanAspect_(corners, srcCanvas.width, srcCanvas.height);
      var fixed = _scanFixAspect_(flat, hw);
      if (fixed !== flat){ flat.width = 0; flat = fixed; }
    }
  }
  var base = _scanFit_(flat || srcCanvas, SCAN_OUT_MAX);
  try{ await _scanYield_(job); }catch(e){ if (flat) flat.width = 0; if (base !== srcCanvas && base !== flat) base.width = 0; throw e; }
  var clip = _scanClip_(base);   // measured on the page BEFORE whitening = what the camera delivered
  var out = clfWhiten_(base);
  if (flat && flat !== base) flat.width = 0;
  if (base !== srcCanvas && base !== out) base.width = 0;
  return { canvas: out, cropped: !!flat, aspect: hw, clip: clip };
}

// Takes the raw camera blob + the plain entry from compressImage(); returns the entry with
// dataUrl = scan copy and origDataUrl = backup original. Any failure returns the plain entry.
async function scanInvoice_(blob, plainEntry, job){
  var t0 = Date.now(), info = { cropped: false, ok: false, ms: 0, src: null, out: null, err: null };
  plainEntry.scan = info;
  if (!SCANNER_ON) return plainEntry;
  if (_scanSlowCount >= 2){ info.err = 'too slow on this phone — scanner paused'; _scanLast = info; _scanDebug_(); return plainEntry; }
  // a stalled download (weak signal) must not hold the driver: wait ≤6 s once, then barely at all
  var m = await Promise.race([_scanicLoad_(), new Promise(function(ok){ setTimeout(function(){ ok(null); }, _scanLoadWaited ? 300 : 6000); })]);
  if (!m){ _scanLoadWaited = true; info.err = 'scanner not loaded'; _scanLast = info; _scanDebug_(); return plainEntry; }
  var loaded = null, src = null;
  try{
    loaded = await _scanLoadImg_(blob);
    var im = loaded.img, k = Math.min(1, SCAN_SRC_MAX / Math.max(im.naturalWidth, im.naturalHeight));
    src = document.createElement('canvas');
    src.width = Math.round(im.naturalWidth * k); src.height = Math.round(im.naturalHeight * k);
    var sctx = src.getContext('2d'); sctx.imageSmoothingQuality = 'high'; sctx.drawImage(im, 0, 0, src.width, src.height);
    info.src = [im.naturalWidth, im.naturalHeight];
    // the full-size decoded photo (up to ~48 MB at 4K) is not needed any more — free it before the heavy part
    try{ URL.revokeObjectURL(loaded.url); im.src = ''; }catch(e0){}
    im = null; loaded = null;
    var det = await _scanDetect_(src, job);
    var corners = det.corners;
    info.score = det.score; info.how = det.how; info.sure = det.score >= SCAN_SURE;
    // already past 60% of the budget after finding the paper → this phone will not make it; stop now
    if (Date.now() - t0 > SCAN_SLOW_MS * 0.6 && !_scanWasHidden_(t0)) throw new Error('too slow (' + (Date.now() - t0) + ' ms)');
    var res = await _scanFromCorners_(src, corners, job), scan = res.canvas;
    if (!res.cropped) corners = null;       // extraction refused → treat as "edges not found"
    info.cropped = !!corners; info.corners = corners; info.out = [scan.width, scan.height];
    info.aspect = res.aspect ? Math.round(res.aspect * 1000) / 1000 : null;
    info.clip = res.clip;
    info.ms = Date.now() - t0;
    if (info.ms > SCAN_SLOW_MS && !_scanWasHidden_(t0)){ scan.width = 0; throw new Error('too slow (' + info.ms + ' ms)'); }
    var orig = _scanFit_(src, ORIG_MAX);
    plainEntry.origDataUrl = orig.toDataURL('image/jpeg', ORIG_Q);
    plainEntry.dataUrl = scan.toDataURL('image/jpeg', SCAN_OUT_Q);
    plainEntry.name = String(plainEntry.name || 'invoice.jpg').replace(/(_scan[CF])?\.jpg$/i, '') + (corners ? '_scanC' : '_scanF') + '.jpg';
    plainEntry._scanSrc = src;               // kept only until the driver decides (Adjust needs it)
    info.ok = true;
    if (orig !== src) orig.width = 0;
    scan.width = 0;
  }catch(e){
    console.warn('scan failed — plain photo kept:', e);
    info.err = String((e && e.message) || e); info.ms = Date.now() - t0;
    if (/too slow/.test(info.err)) _scanSlowCount++;
    plainEntry.dataUrl = plainEntry.dataUrl;  // untouched plain photo
    plainEntry.origDataUrl = null; plainEntry._scanSrc = null;
    if (src){ try{ src.width = 0; }catch(e3){} }
  }finally{
    if (loaded) try{ URL.revokeObjectURL(loaded.url); }catch(e2){}
  }
  _scanLast = info; _scanDebug_();
  return plainEntry;
}

function _srTag_(entry){

    h.innerHTML = L('Is part of the invoice cut off? Tap <b>Adjust</b>.', 'Ada bahagian invois terpotong? Tekan <b>Laras</b>.'); }
  else if (sc.ok && sc.cropped){ t.textContent = '✓ ' + L('Scanned', 'Diimbas'); t.style.background = '#15803D'; t.style.color = '#fff';
    h.innerHTML = L('All clear? Tap <b>Use</b>. Edges cut off? Tap <b>Adjust</b>.', 'Semua jelas? Tekan <b>Guna</b>. Tepi terpotong? Tekan <b>Laras</b>.'); }
  else if (sc.ok){ t.textContent = '⚠ ' + L('Edges not found', 'Tepi tidak dikesan'); t.style.background = '#FBBF24'; t.style.color = '#412402';
    h.innerHTML = L('Tap <b>Adjust</b> and drag the 4 corners, or <b>Retake</b>.', 'Tekan <b>Laras</b> dan tarik 4 sudut, atau <b>Ambil semula</b>.'); }
  else { t.textContent = L('Normal photo (not scanned)', 'Foto biasa (tidak diimbas)'); t.style.background = '#64748B'; t.style.color = '#fff';
    var er = String(sc.err || '');
    h.innerHTML = /too slow/.test(er) ? L('Scanning is too slow on this phone. The normal photo will be used.', 'Imbasan terlalu lama di telefon ini. Foto biasa akan digunakan.')
      : /not loaded/.test(er) ? L('The scanner has not loaded yet (weak signal?). The normal photo will be used.', 'Pengimbas belum dimuat (isyarat lemah?). Foto biasa akan digunakan.')
      : L('This photo could not be scanned. The normal photo will be used.', 'Foto ini tidak dapat diimbas. Foto biasa akan digunakan.'); }
  document.getElementById('srAdjust').style.display = entry._scanSrc ? '' : 'none';
  document.getElementById('srToggle').style.display = entry.origDataUrl ? '' : 'none';
}

// Shows "Scanning…", runs scanInvoice_, then waits for the driver. Resolves the final entry,
// or null when the driver chose Retake. Never rejects, and can never hold the driver: after 3 s a
// "use the photo without scanning" button appears, and after SCAN_SLOW_MS + 3 s the plain photo
// is taken automatically. The scan works on a COPY of the entry, so a scan that finishes late can
// never change a photo the driver already kept.
function scanAndReview_(blob, plainEntry){
  if (!SCANNER_ON) return Promise.resolve(plainEntry);    // kill switch = today's flow, no review screen
  var ov = _srBuild_();
  var img = document.getElementById('srImg'), busy = document.getElementById('srBusy'), ed = document.getElementById('srEditor');
  var btns = document.getElementById('srBtns'), hint = document.getElementById('srHint'), tag = document.getElementById('srTag');
  var skip = document.getElementById('srSkip'), tog = document.getElementById('srToggle');
  // nothing from the previous photo may stay clickable while this one scans
  ['srUse', 'srRetake', 'srAdjust', 'srToggle'].forEach(function(id){ document.getElementById(id).onclick = null; });
  tog.style.display = 'none'; tog.innerHTML = L('Original', 'Asal'); skip.style.display = 'none';
  img.style.display = 'none'; img.removeAttribute('src'); busy.style.display = 'block'; ed.style.display = 'none'; ed.innerHTML = '';
  btns.style.visibility = 'hidden'; hint.innerHTML = ''; tag.textContent = '';
  ov.style.display = 'flex';
  try{ document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden'; }catch(e){}
  return new Promise(function(resolve){
    var showingOrig = false, editor = null, done = false, scanned = null, work = Object.assign({}, plainEntry), job = { cancelled: false };
    var skipT = setTimeout(function(){ if (!done && !scanned) skip.style.display = 'block'; }, 3000);
    var hardT = setTimeout(function(){ if (!done && !scanned){ plainEntry.scan = { ok: false, err: 'timed out' }; finish(plainEntry); } }, SCAN_SLOW_MS + 3000);
    skip.onclick = function(){ if (scanned) return; plainEntry.scan = { ok: false, err: 'skipped by driver' }; finish(plainEntry); };
    function finish(val){
      if (done) return; done = true; job.cancelled = true;
      clearTimeout(skipT); clearTimeout(hardT); skip.onclick = null; skip.style.display = 'none';
      try{ if (editor) editor.destroy(); }catch(e){}
      ed.innerHTML = ''; ov.style.display = 'none'; img.removeAttribute('src');
      if (!_ac){ try{ document.documentElement.style.overflow = ''; document.body.style.overflow = ''; }catch(e){} }
      if (work._scanSrc){ try{ work._scanSrc.width = 0; }catch(e){} work._scanSrc = null; }   // Retake included
      resolve(val);
    }
    function show(entry){
      img.src = showingOrig && entry.origDataUrl ? entry.origDataUrl : entry.dataUrl;
      img.style.display = 'block'; busy.style.display = 'none'; ed.style.display = 'none'; skip.style.display = 'none';
      btns.style.visibility = 'visible';
      _srTag_(entry);
    }
    scanInvoice_(blob, work, job).then(function(entry){
      if (done){ if (entry && entry._scanSrc){ try{ entry._scanSrc.width = 0; }catch(e){} entry._scanSrc = null; } return; }   // driver already moved on
      scanned = entry;
      show(entry);
      document.getElementById('srUse').onclick = function(){ finish(entry); };
      document.getElementById('srRetake').onclick = function(){ finish(null); };
      document.getElementById('srToggle').onclick = function(){ showingOrig = !showingOrig; show(entry);
        this.innerHTML = showingOrig ? L('Scan', 'Imbasan') : L('Original', 'Asal'); };
      document.getElementById('srAdjust').onclick = function(){
        if (!entry._scanSrc || !_scanic) return;
        btns.style.visibility = 'hidden'; img.style.display = 'none'; ed.style.display = 'block';
        hint.innerHTML = L('Drag the 4 dots onto the paper corners, then tap <b>Done</b>.', 'Tarik 4 titik ke sudut kertas, kemudian tekan <b>Siap</b>.');
        var src = entry._scanSrc, c0 = entry.scan && entry.scan.corners;
        if (!c0){ var mx = src.width * 0.08, my = src.height * 0.08;
          c0 = { topLeft: { x: mx, y: my }, topRight: { x: src.width - mx, y: my }, bottomRight: { x: src.width - mx, y: src.height - my }, bottomLeft: { x: mx, y: src.height - my } }; }
        try{
          editor = _scanic.createCornerEditor({ container: ed, image: src, corners: c0, handleHitArea: 48,
            magnifier: { enabled: true, zoom: 2.5, size: 120 },
            toolbar: { reset: true, cancel: true, apply: true, labels: { reset: L('Reset', 'Set semula'), cancel: L('Cancel', 'Batal'), apply: L('Done', 'Siap') } },
            onCancel: function(){ try{ editor.destroy(); }catch(e){} editor = null; show(entry); },
            onConfirm: function(corners){
              try{ editor.destroy(); }catch(e){} editor = null;
              busy.style.display = 'block'; ed.style.display = 'none';
              setTimeout(async function(){
                try{
                  var res = await _scanFromCorners_(src, corners), scan = res.canvas;
                  if (res.cropped){
                    entry.dataUrl = scan.toDataURL('image/jpeg', SCAN_OUT_Q);
                    entry.scan.cropped = true; entry.scan.corners = corners; entry.scan.adjusted = true; entry.scan.sure = true;
                    entry.scan.out = [scan.width, scan.height];
                    entry.scan.aspect = res.aspect ? Math.round(res.aspect * 1000) / 1000 : null;
                    entry.scan.clip = res.clip;
                    entry.name = String(entry.name).replace(/_scan[CF]\.jpg$/i, '') + '_scanC.jpg';
                  }
                  scan.width = 0;
                }catch(e){ console.warn('re-scan failed:', e); }
                showingOrig = false; document.getElementById('srToggle').innerHTML = L('Original', 'Asal');
                show(entry);
              }, 30);
            } });
        }catch(e){ console.warn('corner editor failed:', e); show(entry); }
      };
    }).catch(function(e){ console.warn('review failed — plain photo used:', e); finish(plainEntry); });
  });
}

// small diagnostics line (test build only shows it) — lets the office read a phone's camera
// resolution and scanner state without a laptop. "blown N%" = share of the page the camera had
// already burnt to pure white before the scan touched it (high = the photo itself is over-exposed).
function _scanDebug_(){
  var el = document.getElementById('scanDebug'); if (!el) return;
  var s = _scanLast, cam = window._acCamRes ? (window._acCamRes[0] + '×' + window._acCamRes[1]) : '—';
  el.textContent = 'scanner: ' + _scanicState + ' · camera: ' + cam
    + (s ? ' · last: ' + (s.ok ? (s.cropped ? 'cropped ' + s.how + ' ' + s.score : 'whitened') : 'plain') + ' ' + s.ms + ' ms' + (s.src ? ' src ' + s.src[0] + '×' + s.src[1] : '') + (s.out ? ' → ' + s.out[0] + '×' + s.out[1] : '')
      + (typeof s.clip === 'number' ? ' · blown ' + Math.round(s.clip * 100) + '%' : '') + (s.err ? ' (' + s.err + ')' : '') : '');
}

// photo taken for a customer → submit delivery for that customer's pending invoices
// STEP 1: take photo(s) for a customer → buffer + show thumbnails (does NOT submit yet)
async function onShipPhoto(input){
  // Cancelled camera fires this with empty files — MUST reset _deliverIdx or the
  // visibilitychange re-sync stays suppressed for the rest of the session.
