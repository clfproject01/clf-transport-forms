<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLF Trading — Shipment Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- SheetJS: lets the office upload the Delivery Form as .xlsx (parsed in the browser into the CSV the backend already reads) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --blue-50:#EFF6FF; --blue-500:#3B82F6; --blue-600:#2563EB; --blue-700:#1D4ED8; --blue-900:#1E3A8A;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-700:#374151; --gray-900:#111827;
  --success-50:#ECFDF5; --success-500:#10B981; --success-700:#047857;
  --warning-50:#FFFBEB; --warning-500:#F59E0B; --warning-700:#B45309;
  --danger-50:#FEF2F2; --danger-500:#EF4444; --danger-700:#B91C1C;
  --surface-page:#F9FAFB; --surface-card:#FFFFFF;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --text-h1:26px; --text-h2:20px; --text-h3:16px; --text-body:14px; --text-caption:12px;
  --radius:12px; --shadow:0 1px 2px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.1);
}
@media (max-width:767px){ :root{ --text-h1:21px; --text-h2:18px; } }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Geist',-apple-system,system-ui,sans-serif; background:var(--surface-page); color:var(--gray-900); font-size:var(--text-body); line-height:1.5; -webkit-font-smoothing:antialiased; }
.mono{ font-family:'Geist Mono',ui-monospace,monospace; }

/* Header */
.header{ background:var(--surface-card); border-bottom:1px solid var(--gray-200); position:sticky; top:0; z-index:50; padding:0 var(--space-5); }
.header-inner{ max-width:1100px; margin:0 auto; height:60px; display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); }
.header-title{ font-size:var(--text-h2); font-weight:700; letter-spacing:-.01em; }
.header-title span{ color:var(--blue-600); }
.header-link{ font-size:var(--text-caption); color:var(--gray-500); text-decoration:none; padding:6px 12px; border:1px solid var(--gray-200); border-radius:8px; }
.header-link:hover{ background:var(--gray-50); color:var(--gray-700); }

.container{ max-width:1100px; margin:0 auto; padding:var(--space-5); }

/* Toolbar */
.toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); margin-bottom:var(--space-5); }
.toolbar .field-label{ font-size:var(--text-caption); color:var(--gray-500); font-weight:500; margin-right:var(--space-1); }
input[type=date]{ font-family:inherit; font-size:var(--text-body); padding:8px 10px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; color:var(--gray-900); }

/* Buttons */
.btn{ font-family:inherit; font-size:var(--text-body); font-weight:600; padding:9px 16px; border-radius:8px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.12s; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.btn-primary{ background:var(--blue-600); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--blue-700); }
.btn-ghost{ background:#fff; color:var(--gray-700); border-color:var(--gray-300); }
.btn-ghost:hover:not(:disabled){ background:var(--gray-50); }
.btn-sm{ padding:7px 13px; font-size:var(--text-caption); }
.btn-danger{ background:#fff; color:var(--danger-700); border-color:var(--danger-500); }
.btn-danger:hover:not(:disabled){ background:var(--danger-50); }

/* Upload card */
.upload-card{ background:var(--surface-card); border:1px dashed var(--gray-300); border-radius:var(--radius); padding:var(--space-5); margin-bottom:var(--space-5); display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); flex-wrap:wrap; }
.upload-card .uc-text{ flex:1; min-width:220px; }
.upload-card .uc-title{ font-size:var(--text-h3); font-weight:600; }
.upload-card .uc-sub{ font-size:var(--text-caption); color:var(--gray-500); margin-top:2px; }

/* Section title */
.section-title{ font-size:var(--text-h3); font-weight:600; color:var(--gray-700); margin-bottom:var(--space-3); display:flex; align-items:center; gap:var(--space-2); }
.section-title .count{ font-size:var(--text-caption); color:var(--gray-500); font-weight:500; }

/* Shipment cards grid */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:var(--space-4); }
.card{ background:var(--surface-card); border:1px solid var(--gray-200); border-radius:var(--radius); box-shadow:var(--shadow); padding:var(--space-4); border-top:3px solid var(--blue-600); }
.card.is-done{ border-top-color:var(--success-500); }
.card.is-partial{ border-top-color:var(--warning-500); }
.card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-2); }
.card-lorry{ font-size:var(--text-h2); font-weight:700; letter-spacing:-.01em; }
.card-ship{ font-size:var(--text-caption); color:var(--gray-500); margin-top:1px; }
.badge{ font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.badge-imported{ background:var(--gray-100); color:var(--gray-500); }
.badge-assigned{ background:var(--blue-50); color:var(--blue-700); }
.badge-done{ background:var(--success-50); color:var(--success-700); }

/* progress */
.prog{ margin:var(--space-3) 0; }
.prog-row{ display:flex; justify-content:space-between; font-size:var(--text-caption); margin-bottom:5px; }
.prog-num{ font-weight:600; color:var(--gray-900); }
.prog-sub{ color:var(--gray-500); }
.prog-bar{ height:8px; background:var(--gray-100); border-radius:99px; overflow:hidden; }
.prog-fill{ height:100%; background:var(--blue-600); border-radius:99px; transition:width .3s; }
.card.is-done .prog-fill{ background:var(--success-500); }
.card.is-partial .prog-fill{ background:var(--warning-500); }
.pill-warn{ display:inline-block; margin-top:6px; font-size:11px; color:var(--warning-700); background:var(--warning-50); border:1px solid var(--warning-500); border-radius:6px; padding:2px 7px; }

/* crew */
.crew{ border-top:1px solid var(--gray-100); margin-top:var(--space-3); padding-top:var(--space-3); }
.crew-row{ display:flex; gap:var(--space-2); margin-bottom:var(--space-2); }
.crew-field{ flex:1; }
.field-label{ display:block; font-size:11px; font-weight:500; color:var(--gray-500); margin-bottom:3px; }
.select{ width:100%; font-family:inherit; font-size:var(--text-body); padding:8px 9px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; color:var(--gray-900); }
.crew-actions{ display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); }

/* states */
.empty,.loading{ text-align:center; color:var(--gray-500); padding:var(--space-6) var(--space-4); background:var(--surface-card); border:1px solid var(--gray-200); border-radius:var(--radius); }
.empty .e-title{ font-size:var(--text-h3); color:var(--gray-700); font-weight:600; margin-bottom:4px; }

/* toast */
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; min-width:260px; max-width:90vw; padding:12px 16px; border-radius:10px; font-size:var(--text-body); font-weight:500; box-shadow:0 8px 24px rgba(17,24,39,.18); transition:.25s; z-index:100; }
.toast.is-visible{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.is-success{ background:var(--success-50); color:var(--success-700); border:1px solid var(--success-500); }
.toast.is-warning{ background:var(--warning-50); color:var(--warning-700); border:1px solid var(--warning-500); }
.toast.is-danger{ background:var(--danger-50); color:var(--danger-700); border:1px solid var(--danger-500); }
.toast.is-info{ background:var(--blue-50); color:var(--blue-700); border:1px solid var(--blue-500); }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-title">CLF <span>Shipment</span> Management</div>
    <a class="header-link" href="CLF_Dashboard.html">← Dashboard</a>
  </div>
</header>

<div class="container">
  <!-- Upload -->
  <div class="upload-card">
    <div class="uc-text">
      <div class="uc-title">📥 Upload Delivery Form (CSV)</div>
      <div class="uc-sub">Export the Shipment CSV from your system, then upload it here. One file per lorry.</div>
    </div>
    <input type="file" id="csvFile" accept=".csv,.xlsx,.xls" style="display:none">
    <button class="btn btn-primary" id="uploadBtn">Choose CSV file…</button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <span class="field-label">Date</span>
    <input type="date" id="dateInput">
    <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="section-title">Lorries / Shipments <span class="count" id="shipCount"></span></div>
  <div id="list"><div class="loading">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxabHh2Kd04z7k0zZOOoaJs2i5hgycQsO_AYoRS99xZx2WqMJ6cowumY0e1znehiRM1/exec';

let _drivers = [];     // [{name, staffId}]
let _date = '';

// ── helpers ──
function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _normId(s){ return String(s == null ? '' : s).replace(/\s+/g, '').toUpperCase(); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function fmtNum(n){ return (n == null) ? '?' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }  // 79000 -> "79,000"
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.className = 'toast is-' + (type || 'info') + ' is-visible';
  t.textContent = msg;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('is-visible'), 5000);
}

// ── data loads ──
async function loadDrivers(){
  try{
    const res = await fetch(SCRIPT_URL + '?action=getDrivers');
    const data = await res.json();
    _drivers = (data && data.drivers) ? data.drivers : [];
  }catch(e){ _drivers = []; showToast('Could not load driver list — assignment dropdowns may be empty.', 'warning'); }
}

async function loadShipments(){
  const list = document.getElementById('list');
  list.innerHTML = '<div class="loading">Loading…</div>';
  try{
    const res = await fetch(SCRIPT_URL + '?action=getShipmentsForDate&date=' + encodeURIComponent(_date));
    const data = await res.json();
    if(!data || data.status !== 'ok'){ list.innerHTML = '<div class="empty"><div class="e-title">Could not load</div>'+escHtml((data&&data.message)||'Unexpected response')+'</div>'; return; }
    renderShipments(data.shipments || []);
  }catch(e){
    list.innerHTML = '<div class="empty"><div class="e-title">Cannot reach server</div>'+escHtml(e.message||'network error')+'</div>';
  }
}

// ── render ──
// Staff-ID search picker for a crew slot. Hidden input (class sel-<role>) keeps the NAME
// — exactly what saveCrew() reads. Search by Staff ID or name; tidy short list, no name-wall.
function crewPicker(roleClass, selected){
  var d = _drivers.find(function(x){ return x.name === selected; });
  var display = selected ? ((d && d.staffId ? d.staffId + ' · ' : '') + selected) : '';
  return '<input type="text" class="crew-search select" autocomplete="off" placeholder="Staff ID atau nama" value="'+escHtml(display)+'">'
    + '<input type="hidden" class="sel-'+roleClass+'" value="'+escHtml(selected||'')+'">'
    + '<div class="crew-panel" style="display:none;position:absolute;left:0;right:0;z-index:30;border:1px solid #D1D5DB;border-top:none;border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;background:#fff;box-shadow:0 8px 20px rgba(17,24,39,.12);"></div>';
}

// Wire all crew search boxes (scoped per .crew-field). One shared document-click closer
// (bound once) so re-rendering the list never stacks listeners.
function wireCrewPickers(){
  if(!wireCrewPickers._docBound){
    document.addEventListener('click', function(e){
      document.querySelectorAll('.crew-panel').forEach(function(panel){
        var field = panel.closest('.crew-field');
        var search = field ? field.querySelector('.crew-search') : null;
        if(e.target !== search && !panel.contains(e.target)) panel.style.display = 'none';
      });
    });
    wireCrewPickers._docBound = true;
  }
  document.querySelectorAll('.crew-search').forEach(function(search){
    if(search._wired) return; search._wired = true;
    var field  = search.closest('.crew-field');
    var hidden = field.querySelector('input[type=hidden]');
    var panel  = field.querySelector('.crew-panel');
    function render(q){
      var nq = _normId(q), nameq = String(q||'').trim().toLowerCase();
      if(!q || !q.trim()){ panel.style.display = 'none'; return; }
      var matches = _drivers.filter(function(d){
        return (d.staffId && _normId(d.staffId).indexOf(nq) >= 0) ||
               (d.name && d.name.toLowerCase().indexOf(nameq) >= 0);
      }).slice(0, 8);
      panel.innerHTML = matches.length
        ? matches.map(function(d){ return '<div class="dp-row" data-name="'+escHtml(d.name)+'" style="padding:10px 12px;border-bottom:1px solid #F3F4F6;cursor:pointer;font-size:13px;color:#111827;"><b>'+escHtml(d.staffId||'')+'</b> · '+escHtml(d.name)+'</div>'; }).join('')
        : '<div style="padding:10px 12px;color:#9CA3AF;font-size:13px;">No match · Tiada padanan</div>';
      panel.style.display = 'block';
    }
    search.addEventListener('input', function(){ hidden.value = ''; render(search.value); });
    search.addEventListener('focus', function(){ search.select(); if(search.value.trim() && !hidden.value) render(search.value); });
    panel.addEventListener('click', function(e){
      var row = e.target.closest('.dp-row'); if(!row) return;
      var name = row.getAttribute('data-name');
      var d = _drivers.find(function(x){ return x.name === name; });
      hidden.value = name;
      search.value = (d && d.staffId ? d.staffId + ' · ' : '') + name;
      panel.style.display = 'none';
    });
  });
}

function renderShipments(ships){
  document.getElementById('shipCount').textContent = ships.length ? ('· ' + ships.length) : '';
  const list = document.getElementById('list');
  if(!ships.length){
    list.innerHTML = '<div class="empty"><div class="e-title">No shipments for ' + escHtml(_date) + '</div>Upload a Delivery Form CSV above to get started.</div>';
    return;
  }
  let html = '<div class="grid">';
  ships.forEach(s => {
    const planned = Number(s.planned) || 0;
    const delivered = Number(s.delivered) || 0;
    const failed = Number(s.failed) || 0;
    const pending = Number(s.pending) || 0;
    const pct = (s.pct == null) ? 0 : Number(s.pct);
    const allDone = planned > 0 && delivered >= planned;
    const cls = allDone ? 'is-done' : (delivered > 0 || failed > 0 ? 'is-partial' : '');
    const badge = allDone ? '<span class="badge badge-done">Done</span>'
                : (s.status === 'assigned' ? '<span class="badge badge-assigned">Assigned</span>'
                : '<span class="badge badge-imported">Imported</span>');
    html += '<div class="card '+cls+'" data-ship="'+escHtml(s.shipmentNo)+'">'
      + '<div class="card-head"><div><div class="card-lorry">'+escHtml(s.lorryNo || '—')
      + (s.lorry2 ? ' <span style="font-size:13px;font-weight:600;color:#1A56DB">+ '+escHtml(s.lorry2)+' (2nd lorry)</span>' : '')+'</div>'
      + '<div class="card-ship mono">'+escHtml(s.shipmentNo)+'</div></div>'+badge+'</div>'
      + '<div class="prog"><div class="prog-row"><span class="prog-num">'+delivered+' / '+planned+' delivered</span>'
      + '<span class="prog-sub">'+pct+'%</span></div>'
      + '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
      + (failed > 0 ? '<span class="pill-warn">'+failed+' failed</span>' : '')
      + (pending > 0 && !allDone ? ' <span class="prog-sub" style="font-size:11px">'+pending+' pending</span>' : '')
      + '</div>'
      + '<div class="crew"><div class="crew-row">'
      + '<div class="crew-field" style="position:relative;"><label class="field-label">'+(s.lorry2 ? escHtml(s.lorryNo)+' — driver' : 'Primary driver')+'</label>'
      + crewPicker('primary', s.assignedPrimary || '')+'</div>'
      + '<div class="crew-field" style="position:relative;"><label class="field-label">'+(s.lorry2 ? escHtml(s.lorryNo)+' — helper (optional)' : 'Helper (optional)')+'</label>'
      + crewPicker('secondary', s.assignedSecondary || '')+'</div>'
      + '</div>'
      + (s.lorry2 ? ('<div class="crew-row" style="margin-top:8px;">'
        + '<div class="crew-field" style="position:relative;"><label class="field-label" style="color:#1A56DB;">'+escHtml(s.lorry2)+' (2nd lorry) — driver</label>'
        + crewPicker('l2primary', s.lorry2Primary || '')+'</div>'
        + '<div class="crew-field" style="position:relative;"><label class="field-label" style="color:#1A56DB;">'+escHtml(s.lorry2)+' — helper (optional)</label>'
        + crewPicker('l2secondary', s.lorry2Secondary || '')+'</div>'
        + '</div>') : '')
      + '<div class="crew-actions">'
      + '<button class="btn btn-danger btn-sm del-ship">Delete</button>'
      + '<button class="btn btn-primary btn-sm save-crew">Save assignment</button>'
      + '</div></div>'
      + '</div>';
  });
  html += '</div>';
  list.innerHTML = html;
  wireCrewPickers();

  // attach save handlers
  list.querySelectorAll('.save-crew').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.card');
      const shipmentNo = card.getAttribute('data-ship');
      const primary = card.querySelector('.sel-primary').value;
      const secondary = card.querySelector('.sel-secondary').value;
      const l2pEl = card.querySelector('.sel-l2primary'), l2sEl = card.querySelector('.sel-l2secondary');
      saveCrew(shipmentNo, primary, secondary, btn, l2pEl ? l2pEl.value : null, l2sEl ? l2sEl.value : null);
    });
  });

  // attach delete handlers
  list.querySelectorAll('.del-ship').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.card');
      const shipmentNo = card.getAttribute('data-ship');
      deleteShipment(shipmentNo, btn);
    });
  });
}

// ── writes ──
async function saveCrew(shipmentNo, primary, secondary, btn, l2primary, l2secondary){
  if(!primary){ showToast('Pick a primary driver first.', 'warning'); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Saving…';
  try{
    // l2primary/l2secondary are null when the card has no 2nd lorry — only send them when present
    const url = SCRIPT_URL + '?action=ASSIGN_SHIPMENT_CREW'
      + '&shipmentNo=' + encodeURIComponent(shipmentNo)
      + '&primary='    + encodeURIComponent(primary)
      + '&secondary='  + encodeURIComponent(secondary || '')
      + (l2primary !== null ? ('&lorry2Primary=' + encodeURIComponent(l2primary || '') + '&lorry2Secondary=' + encodeURIComponent(l2secondary || '')) : '');
    const res = await fetch(url);
    const data = await res.json();
    if(data && data.status === 'success'){
      showToast('Assigned ' + shipmentNo + ' → ' + primary + (secondary ? ' + ' + secondary : '')
        + (l2primary ? (' | 2nd lorry: ' + l2primary + (l2secondary ? ' + ' + l2secondary : '')) : ''), 'success');
      loadShipments();
    }else{
      showToast('Save failed: ' + ((data && data.message) || 'unknown'), 'danger');
      btn.disabled = false; btn.textContent = old;
    }
  }catch(e){
    showToast('Network error: ' + (e.message || 'unknown'), 'danger');
    btn.disabled = false; btn.textContent = old;
  }
}

// Delete a wrongly-imported shipment. GET-write (no photo), like saveCrew.
// Two-step: a 'blocked' response means it has delivered/POD items — offer a forced override.
async function deleteShipment(shipmentNo, btn, force){
  if(!force && !confirm('Delete shipment ' + shipmentNo + '?\n\nThis removes the lorry card and all its invoice rows. This cannot be undone.')) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Deleting…';
  try{
    const url = SCRIPT_URL + '?action=DELETE_SHIPMENT'
      + '&shipmentNo=' + encodeURIComponent(shipmentNo)
      + (force ? '&force=true' : '');
    const res = await fetch(url);
    const data = await res.json();
    if(data && data.status === 'success'){
      showToast('Deleted ' + shipmentNo + ' (' + (data.itemsDeleted||0) + ' invoice rows removed)', 'success');
      loadShipments();
      return;
    }
    if(data && data.status === 'blocked'){
      btn.disabled = false; btn.textContent = old;
      const ok = confirm('⚠ ' + (data.message || 'This shipment has delivered invoices.')
        + '\n\nDelete ANYWAY? The lorry card and invoice rows are removed, but the delivered POD photo records are KEPT (driver KPI is unaffected).');
      if(ok) deleteShipment(shipmentNo, btn, true);   // retry forced
      else showToast('Delete cancelled — POD records kept.', 'info');
      return;
    }
    showToast('Delete failed: ' + ((data && data.message) || 'unknown'), 'danger');
    btn.disabled = false; btn.textContent = old;
  }catch(e){
    showToast('Network error: ' + (e.message || 'unknown'), 'danger');
    btn.disabled = false; btn.textContent = old;
  }
}

// ── xlsx support ───────────────────────────────────────────────────────────────────
// The ERP "Delivery Form" can now be uploaded as .xlsx (not just .csv). We parse it IN THE
// BROWSER with SheetJS and re-emit the SAME comma-CSV shape the backend already understands —
// so NO backend change is needed. The form's printed TOTAL (not our own sum) is carried through,
// keeping the backend arithmetic gate (Σ items == TOTAL) a real correctness check.
// New-xlsx columns: 1=INVOICE 2=DATE 3=CUST CODE 4=CUSTOMER 7=AMOUNT 10=AREA 11=BRAND.
function _xlsxToAmt(v){ if(v==null) return null; const s=String(v).replace(/,/g,'').trim(); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return parseFloat(s); }
function _xlsxCsvCell(v){ v=(v==null)?'':String(v); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function _xlsxRowsToDeliveryCsv(rows){
  const INV_RE=/^[A-Z]{2,4}\d{5,6}$/;
  const cell=(r,c)=> (rows[r]&&rows[r][c]!=null)?String(rows[r][c]).trim():'';
  function hdr(re){
    for(let r=0;r<Math.min(rows.length,14);r++){ const row=rows[r]||[];
      for(let c=0;c<row.length;c++){ if(re.test(String(row[c]||''))){
        // only look a few cells right so a blank field (e.g. PEMANDU) returns '' instead of
        // grabbing a different label sharing the row (e.g. "Est Del Date" far to the right).
        for(let k=c+1;k<row.length&&k<=c+4;k++){ const v=String(row[k]==null?'':row[k]).trim(); if(v&&v!==':') return v; } } } }
    return '';
  }
  const dlNo=hdr(/\bDL\s*NO\b/i), lorry=hdr(/\bNO\s*LORI\b/i), driver=hdr(/\bPEMANDU\b/i);
  const shipDate=hdr(/EST\s*DEL/i)||hdr(/TARIKH\s*HANTAR/i);   // boss decision: ship date = Est Del Date
  let total='';
  for(let r=0;r<rows.length;r++){ const row=rows[r]||[]; let isTot=false;
    for(const x of row){ if(String(x||'').trim().toUpperCase().replace(/[^A-Z]/g,'')==='TOTAL'){ isTot=true; break; } }
    if(isTot){ let mx=null; for(const x of row){ const n=_xlsxToAmt(x); if(n!=null&&(mx==null||n>mx)) mx=n; } if(mx!=null) total=String(mx); break; } }
  const out=[['DL NO',':',dlNo],['NO LORI',':',lorry],['PEMANDU',':',driver],['DATE',':',shipDate]];
  let i=0;
  for(let r=0;r<rows.length;r++){ const inv=cell(r,1), a=_xlsxToAmt(cell(r,7));
    if(!INV_RE.test(inv)||a==null) continue;
    i++;
    out.push([String(i), cell(r,3), cell(r,2), inv, String(a), '', '', cell(r,10), cell(r,11)]);   // invoice row (old layout)
    out.push(['', cell(r,4), '', '', '', '', '', '', '']);                                          // customer on the "next row"
  }
  out.push(['TOTAL','','','','','','','', total]);
  return { csv: out.map(row=>row.map(_xlsxCsvCell).join(',')).join('\r\n'), count: i };
}
async function xlsxFileToDeliveryCsv(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
  const r = _xlsxRowsToDeliveryCsv(rows);
  if(r.count === 0) throw new Error('no invoice rows recognized in this Excel file');
  return r.csv;
}

// Import is a POST (CSV can be large, must ride in the body). no-cors = the POST response is
// unreadable, so we send a clientToken and poll a readable GET for the structured result.
async function uploadCsv(file, mode){
  let text;
  try{
    if(/\.xlsx?$/i.test(file.name)){
      if(typeof XLSX === 'undefined'){ showToast('❌ Excel reader not loaded — check the internet and retry, or upload the CSV version.', 'danger'); return; }
      text = await xlsxFileToDeliveryCsv(file);
    } else {
      text = await file.text();
    }
  }catch(e){ showToast('❌ Could not read this file — NOT imported.' + (e&&e.message?(' ('+e.message+')'):''), 'danger'); return; }
  if(!text || !text.trim()){ showToast('❌ This file is empty — NOT imported.', 'danger'); return; }
  // NOTE: no comma pre-check — space-aligned fixed-width forms with small amounts have no commas.
  // The server-side arithmetic gate (sum == TOTAL) is the real guard against a wrong/garbage file.

  const token = 'imp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  showToast(mode ? ('Importing as ' + (mode === 'append' ? '2nd trip' : 'replacement') + '…')
                 : ('Uploading "' + file.name + '"… verifying…'), 'info');
  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ formType: 'IMPORT_SHIPMENT', csvText: text, fileName: file.name,
                             importedBy: 'SUPERVISOR', clientToken: token, mode: mode || '' })
    });
  }catch(e){ showToast('Upload error: ' + (e.message || 'unknown'), 'danger'); return; }

  // Poll the readable GET for the stashed result (Apps Script can be slow). ~10 tries over ~15s.
  let result = null;
  for(let i = 0; i < 10; i++){
    await new Promise(r => setTimeout(r, 1500));
    try{
      const res = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token));
      const data = await res.json();
      if(data && data.status && data.status !== 'pending'){ result = data; break; }
    }catch(e){ /* keep polling */ }
  }

  if(!result){
    showToast('Upload sent, but no confirmation yet. Tap ↻ Refresh in a moment to check.', 'warning');
    loadShipments();
    return;
  }

  if(result.status === 'needs_decision'){
    // SAME route (DL#) already assigned to another lorry → the office wants 2 lorries on one route.
    if(result.decision === 'second_lorry'){
      const addSecond = confirm('⚠ Route ' + (result.shipmentNo || '') + ' is already assigned to '
        + result.existingLorry + ' (' + result.existingStops + ' stops, ' + result.existingDelivered + ' delivered).\n\n'
        + 'This new form is for ' + result.newLorry + '.\n\n'
        + 'OK = Add ' + result.newLorry + ' as a 2nd lorry on the SAME route '
        + '(both lorries share this delivery list — counted once, no double-count).\n'
        + 'Cancel = other options.');
      if(addSecond){ uploadCsv(file, 'lorry2'); return; }
      const repMsg2 = (result.existingDelivered > 0)
        ? ('⚠ DANGER — Replace will REMOVE ' + result.existingLorry + ' from this route, INCLUDING its '
           + result.existingDelivered + ' DELIVERED stop(s).\n\nOnly do this if ' + result.existingLorry
           + ' was assigned by mistake.\n\nOK = Replace with ' + result.newLorry + '.\nCancel = do nothing.')
        : ('Replace ' + result.existingLorry + ' with ' + result.newLorry + ' on this route?\n\n'
           + 'OK = Replace.\nCancel = do nothing.');
      if(confirm(repMsg2)){ uploadCsv(file, 'replace'); return; }
      showToast('Import cancelled — nothing changed.', 'info');
      loadShipments();
      return;
    }
    // Otherwise: SAME lorry already has a DIFFERENT shipment today (2nd trip).
    const isSecond = confirm('⚠ ' + result.lorryNo + ' already has a shipment today ('
      + result.existingStops + ' stops, ' + result.existingDelivered + ' delivered).\n\n'
      + 'This NEW file has ' + result.newStops + ' stops.\n\n'
      + 'OK = ADD these as a 2nd trip (keep the first — already-done stops stay done).\n'
      + 'Cancel = other options.');
    if(isSecond){ uploadCsv(file, 'append'); return; }
    const replaceMsg = (result.existingDelivered > 0)
      ? ('⚠ DANGER — Replace will DELETE the first trip, INCLUDING its ' + result.existingDelivered
         + ' DELIVERED stop(s) (they disappear from the dashboard).\n\n'
         + 'Only do this if the first import was a mistake.\n\n'
         + 'OK = DELETE first & replace.\nCancel = do nothing.')
      : ('Replace / overwrite the first shipment with THIS file?\n\n'
         + 'OK = REPLACE (the first one is removed).\nCancel = do nothing.');
    if(confirm(replaceMsg)){ uploadCsv(file, 'replace'); return; }
    showToast('Import cancelled — nothing changed.', 'info');
    loadShipments();
    return;
  }
  if(result.status === 'success'){
    if(result.mode === 'append'){
      showToast('✅ Added ' + result.added + ' stop(s) to ' + (result.lorryNo || '') +
                ' as a 2nd trip — now ' + result.itemCount + ' total.', 'success');
    }else if(result.mode === 'lorry2'){
      showToast('✅ ' + (result.lorry2 || '') + ' added as a 2nd lorry on route ' +
                (result.shipmentNo || result.shipmentKey || '') + ' (shared with ' + (result.lorryNo || '') +
                ' — counted once).', 'success');
    }else{
      const via = result.parserUsed === 'gemini' ? ' (auto-recovered)' : '';
      showToast('✅ Imported ' + (result.lorryNo || result.shipmentNo || '') + ' — ' +
                result.itemCount + ' invoices.' + via, 'success');
    }
  }else if(result.status === 'failed' && result.formTotal != null){
    showToast('❌ TOTAL ERROR — invoices add up to RM ' + fmtNum(result.parsedSum) +
              ' but the form TOTAL is RM ' + fmtNum(result.formTotal) +
              ' (off by RM ' + fmtNum(result.diff) + '). NOT imported — please check the file.', 'danger');
  }else if(result.status === 'failed'){
    showToast('❌ Could not read this file — NOT imported.', 'danger');
  }else{
    showToast('Import error: ' + (result.message || 'unknown') + ' — not imported.', 'danger');
  }
  loadShipments();
}

// ── init ──
document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('csvFile').click());
document.getElementById('csvFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) uploadCsv(f);
  e.target.value = '';   // allow re-selecting the same file
});
document.getElementById('refreshBtn').addEventListener('click', loadShipments);
document.getElementById('dateInput').addEventListener('change', e => { _date = e.target.value || todayStr(); loadShipments(); });

(async function init(){
  _date = todayStr();
  document.getElementById('dateInput').value = _date;
  await loadDrivers();
  await loadShipments();
})();
</script>
