// Shows "Scanning…", runs scanInvoice_, then waits for the driver. Resolves the final entry,
// or null when the driver chose Retake. Never rejects, and can never hold the driver: after 3 s a
// "use the photo without scanning" button appears, and after SCAN_SLOW_MS + 3 s the plain photo
// is taken automatically. The scan works on a COPY of the entry, so a scan that finishes late can
// never change a photo the driver already kept.
function scanAndReview_(blob, plainEntry){
  if (!SCANNER_ON) return Promise.resolve(plainEntry);    // kill switch = today's flow, no review screen
  try{ if (typeof bcWarm_ === 'function') bcWarm_(); }catch(e){}   // [R3] barcode reader downloads while this scan runs
  var ov = _srBuild_();
  var img = document.getElementById('srImg'), busy = document.getElementById('srBusy'), ed = document.getElementById('srEditor');
  var btns = document.getElementById('srBtns'), hint = document.getElementById('srHint'), tag = document.getElementById('srTag');
  var skip = document.getElementById('srSkip'), tog = document.getElementById('srToggle');
  // nothing from the previous photo may stay clickable while this one scans
  ['srUse', 'srRetake', 'srAdjust', 'srToggle'].forEach(function(id){ document.getElementById(id).onclick = null; });
  tog.style.display = 'none'; tog.innerHTML = L('Original', 'Asal'); skip.style.display = 'none';
  img.style.display = 'none'; img.removeAttribute('src'); busy.style.display = 'block'; ed.style.display = 'none'; ed.innerHTML = '';
  btns.style.visibility = 'hidden'; hint.innerHTML = ''; tag.textContent = '';
  ov.style.display = 'flex';
  try{ document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden'; }catch(e){}
  return new Promise(function(resolve){
    var showingOrig = false, editor = null, done = false, scanned = null, work = Object.assign({}, plainEntry), job = { cancelled: false };
    var skipT = setTimeout(function(){ if (!done && !scanned) skip.style.display = 'block'; }, 3000);
    var hardT = setTimeout(function(){ if (!done && !scanned){ plainEntry.scan = { ok: false, err: 'timed out' }; finish(plainEntry); } }, SCAN_SLOW_MS + 3000);
    skip.onclick = function(){ if (scanned) return; plainEntry.scan = { ok: false, err: 'skipped by driver' }; finish(plainEntry); };
    function finish(val){
      if (done) return; done = true; job.cancelled = true;
      clearTimeout(skipT); clearTimeout(hardT); skip.onclick = null; skip.style.display = 'none';
      try{ if (editor) editor.destroy(); }catch(e){}
      ed.innerHTML = ''; ov.style.display = 'none'; img.removeAttribute('src');
      if (!_ac){ try{ document.documentElement.style.overflow = ''; document.body.style.overflow = ''; }catch(e){} }
      // Retake included. [R3] a barcode read still running uses the full-size photo: free it when that read ends
      // (Retake / skip: the read is stopped first — a thrown-away photo needs no barcode)
      if (val !== work && typeof bcCancel_ === 'function') bcCancel_(work);
      if (work._scanSrc){ var ss = work._scanSrc, free = function(){ try{ ss.width = 0; }catch(e){} };
        work._scanSrc = null; if (work._bcP && !work._bcDone) work._bcP.then(free, free); else free(); }
      resolve(val);
    }
    function show(entry){
      img.src = showingOrig && entry.origDataUrl ? entry.origDataUrl : entry.dataUrl;
      img.style.display = 'block'; busy.style.display = 'none'; ed.style.display = 'none'; skip.style.display = 'none';
      btns.style.visibility = 'visible';
      _srTag_(entry);
    }
    scanInvoice_(blob, work, job).then(function(entry){
      if (done){ if (entry && entry._scanSrc){ try{ entry._scanSrc.width = 0; }catch(e){} entry._scanSrc = null; } return; }   // driver already moved on
      scanned = entry;
      show(entry);
      try{ if (typeof bcStart_ === 'function') bcStart_(entry); }catch(e){}   // [R3] read the invoice barcode while the driver looks
      document.getElementById('srUse').onclick = function(){ finish(entry); };
      document.getElementById('srRetake').onclick = function(){ finish(null); };
      document.getElementById('srToggle').onclick = function(){ showingOrig = !showingOrig; show(entry);
        this.innerHTML = showingOrig ? L('Scan', 'Imbasan') : L('Original', 'Asal'); };
      document.getElementById('srAdjust').onclick = function(){
        if (!entry._scanSrc || !_scanic) return;
        btns.style.visibility = 'hidden'; img.style.display = 'none'; ed.style.display = 'block';
        hint.innerHTML = L('Drag the 4 dots onto the paper corners, then tap <b>Done</b>.', 'Tarik 4 titik ke sudut kertas, kemudian tekan <b>Siap</b>.');
        var src = entry._scanSrc, c0 = entry.scan && entry.scan.corners;
        if (!c0){ var mx = src.width * 0.08, my = src.height * 0.08;
          c0 = { topLeft: { x: mx, y: my }, topRight: { x: src.width - mx, y: my }, bottomRight: { x: src.width - mx, y: src.height - my }, bottomLeft: { x: mx, y: src.height - my } }; }
        try{
          editor = _scanic.createCornerEditor({ container: ed, image: src, corners: c0, handleHitArea: 48,
            magnifier: { enabled: true, zoom: 2.5, size: 120 },
            toolbar: { reset: true, cancel: true, apply: true, labels: { reset: L('Reset', 'Set semula'), cancel: L('Cancel', 'Batal'), apply: L('Done', 'Siap') } },
            onCancel: function(){ try{ editor.destroy(); }catch(e){} editor = null; show(entry); },
            onConfirm: function(corners){
              try{ editor.destroy(); }catch(e){} editor = null;
              busy.style.display = 'block'; ed.style.display = 'none';
              setTimeout(async function(){
                try{
                  var res = await _scanFromCorners_(src, corners), scan = res.canvas;
                  if (res.cropped){
                    entry.dataUrl = scan.toDataURL('image/jpeg', SCAN_OUT_Q);
                    entry.scan.cropped = true; entry.scan.corners = corners; entry.scan.adjusted = true; entry.scan.sure = true;
                    entry.scan.out = [scan.width, scan.height];
                    entry.scan.aspect = res.aspect ? Math.round(res.aspect * 1000) / 1000 : null;
                    entry.scan.clip = res.clip;
                    entry.name = String(entry.name).replace(/_scan[CF]\.jpg$/i, '') + '_scanC.jpg';
                  }
                  scan.width = 0;
                }catch(e){ console.warn('re-scan failed:', e); }
                // [R3] the barcode was not found with the old corners: try again with the driver's
                if (entry._bcDone && !entry._bc && typeof bcStart_ === 'function'){ entry._bcP = null; entry._bcDone = false; try{ bcStart_(entry); }catch(e){} }
                showingOrig = false; document.getElementById('srToggle').innerHTML = L('Original', 'Asal');
                show(entry);
              }, 30);
            } });
        }catch(e){ console.warn('corner editor failed:', e); show(entry); }
      };
    }).catch(function(e){ console.warn('review failed — plain photo used:', e); finish(plainEntry); });
  });
}

// warm the scanner up in the background so the first photo does not wait for the download
setTimeout(function(){ _scanicLoad_(); }, 1500);

// ══════════════════════════════════════════════════════════════════════════════════════
// [R3 2026-10-24] Which invoice is this photo? — read the barcode printed on every CLF invoice.
// Field evidence 2026-10-22: at a big stop the per-invoice scan archive was scrambled (the file named
// for invoice A held invoice B) because photos are paired with invoices purely by POSITION and drivers
// shoot in a different order than the list. The form now reads each photo's barcode and sends the
// photos in list order (POD_next.html: _bcPlace_, _bcPayload_); this block only answers "what does the
// barcode on this photo say".
// Calibrated on 5 real driver photos: CLF invoices print the invoice number as CODE 39, no check
// character, nothing else ("MKMD053351"), in a band under the INVOICE box (upper right of the page).
// Pipeline — runs while the driver looks at the scan review screen, never blocks the camera:
//   1. the page, flattened with the scanner's 4 corners (or the plain photo when there was no scan),
//      at 4 px/mm; a "bar-ness" map (strong left-right edges, weak up-down edges) gives candidate bands
//   2. each band is re-sampled from the FULL-SIZE photo along its own axis at ~12 px/mm, so every row
//      crosses every bar even when the paper is bent or the corners are a little off (on the real photos
//      the band sat 8-12 degrees off the page axis — no row of the flattened page crossed the whole code)
//   3. read by the phone's own BarcodeDetector where it exists (Android Chrome), else / then by
//      zxing-cpp (WebAssembly; zxing-wasm 3.1.5, MIT + Apache-2.0, self-hosted in vendor/, ~1 MB,
//      downloaded once on the first invoice photo)
// Fail-open everywhere: no reader, a throw, a slow phone → null = "unreadable": the photo then goes to
// the next invoice in list order exactly as before, marked "?" for the driver to check.
// ══════════════════════════════════════════════════════════════════════════════════════
var BC_ON = true;                                    // kill switch: false = never read barcodes (today's flow)
var BC_ZX_JS = 'vendor/zxing-reader-3.1.5.js', BC_ZX_WASM = 'vendor/zxing_reader-3.1.5.wasm';
var BC_FORMATS = ['Code39', 'Code128', 'Code93'];    // CLF prints Code 39; the other two only as a safety net
var BC_NATIVE_FORMATS = ['code_39', 'code_128', 'code_93'];
var BC_PLANE_PXMM = 4;                               // analysis page: 4 px per mm (A4 = 840 x 1188)
var BC_STRIP_PXMM = 12;                              // band re-sampled at 12 px per mm (a 0.4 mm bar = ~5 px)
var BC_SLOW_MS = 8000;                               // no new attempt is started after this
var _bcZX = null, _bcZXLoading = null, _bcZXState = 'idle', _bcNat = null, _bcNatState = 'idle', _bcLast = null;

// a decoded string → the form the invoice list is compared in (Code 39 can also carry - . space $ / + %)
function bcNorm_(s){ return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }

function _bcYield_(job){
  return new Promise(function(ok, no){ setTimeout(function(){ if (job && job.cancelled) no(new Error('cancelled')); else ok(); }, 0); });
}

// zxing-cpp reader, loaded on first use. The IIFE build is one file + one .wasm; its default would fetch the
// .wasm from a CDN, so locateFile points it at our own copy. A WebView too old to parse it only loses the reader.
function _bcZXLoad_(){
  if (!BC_ON) return Promise.resolve(null);
  if (_bcZX) return Promise.resolve(_bcZX);
  if (_bcZXLoading) return _bcZXLoading;
  _bcZXState = 'loading';
  _bcZXLoading = new Promise(function(ok, no){
    var s = document.createElement('script');
    s.src = new URL(BC_ZX_JS, document.baseURI).href; s.async = true;
    s.onload = function(){ ok(); }; s.onerror = function(){ no(new Error('reader script failed')); };
    document.head.appendChild(s);
  }).then(function(){
    var Z = window.ZXingWASM;
    if (!Z || !Z.prepareZXingModule || !Z.readBarcodes) throw new Error('reader missing');
    var wasm = new URL(BC_ZX_WASM, document.baseURI).href;
    return Z.prepareZXingModule({ overrides: { locateFile: function(p, pre){ return /\.wasm$/.test(p) ? wasm : pre + p; } }, fireImmediately: true })
      .then(function(){ _bcZX = Z; _bcZXState = 'ready'; return Z; });
  }).catch(function(e){
    console.warn('barcode reader unavailable — photos will be matched by hand:', e);
    _bcZXState = 'failed'; _bcZXLoading = null; return null;
  });
  return _bcZXLoading;
}
// the phone's own reader (Android Chrome); iPhones and desktop Windows have none
function _bcNativeLoad_(){
  if (_bcNatState !== 'idle') return Promise.resolve(_bcNat);
  _bcNatState = 'none';
  try{
    if (!BC_ON || typeof window.BarcodeDetector !== 'function') return Promise.resolve(null);
    var gs = window.BarcodeDetector.getSupportedFormats ? window.BarcodeDetector.getSupportedFormats() : Promise.resolve(BC_NATIVE_FORMATS);
    return Promise.resolve(gs).then(function(list){
      var f = BC_NATIVE_FORMATS.filter(function(x){ return (list || []).indexOf(x) >= 0; });
      if (!f.length) return null;
      _bcNat = new window.BarcodeDetector({ formats: f }); _bcNatState = 'ready'; return _bcNat;
    }).catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}

// unit square (u, v) → the page quad TL, TR, BR, BL (Heckbert's square-to-quad homography)
function _bcHomog_(c){
  var x0 = c.topLeft.x, y0 = c.topLeft.y, x1 = c.topRight.x, y1 = c.topRight.y, x2 = c.bottomRight.x, y2 = c.bottomRight.y, x3 = c.bottomLeft.x, y3 = c.bottomLeft.y;
  var dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3, g = 0, h = 0;
  if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9){ var den = dx1 * dy2 - dx2 * dy1; if (Math.abs(den) < 1e-12) return null; g = (dx3 * dy2 - dx2 * dy3) / den; h = (dx1 * dy3 - dx3 * dy1) / den; }
  var a = x1 - x0 + g * x1, b = x3 - x0 + h * x3, d = y1 - y0 + g * y1, e = y3 - y0 + h * y3;
  return function(u, v){ var w = g * u + h * v + 1; return [(a * u + b * v + x0) / w, (d * u + e * v + y0) / w]; };
}
// grey levels of a canvas region, optionally scaled down first (k ≤ 1)
function _bcLum_(canvas, x, y, w, h, k){
  k = k || 1;
  var W = Math.max(1, Math.round(w * k)), H = Math.max(1, Math.round(h * k)), c = canvas, sx = x, sy = y;
  if (k !== 1){
    c = document.createElement('canvas'); c.width = W; c.height = H;
    var cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(canvas, x, y, w, h, 0, 0, W, H);
    sx = 0; sy = 0;
  }
  var d = c.getContext('2d', { willReadFrequently: true }).getImageData(sx, sy, W, H).data, L = new Float32Array(W * H), i;
  for (i = 0; i < W * H; i++) L[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
  if (c !== canvas) c.width = 0;

}
function _bcBilin_(img, x, y){
  var w = img.w, h = img.h, ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  if (ix < 0 || iy < 0 || ix >= w - 1 || iy >= h - 1) return 255;
  var k = iy * w + ix, L = img.L;
  return (L[k] * (1 - fx) + L[k + 1] * fx) * (1 - fy) + (L[k + w] * (1 - fx) + L[k + w + 1] * fx) * fy;
}
// Catmull-Rom bicubic: keeps bar edges sharp when a low-resolution photo is enlarged for the reader
var _bcWX = new Float64Array(4), _bcWY = new Float64Array(4);
function _bcCubW_(t, o){ var t2 = t * t, t3 = t2 * t; o[0] = (-t3 + 2 * t2 - t) / 2; o[1] = (3 * t3 - 5 * t2 + 2) / 2; o[2] = (-3 * t3 + 4 * t2 + t) / 2; o[3] = (t3 - t2) / 2; }
function _bcCubic_(img, x, y){
  var w = img.w, h = img.h, ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 1 || iy < 1 || ix >= w - 2 || iy >= h - 2) return _bcBilin_(img, x, y);
  _bcCubW_(x - ix, _bcWX); _bcCubW_(y - iy, _bcWY);
  var L = img.L, s = 0, r, c;
  for (r = 0; r < 4; r++){
    var row = (iy - 1 + r) * w + ix - 1, v = 0;
    for (c = 0; c < 4; c++) v += L[row + c] * _bcWX[c];
    s += v * _bcWY[r];

}

// The analysis plane: the flattened page at BC_PLANE_PXMM (corners known) or the photo itself (no corners).
// toSrc(x, y) maps a plane point to full-size source pixels.
function _bcPlane_(src, corners, hw){
  var maxSide = Math.max(src.width, src.height);
  if (corners){
    var H = _bcHomog_(corners); if (!H) return null;
    var land = hw && hw < 1, pw = Math.round((land ? 297 : 210) * BC_PLANE_PXMM), ph = Math.round(pw * (hw || Math.SQRT2));
    // sample from a smaller copy of the photo: the plane only needs ~4 px/mm, the strips go back to full size
    var k = Math.min(1, 1400 / maxSide), small = _bcLum_(src, 0, 0, src.width, src.height, k), L = new Float32Array(pw * ph), x, y;
    for (y = 0; y < ph; y++) for (x = 0; x < pw; x++){ var p = H((x + 0.5) / pw, (y + 0.5) / ph); L[y * pw + x] = _bcBilin_(small, p[0] * k - 0.5, p[1] * k - 0.5); }
    return { w: pw, h: ph, L: L, toSrc: function(px, py){ return H(px / pw, py / ph); }, pxmm: BC_PLANE_PXMM };
  }
  // no page outline: the photo itself, kept large — the bars of a page that fills only part of a phone photo
  // are barely 1 px wide, and a smaller copy blurs them into grey before the bar-ness map can see them
  var s = Math.min(1, 2000 / maxSide), im = _bcLum_(src, 0, 0, src.width, src.height, s);
  // the scale is unknown: assume the page fills ~70% of the photo's shorter side
  var pxmm = Math.min(im.w, im.h) * 0.7 / 210;
  return { w: im.w, h: im.h, L: im.L, toSrc: function(px, py){ return [px / s, py / s]; }, pxmm: pxmm };
}

// Candidate barcode bands. Bar-ness = (box sum of |dI/dx|) − 1.5 × (box sum of |dI/dy|) over ~6 x 6 mm:
// a barcode is dense left-right edges with almost no up-down ones; text and table lines have both or few.
// The same for barcodes standing on their side (bars horizontal). Each band: centre, axis, length, height.
function _bcBands_(pl){
  var w = pl.w, h = pl.h, L = pl.L, G = 2, gw = Math.floor(w / G), gh = Math.floor(h / G), x, y, i;
  // |d/dx| and |d/dy| summed per 2 x 2 px cell, then box sums over ~6 x 6 mm from integral images of the cells
  var cX = new Float32Array(gw * gh), cY = new Float32Array(gw * gh);
  for (y = 1; y < gh * G - 1; y++) for (x = 1; x < gw * G - 1; x++){
    i = y * w + x; var k0 = ((y / G) | 0) * gw + ((x / G) | 0);
    cX[k0] += Math.abs(L[i + 1] - L[i - 1]); cY[k0] += Math.abs(L[i + w] - L[i - w]);
  }
  function integ(a){ var I = new Float64Array((gw + 1) * (gh + 1)), xx, yy; for (yy = 0; yy < gh; yy++){ var run = 0; for (xx = 0; xx < gw; xx++){ run += a[yy * gw + xx]; I[(yy + 1) * (gw + 1) + xx + 1] = I[yy * (gw + 1) + xx + 1] + run; } } return I; }
  var IX = integ(cX), IY = integ(cY), r = Math.max(2, Math.round(3 * pl.pxmm / G));
  var BH = cX, BV = cY, mH = 0, mV = 0;                       // the box sums below read only IX / IY, so cX can take the result
  var tmp = new Float32Array(gw * gh);
  function box(I, x0, y0, x1, y1){ return I[y1 * (gw + 1) + x1] - I[y0 * (gw + 1) + x1] - I[y1 * (gw + 1) + x0] + I[y0 * (gw + 1) + x0]; }
  for (y = 0; y < gh; y++) for (x = 0; x < gw; x++){
    var x0 = Math.max(0, x - r), x1 = Math.min(gw, x + r + 1), y0 = Math.max(0, y - r), y1 = Math.min(gh, y + r + 1), area = (x1 - x0) * (y1 - y0) * G * G;
    var sx = box(IX, x0, y0, x1, y1) / area, sy = box(IY, x0, y0, x1, y1) / area, k = y * gw + x;
    BH[k] = sx - 1.5 * sy; tmp[k] = sy - 1.5 * sx;
    if (BH[k] > mH) mH = BH[k]; if (tmp[k] > mV) mV = tmp[k];
  }
  BV = tmp; IX = IY = null;
  var out = [];
  [[BH, mH, false], [BV, mV, true]].forEach(function(t){
    var B = t[0], m = t[1], vert = t[2];
    if (!(m > 6)) return;                                     // nothing bar-like at all (blank / flat image)
    var T = 0.35 * m, lab = new Int32Array(gw * gh), next = 0, stack = [];
    for (var s = 0; s < gw * gh; s++){
      if (lab[s] || !(B[s] > T)) continue;
      next++; lab[s] = next; stack.push(s);
      var cnt = 0, sw = 0, mx = 0, my = 0, pts = [];
      while (stack.length){
        var q = stack.pop(), qx = q % gw, qy = (q - qx) / gw, wq = B[q];
        cnt++; sw += wq; mx += wq * qx; my += wq * qy; pts.push(q);
        if (qx > 0 && !lab[q - 1] && B[q - 1] > T){ lab[q - 1] = next; stack.push(q - 1); }
        if (qx < gw - 1 && !lab[q + 1] && B[q + 1] > T){ lab[q + 1] = next; stack.push(q + 1); }
        if (qy > 0 && !lab[q - gw] && B[q - gw] > T){ lab[q - gw] = next; stack.push(q - gw); }
        if (qy < gh - 1 && !lab[q + gw] && B[q + gw] > T){ lab[q + gw] = next; stack.push(q + gw); }
      }
      if (cnt < 12) continue;
      mx /= sw; my /= sw;
      // principal axis of the blob = the band's own direction (it may sit several degrees off the page axis)
      var sxx = 0, syy = 0, sxy = 0, j, p, dx, dy;
      for (j = 0; j < pts.length; j++){ p = pts[j]; dx = p % gw - mx; dy = (p - p % gw) / gw - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
      var th = 0.5 * Math.atan2(2 * sxy, sxx - syy), ux = Math.cos(th), uy = Math.sin(th);
      if (vert ? (Math.abs(uy) < Math.abs(ux)) : (Math.abs(ux) < Math.abs(uy))){ var t0 = ux; ux = -uy; uy = t0; }   // long axis across the bars
      if (vert ? uy < 0 : ux < 0){ ux = -ux; uy = -uy; }

      for (j = 0; j < pts.length; j++){ p = pts[j]; dx = p % gw - mx; dy = (p - p % gw) / gw - my; var a = dx * ux + dy * uy, b = -dx * uy + dy * ux;

      if (len < 15 || hgt < 3) continue;                      // shorter than 15 mm: not an invoice barcode
      out.push({ score: sw, cx: (mx + 0.5) * G, cy: (my + 0.5) * G, ux: ux, uy: uy, a0: a0 * G, a1: (a1 + 1) * G, b0: b0 * G, b1: (b1 + 1) * G, vert: vert });

}

// One band re-sampled from the full-size photo along its own axis → grey ImageData for the reader.
function _bcStrip_(src, pl, band){
  var ux = band.ux, uy = band.uy, nx = -uy, ny = ux;
  var len = band.a1 - band.a0, ext = 0.18 * len + 5 * pl.pxmm;                    // the bar-ness blob can miss the code's ends
  var a0 = band.a0 - ext, a1 = band.a1 + ext, b0 = band.b0 - pl.pxmm, b1 = band.b1 + pl.pxmm;
  var k = BC_STRIP_PXMM / pl.pxmm, W = Math.round((a1 - a0) * k), H = Math.round((b1 - b0) * k);
  if (W > 2400){ k *= 2400 / W; W = 2400; H = Math.round((b1 - b0) * k); }
  if (H > 360) H = 360;
  if (W < 40 || H < 8) return null;
  // the strip's footprint in the source → read only that region of the photo, at full size
  var corners = [[a0, b0], [a1, b0], [a1, b1], [a0, b1]].map(function(t){ return pl.toSrc(band.cx + t[0] * ux + t[1] * nx, band.cy + t[0] * uy + t[1] * ny); });
  var fx0 = Math.max(0, Math.floor(Math.min.apply(null, corners.map(function(c){ return c[0]; }))) - 3), fy0 = Math.max(0, Math.floor(Math.min.apply(null, corners.map(function(c){ return c[1]; }))) - 3);
  var fx1 = Math.min(src.width, Math.ceil(Math.max.apply(null, corners.map(function(c){ return c[0]; }))) + 3), fy1 = Math.min(src.height, Math.ceil(Math.max.apply(null, corners.map(function(c){ return c[1]; }))) + 3);
  if (fx1 - fx0 < 8 || fy1 - fy0 < 8) return null;

  var out = new ImageData(W, H), od = out.data, x, y, hs = (b1 - b0) / H;
  for (y = 0; y < H; y++){
    var b = b0 + (y + 0.5) * hs;
    for (x = 0; x < W; x++){
      var a = a0 + (x + 0.5) / k, s = pl.toSrc(band.cx + a * ux + b * nx, band.cy + a * uy + b * ny);
      var v = _bcCubic_(reg, s[0] - fx0 - 0.5, s[1] - fy0 - 0.5), o = 4 * (y * W + x);
      od[o] = od[o + 1] = od[o + 2] = v; od[o + 3] = 255;
    }

}

// several codes on one paper: an invoice-number-shaped one (letters + digits, e.g. MKDL044709) wins
function _bcBest_(list){
  var best = null;
  for (var i = 0; i < list.length; i++){
    var t = bcNorm_(list[i].raw);
    if (t.length < 4) continue;
    if (/^[A-Z]{2,6}[0-9]{4,8}$/.test(t)) return list[i];
    if (!best) best = list[i];
  }
  return best;
}
async function _bcZXRead_(Z, img, extra){
  var r = await Z.readBarcodes(img, Object.assign({ formats: BC_FORMATS, tryHarder: true, tryRotate: false, tryInvert: false, tryDownscale: false, maxNumberOfSymbols: 4 }, extra || {}));
  return _bcBest_(r.filter(function(x){ return x.isValid; }).map(function(x){ return { raw: String(x.text), format: x.format }; }));
}
async function _bcNatRead_(det, img){
  try{
    var r = await det.detect(img);
    return _bcBest_((r || []).map(function(x){ return { raw: String(x.rawValue), format: x.format }; }));
  }catch(e){}
  return null;
}

// Reads the barcode of one invoice photo. entry = the review screen's entry: _scanSrc + scan.corners when the
// scanner ran (best: the full-size photo + the page outline), else the plain photo in entry.dataUrl.
// Resolves { text (normalised), raw, format, how, ms } or null. Never rejects.
async function bcDecode_(entry, job){
  var t0 = Date.now(), info = { ok: false, ms: 0, how: '', text: '', err: '' };
  _bcLast = info;
  if (!BC_ON || !entry) return null;
  var src = null, own = false, res = null;
  try{
    var zxP = _bcZXLoad_(), natP = _bcNativeLoad_();
    var sc = entry.scan || {}, corners = (entry._scanSrc && sc.cropped && sc.corners) ? sc.corners : null;
    if (entry._scanSrc && entry._scanSrc.width) src = entry._scanSrc;
    else {
      var im = await new Promise(function(ok, no){ var i = new Image(); i.onload = function(){ ok(i); }; i.onerror = function(){ no(new Error('photo decode failed')); }; i.src = entry.dataUrl; });
      src = document.createElement('canvas'); src.width = im.naturalWidth; src.height = im.naturalHeight; own = true;
      src.getContext('2d').drawImage(im, 0, 0);
    }
    var nat = await natP;
    if (nat){ res = await _bcNatRead_(nat, src); if (res) res.how = 'native'; }   // fast, any angle
    await _bcYield_(job);
    var hw = corners ? (_scanAspect_(corners, src.width, src.height) || (sc.out ? sc.out[1] / sc.out[0] : Math.SQRT2)) : null;
    var pl = res ? null : _bcPlane_(src, corners, hw);
    await _bcYield_(job);
    var bands = pl ? _bcBands_(pl) : [];
    info.bands = bands.length;
    var Z = res ? null : await Promise.race([zxP, new Promise(function(ok){ setTimeout(function(){ ok(null); }, 6000); })]);
    for (var b = 0; !res && b < bands.length && Date.now() - t0 < BC_SLOW_MS; b++){
      await _bcYield_(job);
      var strip = _bcStrip_(src, pl, bands[b]);
      if (!strip) continue;
      if (nat){ res = await _bcNatRead_(nat, strip); if (res){ res.how = 'native-band'; break; } }
      if (!Z) continue;
      res = await _bcZXRead_(Z, strip, null);
      if (!res) res = await _bcZXRead_(Z, strip, { binarizer: 'GlobalHistogram' });
      if (res) res.how = 'band' + b;
    }
    // last resort: the whole photo (any layout, any quarter turn)
    if (!res && Z && Date.now() - t0 < BC_SLOW_MS){
      await _bcYield_(job);
      var k = Math.min(1, 1600 / Math.max(src.width, src.height)), c = document.createElement('canvas');   // keeps the reader's memory small
      c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
      var cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(src, 0, 0, c.width, c.height);
      var full = cx.getImageData(0, 0, c.width, c.height); c.width = 0;
      res = await _bcZXRead_(Z, full, { tryRotate: true, tryDownscale: true });
      if (res) res.how = 'whole';
    }
    if (!Z && !nat) info.err = 'no reader';
  }catch(e){
    if (!/cancelled/.test(String(e && e.message))) console.warn('barcode read failed (photo kept, matched by hand):', e);
    info.err = String((e && e.message) || e); res = null;
  }finally{
    if (own && src){ try{ src.width = 0; }catch(e2){} }
  }
  info.ms = Date.now() - t0;
  if (res){ res.text = bcNorm_(res.raw); res.ms = info.ms; info.ok = true; info.how = res.how; info.text = res.text; }
  try{ _scanDebug_(); }catch(e3){}
  return res;
}
// starts a read for an entry once (the review screen calls this as soon as the scan is on screen); a second call
// for the same entry returns the same promise. bcCancel_ stops a read whose photo was thrown away (Retake).
function bcStart_(entry){
  if (!BC_ON || !entry) return null;
  if (entry._bcP) return entry._bcP;
  var job = { cancelled: false };
  entry._bcJob = job;
  entry._bcP = bcDecode_(entry, job).then(function(r){ entry._bc = r || null; entry._bcDone = true; return r; }, function(){ entry._bcDone = true; return null; });
  return entry._bcP;
}
function bcCancel_(entry){ if (entry && entry._bcJob) entry._bcJob.cancelled = true; }
// warm the reader up when the invoice camera opens / an invoice photo is scanned — not at page load, so a driver
// who never photographs an invoice never downloads it. The ~1 MB arrives while the driver aims; once loaded it
// stays for the page session (a dead zone later in the day does not matter, only one before the first photo).
function bcWarm_(){ if (!BC_ON) return; try{ _bcNativeLoad_(); _bcZXLoad_(); }catch(e){} }


// photo taken for a customer → submit delivery for that customer's pending invoices
// STEP 1: take photo(s) for a customer → buffer + show thumbnails (does NOT submit yet)
async function onShipPhoto(input){
  // Cancelled camera fires this with empty files — MUST reset _deliverIdx or the
  // visibilitychange re-sync stays suppressed for the rest of the session.
  if (_deliverIdx < 0 || !input.files || !input.files.length){ input.value=''; _deliverIdx = -1; return; }
  var g = _shipGroups[_deliverIdx];
  if (!g){ input.value=''; return; }
  var gKey = g.key;   // a background re-sync may REPLACE _shipGroups while we await compression —
                      // re-resolve by key after every await so the photo lands on the live object
  for (var f=0; f<input.files.length; f++){
    var entry;
    try { entry = await compressImage(input.files[f]); } catch(err){ entry = await readFileAsDataUrl(input.files[f]); }
    // [E5] quality gate (same rules the retired manual upload had): 1-2 = retake only (shot discarded; the
    // input resets below so tapping re-opens the camera), >=3 may "Upload anyway" → flagged.
    try {
      if (entry.quality && !entry.quality.ok){
        _qGateTries++;
        var act = await showQualityGate_(entry.quality.reasons, _qGateTries >= 3);
        if (act !== 'anyway') continue;   // discarded — not buffered
        entry.qualityFlag = true;
      }
      _qGateTries = 0;   // pass or flagged-add both reset the streak
    } catch (gateErr) { console.warn('gate failed open:', gateErr); }

    if (!ev) setTimeout(function(){ if (_acLive(s)) _acGhost(0, true); }, AC_GHOST_MS);
    try{ window._acCamRes = [s.video.videoWidth, s.video.videoHeight]; _scanDebug_(); }catch(e){}
    try{
      var caps = (s.track && s.track.getCapabilities) ? s.track.getCapabilities() : {};
      if (caps && caps.torch){ s.torchOK = true; _acEl('acTorch').style.display = 'inline-flex'; }
    }catch(e){}
    _acStatus(ev ? (s.kind === 'pallet' ? L('Take a photo of the pallets', 'Ambil gambar pallet') : L('Take a photo of the shop or the problem', 'Ambil gambar kedai atau masalah'))
                 : L('Put the invoice in the frame', 'Letak invois dalam bingkai'), 0);
    s.lastTick = 0;
    s.raf = requestAnimationFrame(function(){ _acTick(s); });
  }catch(err){
    clearTimeout(wd);
    console.warn('AutoCap unavailable:', err);
    if (stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    if (_acLive(s)) _acFallback(s, (err && err.name) || (err && err.message) || 'error', false);   // a stale rejection must not touch a newer session
  }
}

function _acTorch(s, on){
  if (!s || !s.track || !s.torchOK) return;
  try{ s.track.applyConstraints({ advanced: [{ torch: !!on }] }).then(function(){ s.torchOn = !!on; var b = _acEl('acTorch'); if (b && _acLive(s)) b.style.background = on ? '#FBBF24' : 'rgba(255,255,255,.15)'; }).catch(function(){}); }catch(e){}
}

function _acTick(s){
  if (!_acLive(s)) return;
  s.raf = requestAnimationFrame(function(){ _acTick(s); });
  var now = Date.now();
  if (now - s.lastTick < AC_INTERVAL_MS || s.busy) return;
  s.lastTick = now;
  var v = s.video;
  if (s.track && s.track.readyState !== 'live'){ _acFallback(s, 'camera stopped', false); return; }   // another app took the camera
  if (!(v.videoWidth > 0)) return;
  if (s.mode === 'evidence') return;   // proof / pallet photo: the driver frames it and taps — nothing to analyse
  try{
    // 1) working copy ≤640px (same scale class the after-the-fact gate uses)
    var c = s.canvas, ctx = s.ctx, W = v.videoWidth, H = v.videoHeight, sc = 640 / Math.max(W, H);
    c.width = Math.max(8, Math.round(W * sc)); c.height = Math.max(8, Math.round(H * sc));
    ctx.drawImage(v, 0, 0, c.width, c.height);
    // 2) 48px luminance map → mean brightness, motion vs previous frame, and distance from the frame we last SHOT
    var m = s.mini, mx = s.minictx; m.width = 48; m.height = Math.max(8, Math.round(48 * c.height / c.width));
    mx.drawImage(c, 0, 0, m.width, m.height);
    var d = mx.getImageData(0, 0, m.width, m.height).data, n = m.width * m.height, lum = new Float32Array(n), sum = 0;
    for (var i = 0, p = 0; p < n; i += 4, p++){ lum[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; sum += lum[p]; }
    var mean = sum / n, motion = 999, hasPrev = !!(s.prevLum && s.prevLum.length === n);
    if (hasPrev){ var md = 0; for (var q = 0; q < n; q++) md += Math.abs(lum[q] - s.prevLum[q]); motion = md / n; }
    s.prevLum = lum;
    // distance from the captured frame accumulates over a slow paper swap and returns to ~0 after a bump-and-settle (review F4)
    var fromShot = 0;
    if (s.capturedLum){
      if (s.capturedLum.length === n){ var cd = 0; for (var q2 = 0; q2 < n; q2++) cd += Math.abs(lum[q2] - s.capturedLum[q2]); fromShot = cd / n; }
      else fromShot = 999;   // stream resized (rotation) after the shot — cannot compare, treat as changed (review N3)
    }
    // 3) after a shot: cool down, then insist the scene really changed (next invoice) before re-arming
    if (s.cooldownUntil > now){ s.stable = 0; if (s.cooldownMsg) _acStatus(s.cooldownMsg, 0, 'ok'); return; }   // after a FAILED shot the "Not clear" text stays (review N1)
    if (s.pendingEntry){ s.stable = 0; return; }   // "Upload anyway" is waiting for the driver — no auto re-shoot, manual shutter still works (review N2)
    if (!s.changedSinceCapture){
      if (fromShot > AC_CHANGE_MIN){ s.changedSinceCapture = true; s.capturedLum = null; }
      else { s.stable = 0; _acPulse(now - s.lastShotAt > AC_MANUAL_HINT_MS); _acStatus(L('Put the NEXT invoice in the frame', 'Letak invois SETERUSNYA dalam bingkai'), 0, 'warn'); return; }
    }
    // 4) the very same three checks as the upload gate
    var qr = checkPhotoQuality_(c, ctx), r = qr.reasons || [], msg = null;
    if (r.indexOf('exposure') >= 0) msg = mean < 40 ? L('Too dark, more light please', 'Terlalu gelap, perlu cahaya') : L('Too bright or glare', 'Terlalu terang atau silau');
    else if (r.indexOf('cut') >= 0) msg = L('Fit the whole invoice in the frame', 'Masukkan seluruh invois dalam bingkai');
    else if (r.indexOf('blur') >= 0) msg = mean < 90 ? L('Put the invoice in the frame', 'Letak invois dalam bingkai') : L('Move closer and hold steady', 'Dekat sikit dan pegang stabil');
    else if (motion > AC_MOTION_MAX) msg = L('Hold still…', 'Pegang stabil…');
    if (msg){
      s.stable = 0;
      _acPulse(now - Math.max(s.openedAt, s.lastShotAt) > AC_MANUAL_HINT_MS);
      _acStatus(msg, 0, r.length ? 'warn' : null);
      return;
    }
    s.stable++;
    _acPulse(false);
    if (s.stable === 1) _acGhost(0, true);
    _acStatus(L('Hold…', 'Tahan…'), s.stable / AC_STABLE_FRAMES, 'ok');
    if (s.stable >= AC_STABLE_FRAMES){ s.stable = 0; _acCapture(s, false); }
  }catch(e){
    console.warn('AutoCap tick failed:', e);   // fail-open: the manual shutter and the OS-camera link still work
  }
}

async function _acCapture(s, manual){
  if (!_acLive(s) || s.busy) return;
  s.busy = true;
  s.pendingEntry = null; _acShowAnyway(false);   // a new attempt always supersedes a stale "Upload anyway" candidate (review F3)
  try{
    var v = s.video;
    if (!(v.videoWidth > 0)) throw new Error('no frame');
    var fc = document.createElement('canvas'); fc.width = v.videoWidth; fc.height = v.videoHeight;
    fc.getContext('2d').drawImage(v, 0, 0);
    var shotLum = s.prevLum;   // the analysed frame closest to this shot — the "did the scene change" reference
    var blob = await new Promise(function(res){ fc.toBlob(res, 'image/jpeg', 0.92); });
    fc.width = 0; fc.height = 0; fc = null;   // [Scanner] a 4K frame is ~33 MB on a 2 GB phone
    if (!blob) throw new Error('toBlob failed');
    var entry;
    try{ entry = await compressImage(blob); }catch(e){ entry = await readFileAsDataUrl(blob); }
    if (!_acLive(s)) return;   // overlay closed / re-opened while compressing — drop, never land on another stop (review F2)
    if (s.mode === 'evidence'){
      // proof / pallet photo: no quality gate, no scan — any clear shot of the shop or the pallets will do
      var cb = s.onPhoto;
      try{ if (navigator.vibrate) navigator.vibrate(60); }catch(e){}
      closeAutoCapture();
      if (cb) cb(entry);
      return;
    }
    if (entry.quality && !entry.quality.ok){
      // Auto mode can get here too (full-res vs 640px resample near a threshold) — count it, say why, and
      // offer "Upload anyway" at 3 either way, instead of silently re-shooting every second (review F5).
      var TXT = { cut: L('cut off', 'terpotong'), blur: L('blurry', 'kabur'), exposure: L('too bright or dark', 'terlalu terang atau gelap') };
      var why = entry.quality.reasons.map(function(x){ return TXT[x] || x; }).join(', ');
      s.fails++;
      if (s.fails >= 3){ s.pendingEntry = entry; _acShowAnyway(true); _acStatus(L('Not clear: ' + why + '. Retake, or tap Upload anyway.', 'Tidak jelas: ' + why + '. Ambil semula, atau tekan Hantar juga.'), 0, 'warn'); }
      else if (manual || s.fails >= 2) _acStatus(L('Not clear: ' + why + '. Retake.', 'Tidak jelas: ' + why + '. Ambil semula.'), 0, 'warn');
      s.cooldownMsg = null; s.cooldownUntil = Date.now() + 800;   // brief pause so the loop does not re-fire on the very next frame
      return;
    }
    // [Scanner] show the scan copy; Retake keeps the camera on the SAME invoice
    try{
      var _rev = await scanAndReview_(blob, entry);
      if (!_acLive(s)){   // camera closed during the review (screen lock, call): keep a photo the driver chose to Use
        if (_rev){ try{ _rev._bcLate = true;   // [R3] no questions now: in as "?", a barcode read in the background still files it
          var _kept = _addPhotoToGroup(s.gKey, _rev, null); if (_kept.added){ renderShipmentList(); _palletToast('ok', L('Photo kept', 'Foto disimpan'), 'top'); } }catch(e){} }
        return; }
      if (!_rev){ s.cooldownMsg = null; s.cooldownUntil = Date.now() + 900; s.stable = 0;
        _acStatus(L('Retake the same invoice', 'Ambil semula invois yang sama'), 0, 'warn'); return; }
      entry = _rev;
    }catch(scanErr){ console.warn('scan review failed open:', scanErr); }
    // [R3] the barcode says which invoice this is (may ask: "already has a photo" / "not for this shop")
    var _pl = await _bcPlace_(s.gKey, entry, s);
    if (!_acLive(s)){   // camera closed while a question was open: keep what the driver chose to keep
      if (_pl === 'add' || _pl === 'replace'){ try{ var _k2 = _addPhotoToGroup(s.gKey, entry, null); if (_k2.added){ renderShipmentList(); _palletToast('ok', L('Photo kept', 'Foto disimpan'), 'top'); } }catch(e){} }
      return; }
    if (_pl === 'retake' || _pl === 'discard'){
      s.capturedLum = shotLum; s.changedSinceCapture = false; s.lastShotAt = Date.now(); s.stable = 0;   // no auto shot of the same paper again
      s.cooldownMsg = null; s.cooldownUntil = Date.now() + 900;
      _acHeader(s);
      _acStatus(_pl === 'retake' ? L('Take the invoice for this shop', 'Ambil invois kedai ini') : L('New photo discarded', 'Foto baru dibuang'), 0, 'warn');
      return; }
    s.capturedLum = shotLum;
    try{ entry.name = 'autocap_' + Date.now() + ((entry.name || '').match(/_scan[CF]/) || [''])[0] + '.jpg'; }catch(e){}   // office can tell auto shots apart; keeps compressImage's _scanC/_scanF marker
    _acAccept(s, entry);
  }catch(e){
    console.warn('AutoCap capture failed:', e);
    if (_acLive(s)) _acStatus(L('Could not take the photo, try again', 'Gagal ambil foto, cuba lagi'), 0, 'warn');
  }finally{ s.busy = false; }
}

function _acAccept(s, entry){
  if (!_acLive(s)) return;
  var g = _acGroupOf(s);
  var res = _addPhotoToGroup(s.gKey, entry, g);
  if (!res.added){ closeAutoCapture(); renderShipmentList(); return; }
  s.fails = 0; s.captures++; s.pendingEntry = null; _acShowAnyway(false); _acPulse(false); _qGateTries = 0;
  try{ var f = _acEl('acFlash'); if (f){ f.style.opacity = '.55'; setTimeout(function(){ f.style.opacity = '0'; }, 160); } }catch(e){}
  try{ if (navigator.vibrate) navigator.vibrate(60); }catch(e){}
  try{
    if (s.audio){ var o = s.audio.createOscillator(), gn = s.audio.createGain();
      o.frequency.value = 1200; gn.gain.value = 0.08; o.connect(gn); gn.connect(s.audio.destination); o.start(); o.stop(s.audio.currentTime + 0.07); }
  }catch(e){}
  g = res.group;
  var need = _acPending(g).length, have = (g.photos || []).length;
  if (have >= need){
    closeAutoCapture();
    renderShipmentList();
    _palletToast('ok', L('<b>All photos taken &#10003;</b> Tap <b>Save</b>.', '<b>Semua foto siap &#10003;</b> Tekan <b>Simpan</b>.'), 'top');   // top: never covers the Save button (D5)
    try{ var card = document.querySelector('.ship-save[data-i="' + _shipGroups.indexOf(g) + '"]'); if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }catch(e){}
    return;
  }
  s.cooldownMsg = '&#10003; ' + L('Next invoice', 'Invois seterusnya');
  s.cooldownUntil = Date.now() + AC_COOLDOWN_MS;
  s.lastShotAt = Date.now();
  s.changedSinceCapture = false; s.stable = 0;
  _acHeader(s);
}

function _acFallback(s, reason, userGesture){
  console.warn('AutoCap fallback:', reason);
  if (s) s.fellBack = true;   // closeAutoCapture must not count this close a second time
  closeAutoCapture(true);
  // Only DEFINITIVE reasons switch this session to the phone camera for good (permission denied, no camera).
  // Camera busy / slow start / stream died are retried on the next tap; two soft failures in a row also switch (audit M3).
  // [Round1 2026-10-23] there is no "Use phone camera" button any more — the phone camera is only this emergency path.
  if (/NotAllowed|NotFound|Security|OverconstrainedError/i.test(String(reason || ''))){ _acOff = true; }
  else { _acFails++; if (_acFails >= 2) _acOff = true; }
  // These failures arrive outside a tap; browsers refuse a programmatic file-input click there, so do NOT leave
  // _deliverIdx armed (it would silence the visibilitychange re-sync all day — review F1).
  _deliverIdx = -1;
  renderShipmentList();   // photos captured before the camera died must show on the card (review S1)
  _palletToast('warn', _acOff
    ? L('The camera cannot open here. Tap the camera button again to use the phone camera.', 'Kamera tidak dapat dibuka di sini. Tekan butang kamera sekali lagi untuk guna kamera telefon.')
    : L('Camera stopped. Tap the camera button to try again.', 'Kamera terhenti. Tekan butang kamera untuk cuba lagi.'), 'top');
}

function closeAutoCapture(keepDeliverIdx){
  var s = _ac;
  if (!s) return;
  s.closed = true;
  try{ document.documentElement.style.overflow = ''; document.body.style.overflow = ''; }catch(e){}
  // closed with × while the camera never got going (D2): count it, so a phone whose camera never
  // delivers frames ends up on the OS camera after the second try instead of stalling every stop
  if (!s.fellBack){
    if (!s.ready && Date.now() - s.openedAt > 2500){ _acFails++; if (_acFails >= 2) _acOff = true; }
    else if (s.ready) _acFails = 0;
  }
  try{ if (s.raf) cancelAnimationFrame(s.raf); }catch(e){}
  try{ if (s.torchOn) _acTorch(s, false); }catch(e){}
  try{ if (s.stream) s.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  try{ s.video.srcObject = null; }catch(e){}
  try{ if (s.audio && s.audio.close) s.audio.close(); }catch(e){}
  var ov = _acEl('acOverlay'); if (ov) ov.style.display = 'none';
  _ac = null;
  if (!keepDeliverIdx) _deliverIdx = -1;
}
// The camera must never keep running behind a backgrounded tab (battery, privacy) or across navigation.
document.addEventListener('visibilitychange', function(){ if (document.hidden && _ac){ _ac.fellBack = true; closeAutoCapture(); renderShipmentList(); } });   // fellBack: a call/app-switch is not a camera failure (review N1)
window.addEventListener('pagehide', function(){ if (_ac){ _ac.fellBack = true; closeAutoCapture(); } });

// [Scanner TEST] what Save would upload: scan copies + backup originals, sizes and scan facts
function _scanTestSummary_(g, photos, originals, invoiceNos, bp){
  var kb = function(b64){ return Math.round((b64 || '').length * 0.75 / 1024); };
  var sTot = photos.reduce(function(a, p){ return a + kb(p.base64); }, 0), oTot = originals.reduce(function(a, p){ return a + kb(p.base64); }, 0);
  // [R3] rows in the order Save sends them (list order of each photo's invoice) + how the invoice was decided
  var order = (bp && bp.order) || g.photos;
  try{ window._scanTestLast = { invoiceNos: invoiceNos.slice(), names: photos.map(function(p){ return p.name; }), origNames: originals.map(function(o){ return o.name; }),
    origIndex: originals.map(function(o){ return o.forIndex; }), how: order.map(function(p){ return p.bcHow + (p.forced ? '+forced' : ''); }),
    barcodeMap: bp ? bp.barcodeMap : {}, forcedMismatch: !!(bp && bp.forcedMismatch), dataUrls: order.map(function(p){ return p.dataUrl; }) }; }catch(e){}
  var rows = order.map(function(p, k){
    var sc = p.scan || {}, st = sc.ok ? (sc.cropped ? (sc.adjusted ? L('scanned (corners adjusted)', 'diimbas (sudut dilaras)') : L('scanned', 'diimbas')) : L('whitened, edges not found', 'diputihkan, tepi tidak dikesan')) : L('plain photo', 'foto biasa') + (sc.err ? ' — ' + _esc(sc.err) : '');
    var how = p.forced ? L('kept although its barcode is another invoice', 'disimpan walaupun kod bar invois lain')
            : p.bcHow === 'barcode' ? '&#10003; ' + L('barcode read', 'kod bar dibaca')
            : p.bcHow === 'picked' ? L('chosen by the driver', 'dipilih pemandu') : '? ' + L('barcode not read, list order', 'kod bar tidak dibaca, ikut senarai');
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #E2E8F0;">'
      + '<img src="' + p.dataUrl + '" style="width:84px;border:1px solid #CBD5E1;border-radius:4px;background:#fff;">'
      + (p.origDataUrl ? '<img src="' + p.origDataUrl + '" style="width:58px;border:1px solid #CBD5E1;border-radius:4px;opacity:.85;">' : '')
      + '<div style="font-size:12px;line-height:1.45;color:#0F172A;"><b>' + _esc(invoiceNos[k] || ('#' + (k + 1))) + '</b> &middot; ' + how
      + '<br><span style="color:#475569;word-break:break-all;">' + _esc(photos[k] ? photos[k].name : '') + '</span><br>' + st
      + '<br>' + L('scan ', 'imbasan ') + kb(photos[k].base64) + ' KB' + (sc.out ? ' · ' + sc.out[0] + '×' + sc.out[1] : '')
      + (p.origDataUrl ? '<br>' + L('original ', 'asal ') + kb(p.origDataUrl.split(',')[1]) + ' KB' : '') + (sc.ms ? '<br>' + sc.ms + ' ms' : '') + '</div></div>';
  }).join('');
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9900;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:14px;';
  ov.innerHTML = '<div style="background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:16px;">'
    + '<div style="font-size:16px;font-weight:800;color:#B91C1C;">' + L('TEST — nothing was saved', 'UJIAN — tiada apa disimpan') + '</div>'
    + '<div style="font-size:13px;color:#475569;margin:2px 0 10px;">' + L('A real Save would upload:', 'Simpan sebenar akan muat naik:') + '</div>'

    + L('in the Save', 'dalam Simpan') + '</div>'
    // [R3 2026-10-24] the backup originals left the Save: one small upload each, only after the server confirmed it
    + '<div id="stOrig" style="font-size:13px;color:#0F172A;margin-top:2px;"><b>' + originals.length + '</b> ' + L(originals.length === 1 ? 'backup original' : 'backup originals', 'foto asal simpanan') + ' (' + oTot + ' KB) '
    + (ORIGINALS_UPLOAD ? L('sent separately, one by one, after the server confirms the Save', 'dihantar berasingan, satu demi satu, selepas pelayan mengesahkan Simpan')
                        : L('<b>OFF</b> &mdash; not sent (backup upload is switched off)', '<b>MATI</b> &mdash; tidak dihantar (muat naik simpanan dimatikan)')) + '</div>'

    +   '<button type="button" id="stClear" style="flex:1;padding:12px;background:#141C77;color:#fff;border:none;border-radius:10px;font-weight:700;">' + L('Clear &amp; try again', 'Padam &amp; cuba lagi') + '</button>'
