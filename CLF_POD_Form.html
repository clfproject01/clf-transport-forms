    var cur = _shipGroups.filter(function(x){ return x.key === g.key; })[0];   // the re-read after Save rebuilds the groups
    if (g.photos) g.photos.length = 0; g.photos = []; if (cur) cur.photos = []; ov.remove(); renderShipmentList(); };
}

// ══════════════════════════════════════════════════════════════════════════════════════
// [R3 2026-10-24] Save and Problem tell the truth: a stop turns "Dihantar" ONLY after the server confirmed it.
// Before this the form posted blind (no-cors), waited 12 s for a read-back and, without one, painted the whole
// stop delivered (untagged invoices too) and sent its pallets — on 2026-08-20 a 36-invoice stop showed green
// while the server had 2. Now:
//  * the POST's own answer is read. Apps Script answers a POST with a 302 to script.googleusercontent.com, which
//    allows any origin, so a plain CORS fetch reads the JSON as long as the request stays "simple" (FormData body,
//    no custom headers). That answer comes only after the server has finished, so the wait grows with the photos.
//  * answer lost on the way back (signal dropped after the upload) → ask the result cache that doPost fills
//    under clientToken (10 minutes), with growing gaps.
//  * still nothing → nothing is marked, nothing is sent after it, the photos stay, and the card says
//    "Belum disahkan" with a Semak button. The delivery list from the server is the final truth.
// Backup originals no longer ride in the Save: one small POST each, AFTER a confirmed Save (ORIGINALS_UPLOAD).
// ══════════════════════════════════════════════════════════════════════════════════════
var ORIGINALS_UPLOAD = false;   // backup originals as separate background uploads — OFF until the boss pastes backend v12 (POD_ORIGINAL)
var SAVE_POLL_MS = 90000;       // after a lost answer: keep asking the result cache this long
var SAVE_POLL_GAPS = [1500, 2500, 4000, 6000, 8000, 10000, 12000, 15000];   // gaps between those asks (the last one repeats)
var SEMAK_POLL_MS = 6000;       // Semak asks the cache once more, briefly, before it reads the delivery list
var _shipUnconf = {};           // g.key → the Save the server has not confirmed yet {token, invs, ship, key, name, meta, photos, pallet, checked}
var _r3Sent = {};               // clientToken → pallets / backup originals already sent (answer + list may both confirm one Save)
var _r3OrigWarned = false;      // at most one toast for a backup original that did not upload
function _saveTimeoutMs_(nPhotos){ return Math.min(240000, 90000 + 3000 * (nPhotos || 0)); }   // the server answers after the LAST photo is in Drive
// the saving screen counts the seconds (a 40-invoice stop can take minutes): nobody should think it froze and close
// the page. _ovClock_(label) starts, (label, true) keeps counting under a new label, (null) stops.
var _ovClockIv = 0, _ovClockT0 = 0, _ovClockLbl = '';
function _ovClock_(label, keepT0){
  if (_ovClockIv){ clearInterval(_ovClockIv); _ovClockIv = 0; }
  if (!label){ _ovClockT0 = 0; return; }
  if (!keepT0 || !_ovClockT0) _ovClockT0 = Date.now();
  _ovClockLbl = label;
  var tick = function(){
    var el = document.querySelector('.loading-text'), s = Math.round((Date.now() - _ovClockT0) / 1000);
    if (el) el.textContent = _ovClockLbl + (s >= 3 ? ' ' + s + 's' : '') + (s >= 20 ? ' · ' + L('keep this page open', 'biar halaman ini terbuka') : '');
  };
  tick(); _ovClockIv = setInterval(tick, 1000);
}
function _uncOf_(key){ var u = _shipUnconf[key]; return (u && u.ship === _shipKey) ? u : null; }   // per stop AND per list: another lorry's list may hold the same shop
function _sameInvs_(a, b){
  if (!a || !b || a.length !== b.length) return false;
  var s = {}; a.forEach(function(n){ s[String(n)] = true; });
  return b.every(function(n){ return s[String(n)]; });
}

// POST that READS the answer. Returns the server's JSON ({status:'success'|'error', …}) or null = UNKNOWN —
// aborted, connection lost, an HTML error page, anything without a clear status. Null is never a success.
async function _postRead_(payload, timeoutMs){
  var fd = new FormData(); fd.append('data', JSON.stringify(payload));
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var tmo = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs) : null;
  try{
    var res = await fetch(SCRIPT_URL, { method: 'POST', body: fd, signal: ctrl ? ctrl.signal : undefined });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();   // an HTML error page (time-out, quota) lands here as SyntaxError
    if (d && d.status === 'error' && d.code === 'IN_PROGRESS') return null;   // the same Save is still running on the server: not an answer yet
    if (d && (d.status === 'success' || d.status === 'error')) return d;
    throw new Error('answer without a status');
  }catch(e){
    console.warn('[R3] ' + payload.formType + ': answer not read —', e && e.name, e && e.message);
    _dbgToast_(payload.formType + ' answer: ' + (e && e.name) + ' - ' + (e && e.message));   // visible with ?debug=1
    return null;
  }finally{ if (tmo) clearTimeout(tmo); }
}

// Ask doPost's result cache (getImportResult, 10 minutes per clientToken) with growing gaps, for up to maxMs.
// 'pending' = not written (yet). Returns the answer or null; stops at once while the phone says it is offline.
async function _pollResult_(token, maxMs, gaps){
  gaps = gaps || SAVE_POLL_GAPS;
  var t0 = Date.now();
  for (var k = 0; ; k++){
    var left = maxMs - (Date.now() - t0);
    if (left <= 0) return null;
    var wait = Math.min(gaps[Math.min(k, gaps.length - 1)], left);
    if (wait > 0) await new Promise(function(r){ setTimeout(r, wait); });
    if (navigator.onLine === false) return null;   // no signal: asking only drains the battery — Semak later
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var tmo = ctrl ? setTimeout(function(){ ctrl.abort(); }, 15000) : null;
    try{
      var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token), { signal: ctrl ? ctrl.signal : undefined });
      var rd = await rb.json();
      if (rd && (rd.status === 'success' || (rd.status === 'error' && rd.code !== 'IN_PROGRESS'))) return rd;   // IN_PROGRESS: keep asking
    }catch(e){ /* keep asking */ }
    finally{ if (tmo) clearTimeout(tmo); }
  }
}

// Which of the tagged invoices the server answer confirms. It names `already`, `notFound` and (backend v2)
// `photoFailed`, but only COUNTS the ones it wrote now (`delivered`): the rest count only when that number covers
// all of them (delivered = 0 → none).
function _confirmedInvs_(tagged, res){
  var nf = {}, al = {}, pf = {};
  (Array.isArray(res.notFound) ? res.notFound : []).forEach(function(n){ nf[String(n)] = true; });
  (Array.isArray(res.already) ? res.already : []).forEach(function(n){ al[String(n)] = true; });
  (Array.isArray(res.photoFailed) ? res.photoFailed : []).forEach(function(n){ pf[String(n)] = true; });   // [R3] its photo did not reach Drive: not delivered
  var rest = tagged.filter(function(n){ return !nf[String(n)] && !al[String(n)] && !pf[String(n)]; });
  var restOk = (Number(res.delivered) || 0) >= rest.length;
  var out = { done: [], missing: [], notFound: [], photoFailed: [] };
  tagged.forEach(function(n){
    var s = String(n);
    if (al[s] || (!nf[s] && !pf[s] && restOk)) out.done.push(n);
    else { out.missing.push(n); if (nf[s]) out.notFound.push(n); else if (pf[s]) out.photoFailed.push(n); }
  });
  return out;
}

// The ONLY place a Save changes a stop. ctx = what was sent {token, invs (tagged invoice numbers), ship, key, name,
// meta, photos, pallet}; res = the server's answer or null.
//   ok      — every tagged invoice in delivered ∪ already → Dihantar, photos cleared, pallets + originals sent (only here)
//   partial — success, but not for every invoice → only the confirmed ones turn Dihantar, photos kept, the rest named
//   error   — the server said no → nothing changes, photos kept
//   unknown — no answer at all → nothing changes, photos kept, "Belum disahkan" + Semak on the card
function _saveOutcome_(key, res, ctx){
  var g = _groupByKey(key);
  if (!res){
    ctx.checked = false;
    _shipUnconf[key] = ctx;
    if (!_shipStale) _unconfReconcile_();   // a re-sync DURING the upload may already list it all delivered (only the answer got lost)
    renderShipmentList();
    if (_shipUnconf[key] !== ctx) return 'ok';
    alert(L('Save not confirmed yet. Your photos are kept. Tap Check.', 'Simpanan belum disahkan. Foto masih ada. Tekan Semak.'));
    return 'unknown';
  }
  delete _shipUnconf[key];   // the server answered for this stop: that answer replaces any earlier "not confirmed"
  if (res.status !== 'success'){
    renderShipmentList();
    // REAL failure — keep the photos so the driver can just hit Save again.
    alert(L('NOT saved!\n' + (res.message || 'Server error') + '\n\nYour photos are kept. Please tap Save again.',
            'TIDAK disimpan!\n' + (res.message || 'Ralat pelayan') + '\n\nFoto anda masih ada. Sila tekan Simpan semula.'));
    return 'error';
  }
  var c = _confirmedInvs_(ctx.invs, res), done = {};
  c.done.forEach(function(n){ done[String(n)] = true; });
  if (g) g.invs.forEach(function(x){ if (done[String(x.invoiceNo)]) x.status = 'delivered'; });
  if (!c.missing.length){
    if (g){ g.invs.forEach(function(x){ x._untag = false; }); g.photos = []; }   // [untag] untagged ones stay pending (tags reset, as before)
    _r3AfterConfirmed_(key, g, ctx);
    renderShipmentList();
    _palletToast('ok', '&#10003; ' + L('Saved: ' + c.done.length + (c.done.length === 1 ? ' invoice delivered' : ' invoices delivered'), 'Disimpan: ' + c.done.length + ' invois dihantar'));
    return 'ok';
  }
  // [R3] the confirmed invoices are done: their photos leave the card (each photo knows its invoice — barcode / the
  // driver's choice / list order), so what stays is exactly what still has to go, and Save can be tapped again
  if (g && g.photos) g.photos = g.photos.filter(function(p){ return !done[String(p.invoiceNo)]; });
  renderShipmentList();
  var lost = c.missing.filter(function(n){ return c.notFound.indexOf(n) < 0 && c.photoFailed.indexOf(n) < 0; });
  alert(L('Saved only ' + c.done.length + ' of ' + ctx.invs.length + ' invoices.', 'Hanya ' + c.done.length + ' daripada ' + ctx.invs.length + ' invois disimpan.')
    + (lost.length ? '\n' + L('NOT confirmed: ', 'BELUM disahkan: ') + lost.join(', ') : '')
    + (c.photoFailed.length ? '\n' + L('Photo did not reach the server: ' + c.photoFailed.join(', ') + ' (tap Save again)', 'Foto tidak sampai ke pelayan: ' + c.photoFailed.join(', ') + ' (tekan Simpan semula)') : '')
    + (c.notFound.length ? '\n' + L('Not found on the server (tell the office): ', 'Tiada di pelayan (beritahu pejabat): ') + c.notFound.join(', ') : '')
    + '\n\n' + L('Your photos are kept.', 'Foto anda masih ada.'));
  return 'partial';
}

// pallets and backup originals go only after a CONFIRMED Save, and only once per clientToken
function _r3AfterConfirmed_(key, g, ctx){
  if (_r3Sent[ctx.token]) return;
  _r3Sent[ctx.token] = true;
  // a re-sync that saw the stop delivered has already dropped its pallet entry from the stop: use the one sent
  var pg = (g && g._pallet) ? g : (ctx.pallet ? { key: key, name: ctx.name, _pallet: ctx.pallet } : null);
  if (pg && !_smMode){ firePalletDrop(pg); firePalletCollect(pg); }   // [Salesman] private cars carry no pallets
  _sendOriginals_(ctx);
}

// A fresh SERVER list settles a Save whose answer was lost: once it lists EVERY invoice of that Save as delivered,
// the Save counts as confirmed (pallets + originals go, once). Partly delivered = the server may still be
// writing: keep waiting — the chips already show what it has.
function _unconfReconcile_(){
  Object.keys(_shipUnconf).forEach(function(k){
    var u = _uncOf_(k), g = u ? _groupByKey(k) : null;
    if (!g) return;
    var st = {};
    g.invs.forEach(function(x){ st[String(x.invoiceNo)] = String(x.status).toLowerCase(); });
    if (!u.invs.every(function(n){ return st[String(n)] === 'delivered'; })) return;
    delete _shipUnconf[k];
    g.photos = [];
    _r3AfterConfirmed_(k, g, u);
    _palletToast('ok', '&#10003; ' + L('Confirmed: ', 'Disahkan: ') + _esc(g.name) + ' &mdash; ' + L('delivered', 'dihantar'));
  });
}

// Semak / Check: ask the result cache once more, then read the delivery list (it settles the stop when it shows
// every invoice delivered). Still nothing → the card offers Save again (the server skips what it already has).
async function checkUnconfirmed(i){
  var g0 = _shipGroups[i], key = g0 && g0.key, u = key ? _uncOf_(key) : null;
  if (!u){ renderShipmentList(); return; }
  if (u.busy) return;
  u.busy = true;
  var overlay = document.getElementById('loadingOverlay');
  document.querySelector('.loading-text').textContent = L('Checking…', 'Menyemak…');
  overlay.classList.add('show');
  try{
    var res = await _pollResult_(u.token, SEMAK_POLL_MS, [0, 2000]);
    if (_shipUnconf[key] !== u) return;                    // settled meanwhile (a re-sync saw it delivered)
    if (res){ overlay.classList.remove('show'); _saveOutcome_(key, res, u); return; }
    if (_smMode) await smLoadDeliveries(true); else await checkShipmentForVehicle(true);   // → _unconfReconcile_
    if (_shipUnconf[key] === u){
      u.checked = true;
      renderShipGroups();
      _palletToast('warn', L('Still not confirmed. When you have signal, tap Save again.', 'Masih belum disahkan. Bila ada liputan, tekan Simpan semula.'), 'top');
    }
  }finally{
    u.busy = false;
    overlay.classList.remove('show');
  }
}

// Which invoice a backup original belongs to — only when CERTAIN: the photo carries its own invoice number (a
// barcode match), or the stop had one invoice. Never by position: photo k is not invoice k (that pairing is what
// mislabelled the July scans). '' = unknown; the backend then files it under the stop and the photo number.
function _origInvoiceOf_(p, invs){
  if (p && p.invoiceNo && (p.bcHow === 'barcode' || p.bcHow === 'picked')) return String(p.invoiceNo);   // a "?" (list-order guess) is not certain
  return (invs && invs.length === 1) ? String(invs[0]) : '';
}
// Backup originals: one small POST each (formType POD_ORIGINAL), one after the other, in the background. Never
// touches the delivered state; a failure is logged and shown at most once as a small toast.
function _sendOriginals_(ctx){
  if (!ORIGINALS_UPLOAD || SCAN_TEST || !ctx || !ctx.photos) return;
  var list = [];
  ctx.photos.forEach(function(p, k){ if (p && p.origDataUrl) list.push({ p: p, k: k }); });
  if (!list.length) return;
  var m = ctx.meta || {}, n = ctx.photos.length;
  (async function(){
    for (var j = 0; j < list.length; j++){
      var p = list[j].p, k = list[j].k;
      var r = await _postRead_({ formType: 'POD_ORIGINAL', shipmentKey: m.shipmentKey, invoiceNo: _origInvoiceOf_(p, ctx.invs), branch: BRANCH,
        deliveryDate: m.deliveryDate, vehicleNo: m.vehicleNo, driverName: m.driverName, custCode: ctx.key, photoIndex: k + 1, photoCount: n,
        photo: { base64: String(p.origDataUrl).split(',')[1], name: String(p.name || 'invoice.jpg').replace(/(_scan[CF])?\.jpg$/i, '') + '_orig.jpg', type: 'image/jpeg' },
        clientToken: 'org_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10) }, 60000);
      if (!r || r.status !== 'success'){
        console.warn('[R3] backup original ' + (k + 1) + '/' + n + ' not stored:', r && r.message);
        if (!_r3OrigWarned){ _r3OrigWarned = true;
          _palletToast('warn', L('A backup photo did not upload. The delivery IS saved.', 'Satu foto simpanan tidak dimuat naik. Penghantaran SUDAH disimpan.')); }
      }
    }
  })().catch(function(e){ console.warn('[R3] backup originals stopped', e); });
}

// STEP 2: Save → submit the buffered photos → mark this customer's invoices delivered
async function saveDelivery(i){
  var g = _shipGroups[i];
  if (!g) return;
  // Double-tap guard: a 2nd tap before the overlay paints used to re-enter and double-submit
  // (duplicate POD rows + double KPI credit) — same fix as the fuel form's submit button.
  if (g._saving) return;
  g._saving = true;
  if (!g.photos || !g.photos.length){ g._saving = false; alert(L('Take a photo first', 'Sila ambil foto dulu')); return; }
  var _tagged = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered' && !x._untag; }).map(function(x){ return x.invoiceNo; });
  if (!_tagged.length){ g._saving=false; alert(L('Select at least one invoice to deliver', 'Pilih sekurang-kurangnya satu invois')); return; }
  if (g.photos.length !== _tagged.length){ g._saving=false; alert(L('Photos must equal invoices: ' + g.photos.length + ' photos, ' + _tagged.length + ' invoices', 'Bilangan foto mesti sama dengan invois: ' + g.photos.length + ' foto, ' + _tagged.length + ' invois')); return; }
  var _bp = _bcPayload_(g, SCAN_TEST);   // [R3] photos + invoiceNos in list order of each photo's own invoice (null = an invoice has no photo of its own)
  if (!_bp){ g._saving=false; alert(L('Each invoice needs its own photo. Check the photos marked in red.', 'Setiap invois perlu fotonya sendiri. Semak foto bertanda merah.')); return; }
  var _sk = _stopShipKey_(g, _bp.invoiceNos);   // [R3] the delivery order (DL) these invoices belong to
  if (_sk.mixed){ g._saving=false; alert(L('These invoices are on 2 delivery orders (DL) and must be saved separately:', 'Invois ini dalam 2 DL dan mesti disimpan berasingan:')
      + '\n' + _dlLines_(_sk) + '\n\n' + L('Untick the invoices of one DL, save, then tick them again and save.', 'Buang tanda invois satu DL, simpan, kemudian tanda semula dan simpan.')); return; }
  // [Round2] no driver picked = a POD that counts for nobody (KPI): send the driver to the trip card first
  if (!_smMode && !document.getElementById('driverName').value){
    g._saving = false;
    _tripOpen = true; _tripRender();
    var _ed = document.getElementById('err-driver'); if (_ed) _ed.classList.add('show');
    try{ var _ds = document.getElementById('driverSearch'); _ds.focus(); _ds.scrollIntoView({ block: 'center' }); }catch(e){}
    _palletToast('err', L('Choose the driver first, then tap Save again.', 'Pilih pemandu dulu, kemudian tekan Simpan semula.'), 'top');
    return;
  }
  var overlay = document.getElementById('loadingOverlay');
  document.querySelector('.loading-text').textContent = L('Saving…', 'Menyimpan…');
  overlay.classList.add('show');
  try{
    // [R3] photos in list (g.invs) order of each photo's own invoice, file names "<invoiceNo>_…" (_bcPayload_);
    // the server's positional pairing (row N ↔ photo N) is then right. [Scanner] backup originals, index-aligned
    // with photos[] (forIndex): they no longer ride in the Save (they doubled the upload) — _sendOriginals_ sends
    // them one by one after a CONFIRMED Save; _bcPayload_ builds them only for the TEST summary (a copy of every
    // original is megabytes a cheap phone should not hold for nothing).
    var photos = _bp.photos;
    var originals = _bp.originals;
    if (SCAN_TEST){ overlay.classList.remove('show'); g._saving = false; _scanTestSummary_(g, photos, originals, _bp.invoiceNos, _bp); return; }
    var pendingInvs = _bp.invoiceNos;   // [untag] only the invoices the driver kept tagged (delivered); [R3] same order as photos
    _ovClock_(L('Saving…', 'Menyimpan…'));   // [R3] big stops take minutes: show the seconds, so nobody thinks it froze
    var _drv = document.getElementById('driverName').value;
    var _sd  = document.getElementById('secondDriver').value || '';
    if (_sd === _drv) _sd = '';   // same name twice → drop helper (avoid double KPI count)
    var now = new Date();
    // A3: send a clientToken so the REAL result can be read back. [R3] A Save that was never confirmed goes again
    // under the SAME token (same stop, same invoices): a late answer from either try lands in one place, and the
    // server skips invoices it already has (no second KPI row).
    var _prevU = _uncOf_(g.key);
    var token = (_prevU && _sameInvs_(_prevU.invs, pendingInvs)) ? _prevU.token : 'pod_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    // [R3] shipmentKey = the DL these invoices are on (a lorry with 2 DLs on one day used to send the first DL's key
    // for every stop: the second DL's invoices were "not found" on the server)
    var payload = { formType:'SUBMIT_POD_FOR_INVOICE', branch: BRANCH, shipmentKey:_sk.key, invoiceNos:pendingInvs,
      driverName: _drv, secondDriver: _sd,
      vehicleNo: document.getElementById('vehicleNo').value, deliveryDate: document.getElementById('deliveryDate').value,
      timestamp: now.toISOString(), photos: photos, clientToken: token,
      // [R3] raw barcode per invoice (Shipment_Items col 18) + a photo kept against its barcode (col 19 DRIVER_FORCED)
      barcodeMap: _bp.barcodeMap, forcedMismatch: _bp.forcedMismatch,
      // [R3] photo i IS invoiceNos[i]: backend v2 then files each photo under its own invoice (an older backend ignores this)
      photoOrder: 'invoice',
      // [E5] true if ANY included photo was force-uploaded past the quality gate
      qualityFlag: g.photos.some(function(p){ return !!p.qualityFlag; }) };
    if (_smMode){ payload.salesmanId = _smId; payload.pin = _smPin; payload.gps = _smGps || null; payload.driverName = ''; payload.secondDriver = ''; }   // [Salesman] server resolves identity
    // [R3] what was sent, by stop KEY (a re-sync during a long upload replaces the stop objects)
    var ctx = { token: token, invs: pendingInvs.slice(), ship: _shipKey, key: g.key, name: g.name, photos: g.photos, pallet: g._pallet || null,
      meta: { shipmentKey: payload.shipmentKey, deliveryDate: payload.deliveryDate, vehicleNo: payload.vehicleNo, driverName: payload.driverName } };
    // [R3] read the answer itself (the old 90 s cap aborted big stops that were still uploading); if it is lost,
    // ask the result cache. Nothing below this line may paint a stop delivered without an answer.
    var res = await _postRead_(payload, _saveTimeoutMs_(photos.length));
    if (!res){
      _ovClock_(L('Confirming…', 'Mengesahkan…'), true);
      res = await _pollResult_(token, SAVE_POLL_MS, SAVE_POLL_GAPS);
    }
    _ovClock_(null);
    overlay.classList.remove('show');   // the outcome may open an alert: not under the spinner
    _saveOutcome_(g.key, res, ctx);
  }catch(err){
    _ovClock_(null);
    alert(L('Save failed, please try again.\n(Your photos are kept.)', 'Simpan gagal, sila cuba lagi.\n(Foto anda masih ada.)'));
  }finally{
    g._saving = false;
    _ovClock_(null);
    overlay.classList.remove('show');
    setTimeout(function(){ checkShipmentForVehicle(true); }, 2500);   // read-back: the server's list is the final truth (it also settles "Belum disahkan")
  }
}

// mark all of a customer's pending invoices as not-delivered, with a reason
// A5: check the server's ACTUAL response per invoice — only paint "Problem" when the sheet
// really recorded it (before this, a server error still showed red on the phone = wrong data).
async function failGroup(i, reason){
  var g = _shipGroups[i]; if (!g) return;
  if (SCAN_TEST){ var _pc = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered'; }).length;
    alert(L('TEST — nothing saved.\nWould mark ' + _pc + (_pc === 1 ? ' invoice' : ' invoices') + ' as: ' + _reasonLabel(reason),
            'UJIAN — tiada apa disimpan.\nAkan tandakan ' + _pc + ' invois sebagai: ' + _reasonLabel(reason))); return; }
  if (g._saving) return;            // double-tap guard (same as saveDelivery)
  g._saving = true;
  var pending = g.invs.filter(function(x){ return String(x.status).toLowerCase()!=='delivered'; });
  var _fsk = _stopShipKey_(g, pending.map(function(x){ return x.invoiceNo; }));   // [R3] the DL(s) these invoices are on (not always the list's first DL)
  var answered = false;   // [R3] at least one DL's batch was confirmed
  var overlay = document.getElementById('loadingOverlay');
  document.querySelector('.loading-text').textContent = L('Saving…', 'Menyimpan…');
  overlay.classList.add('show');
  var errMsg = '', unknown = false, notMarked = [];   // [R3] unknown = no answer at all; notMarked = answered, but not for these
  try{
    if (g._failProof || _smMode){
      // [FailProof] one batch POST: all pending invoices + the proof photo (uploaded ONCE).
      // [R3 2026-10-24] the server's own answer is read (as Save does); only when it is lost, the result cache is asked.
      // One batch per delivery order (DL) — almost always one; a shop on 2 DLs of this lorry gets one each.
      var okSet = {};
      for (var dk = 0; dk < _fsk.order.length; dk++){
        var _dl = _fsk.order[dk];
        var token = 'flp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
        var confirmed = await _postRead_({ formType:'MARK_INVOICE_FAILED', shipmentKey:_dl,
          invoiceNos: _fsk.groups[_dl].slice(), reason: reason,
          photo: g._failProof || null, branch: BRANCH,
          salesmanId: (_smMode ? _smId : undefined), pin: (_smMode ? _smPin : undefined), gps: (_smMode ? (_smGps || null) : undefined),
          driverName: document.getElementById('driverName').value || '', clientToken: token }, _saveTimeoutMs_(g._failProof ? 1 : 0));
        if (!confirmed){
          document.querySelector('.loading-text').textContent = L('Confirming…', 'Mengesahkan…');
          confirmed = await _pollResult_(token, SAVE_POLL_MS, SAVE_POLL_GAPS);
        }
        if (confirmed && confirmed.status === 'success'){ answered = true; (confirmed.failed || []).forEach(function(n){ okSet[String(n)] = true; }); }
        else if (confirmed) errMsg = confirmed.message || 'server error';
        else unknown = true;   // no answer: nothing of this DL is marked, the proof photo stays for the next try
      }
      if (answered){
        var cur = _groupByKey(g.key) || g;   // by key: a re-sync during the upload may have rebuilt the stop
        cur.invs.forEach(function(x){ if (String(x.status).toLowerCase() === 'delivered') return;
          if (okSet[String(x.invoiceNo)]) x.status = 'failed'; else if (!unknown && !errMsg) notMarked.push(x.invoiceNo); });
        if (!unknown && !errMsg){ cur._failProof = null; g._failProof = null; }   // consumed
      }
    } else {
      for (var k=0; k<pending.length; k++){
        var res = await fetch(SCRIPT_URL + '?action=MARK_INVOICE_FAILED&shipmentKey=' + encodeURIComponent(pending[k].shipmentKey || _shipKey)
          + '&invoiceNo=' + encodeURIComponent(pending[k].invoiceNo) + '&reason=' + encodeURIComponent(reason));
        var d = null; try{ d = await res.json(); }catch(je){}
        if (d && d.status === 'success'){ pending[k].status = 'failed'; }
        else { errMsg = (d && d.message) ? d.message : 'server error'; }
      }
    }
  }catch(e){ errMsg = 'no connection'; }
  finally{
    g._saving = false;
    overlay.classList.remove('show');
    if (unknown) alert(answered   // [R3] (answered = a shop on 2 DLs where only one DL's batch got its answer)
      ? L('Problem confirmed for some invoices only. Your proof photo is kept. Please try again for the rest.', 'Masalah disahkan untuk sebahagian invois sahaja. Foto bukti masih ada. Sila cuba lagi untuk yang lain.')
      : L('Problem NOT confirmed yet: nothing was marked. Your proof photo is kept. Please try again.',
          'Masalah BELUM disahkan: tiada apa ditanda. Foto bukti masih ada. Sila cuba lagi.'));   // [R3]
    else if (errMsg) alert(L('Some were NOT saved (' + errMsg + '). Please try again.', 'Sebahagian TIDAK disimpan (' + errMsg + '). Sila cuba lagi.'));
    else {
      delete _shipProblem[g.key]; _shipFailReason[g.key] = reason;   // [Round1] stop marked: leave Problem mode; [Round2] its pill shows the reason
      delete _shipUnconf[g.key];   // [R3] the driver's latest word on this stop; the list shows what the server holds
      if (notMarked.length) alert(L('Not marked (already delivered, or not found on the server): ', 'Tidak ditanda (sudah dihantar, atau tiada di pelayan): ') + notMarked.join(', '));
    }
    renderShipmentList();
    setTimeout(function(){ checkShipmentForVehicle(true); }, 2500);   // [R3] read-back, as after Save: the server's list is the final truth
  }
}

// wire vehicle + date selection to the shipment check (wrappers so the change-event isn't passed as keepListOnFail)
document.getElementById('vehicleNo').addEventListener('change', function(){
  try{ localStorage.setItem(VEHICLE_KEY, this.value || ''); }catch(e){}   // B5: remember across reloads
  // Clear any auto-filled crew first, so it can't keep showing the PREVIOUS lorry's drivers.
  // The newly-selected lorry's assigned crew re-fills from its own shipment (or stays blank if none matches).
  ['driverName','secondDriver'].forEach(function(id){ var h=document.getElementById(id); if(h) h.value=''; });
  ['driverSearch','secondSearch'].forEach(function(id){ var s=document.getElementById(id); if(s) s.value=''; });
  ['staffIdBadge','staffIdBadge2'].forEach(function(id){ var b=document.getElementById(id); if(b){ b.style.display='none'; b.textContent=''; } });
  _tripRender();
  checkShipmentForVehicle();
});
document.getElementById('deliveryDate').addEventListener('change', function(){ _tripRender(); checkShipmentForVehicle(); });


/* ============================================================================
   SALESMAN MODE (A+B2)                                          [2026-07-24]
   Office marks a DL "handled by salesman"; the rep opens this same form via the
   DSR "My Deliveries" button (?sm=1&id=TER%20500) or the toggle below, signs in
   with staff ID + personal PIN (Salesmen sheet), and gets ONLY his marked DLs —
   station photos / untag / count-match / FailProof reused unchanged. Submits
   carry salesmanId+pin+gps; the backend writes ZERO POD_Data rows (KPI walls).
   ============================================================================ */
var _smMode = false, _smId = '', _smPin = '', _smName = '', _smGps = null;
var SM_AUTH_KEY = 'clf_sm_auth';

function _smAuthed(){ return !!(_smId && _smPin); }
function _smStore(){ try{ localStorage.setItem(SM_AUTH_KEY, JSON.stringify({ id:_smId, pin:_smPin, name:_smName, ts:Date.now() })); }catch(e){} }
function _smRestore(){
  try{
    var a = JSON.parse(localStorage.getItem(SM_AUTH_KEY) || 'null');
    // [sec 2026-07-24] delivery-day TTL (was 30d): a raw PIN sitting in localStorage on a
    // borrowed/shared phone is a takeover risk — keep the remember-window short.
    if (a && a.id && a.pin && (Date.now() - (a.ts||0)) < 20*36e5){ _smId=a.id; _smPin=a.pin; _smName=a.name||''; return true; }
  }catch(e){}
  return false;
}
function _smSignOut(){ try{ localStorage.removeItem(SM_AUTH_KEY); }catch(e){} _smId=''; _smPin=''; _smName=''; smRenderGate(); }

// generic no-cors POST + clientToken readback (same machinery the pallet/admin tools use)
async function smPost(payload){
  var token = 'sm_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
  payload.clientToken = token;
  var fd = new FormData(); fd.append('data', JSON.stringify(payload));
  try{ await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: fd }); }
  catch(e){ return { status:'error', message: L('No connection', 'Tiada sambungan') }; }
  for (var t=0;t<8;t++){
    await new Promise(function(r){ setTimeout(r,1500); });
    try{
      var rb = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(token));
      var rd = await rb.json();
      if (rd && rd.status && rd.status !== 'pending') return rd;
    }catch(e){}
  }
  return { status:'error', message: L('No confirmation', 'Tiada pengesahan') };
}

function _smRefreshGps(){
  try{
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(p){ _smGps = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }; },
      function(){}, { enableHighAccuracy:true, timeout:5000, maximumAge:120000 });
  }catch(e){}
}

function _smFields(on){
  ['driverSearch','secondSearch','vehicleNo'].forEach(function(id){
    var el = document.getElementById(id);
    var f = el && el.closest ? el.closest('.field') : null;
    if (f) f.style.display = on ? 'none' : '';
  });
  var man = document.getElementById('manualPodSection');
  if (on && man) man.style.display = 'none';
}
function _smBanner(on){
  var b = document.getElementById('smBanner');
  if (!on){ if (b) b.remove(); return; }
  if (!b){
    b = document.createElement('div'); b.id = 'smBanner';
    b.style.cssText = 'background:#6D28D9;color:#fff;border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;';
    var form = document.getElementById('podForm');
    form.parentNode.insertBefore(b, form);
  }
  b.innerHTML = '<span>&#129333; ' + L('SALESMAN MODE', 'MOD JURUJUAL') + (_smName ? ' &middot; ' + _esc(_smName) : '') + (_smId ? ' (' + _esc(_smId) + ')' : '') + '</span>'
    + '<span><button type="button" id="smSignOut" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;">' + L('Sign out', 'Keluar') + '</button></span>';
  var so = document.getElementById('smSignOut'); if (so) so.onclick = _smSignOut;
}

function smEnter(prefillId){
  _smMode = true;
  document.body.classList.add('sm-mode');
  _smFields(true); _smBanner(true); _tripRender();
  var tl = document.getElementById('smToggleLink'); if (tl) tl.textContent = L('Driver mode', 'Mod pemandu');
  if (prefillId) _smId = String(prefillId).toUpperCase();
  if (_smAuthed()){ smLoadDeliveries(); } else { smRenderGate(); }
}
function smExit(){
  _smMode = false;
  document.body.classList.remove('sm-mode');
  _smFields(false); _smBanner(false); _tripRender();
  var tl = document.getElementById('smToggleLink'); if (tl) tl.textContent = L('Salesman →', 'Jurujual →');
  var sec = document.getElementById('shipmentSection');
  if (sec){ sec.style.display = 'none'; sec.innerHTML = ''; }
  _shipKey = ''; _shipGroups = [];
}

function smRenderGate(msg){
  var sec = document.getElementById('shipmentSection');
  if (!sec) return;
  sec.style.display = 'block';
  sec.innerHTML = '<div style="border:1.5px solid #C4B5FD;background:#F5F3FF;border-radius:12px;padding:16px;">'
    + '<div style="font-weight:800;font-size:15px;color:#5B21B6;margin-bottom:10px;">' + L('Salesman sign in', 'Log masuk jurujual') + '</div>'
    + '<label style="font-size:12px;font-weight:700;color:#4C1D95;">' + L('Staff ID', 'ID staf') + '</label>'
    + '<input id="smIdInput" autocomplete="off" placeholder="' + _escA(L('e.g. TER 500', 'cth. TER 500')) + '" value="' + _esc(_smId) + '" style="width:100%;box-sizing:border-box;margin:4px 0 10px;padding:12px;font-size:16px;border:1.5px solid #C4B5FD;border-radius:9px;">'
    + '<label style="font-size:12px;font-weight:700;color:#4C1D95;">PIN</label>'
    + '<input id="smPinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="' + _escA(L('6-digit PIN', 'PIN 6 digit')) + '" style="width:100%;box-sizing:border-box;margin:4px 0 6px;padding:12px;font-size:16px;border:1.5px solid #C4B5FD;border-radius:9px;">'
    + '<div id="smGateErr" style="min-height:16px;font-size:12px;color:#B91C1C;font-weight:600;">' + (msg ? _esc(msg) : '') + '</div>'
    + '<button type="button" id="smLoadBtn" style="width:100%;margin-top:8px;background:#6D28D9;color:#fff;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;">' + L('Load my deliveries', 'Muat penghantaran saya') + '</button>'
    + '</div>';
  var btn = document.getElementById('smLoadBtn');
  btn.onclick = function(){
    var id = document.getElementById('smIdInput').value.trim().toUpperCase();
    var pin = document.getElementById('smPinInput').value.trim();
    if (!id || !pin){ document.getElementById('smGateErr').textContent = L('Enter your Staff ID and PIN', 'Isi ID staf dan PIN'); return; }
    _smId = id; _smPin = pin;
    smLoadDeliveries();
  };
  var pi = document.getElementById('smPinInput');
  pi.addEventListener('keydown', function(e){ if (e.key === 'Enter') btn.onclick(); });
}

async function smLoadDeliveries(quiet){
  var sec = document.getElementById('shipmentSection');
  if (!sec) return;
  var date = document.getElementById('deliveryDate').value || new Date().toISOString().slice(0,10);
  if (!quiet){ sec.style.display='block'; sec.innerHTML = '<div style="padding:14px;text-align:center;color:#5B21B6;">' + L('Loading your deliveries…', 'Memuatkan penghantaran anda…') + '</div>'; }
  var rd = await smPost({ formType:'GET_SALESMAN_SHIPMENTS', salesmanId:_smId, pin:_smPin, date:date });
  if (!rd || rd.status === 'error'){
    _smPin = quiet ? _smPin : '';
    smRenderGate((rd && rd.message) || L('Could not load. Check your connection.', 'Tidak dapat dimuat. Semak talian anda.'));
    return;
  }
  _smName = (rd.salesman && rd.salesman.name) || _smName;
  _smStore(); _smBanner(true); _smRefreshGps();
  if (!rd.found || !rd.shipments || !rd.shipments.length){
    sec.style.display='block';
    sec.innerHTML = '<div style="padding:18px 14px;text-align:center;color:#5B21B6;font-size:14px;line-height:1.6;border:1.5px solid #C4B5FD;background:#F5F3FF;border-radius:10px;">'
      + '<div style="font-size:30px;margin-bottom:6px;">&#128230;</div>'
      + '<b>' + L('No delivery marked to you for ' + _esc(date) + '.', 'Tiada penghantaran ditandakan kepada anda untuk ' + _esc(date) + '.') + '</b>'
      + '<br><br>' + L('Ask the office to mark the DL to you.', 'Minta pejabat tandakan DL kepada anda.')
      + '</div>';
    _shipKey=''; _shipGroups=[];
    return;
  }
  // multiple marked DLs on one day: let the rep pick which one to work on
  window._smShipments = rd.shipments; window._smItems = rd.items || [];
  if (rd.shipments.length > 1 && !quiet){
    sec.style.display='block';
    sec.innerHTML = '<div style="border:1.5px solid #C4B5FD;background:#F5F3FF;border-radius:12px;padding:14px;">'
      + '<div style="font-weight:800;font-size:14px;color:#5B21B6;margin-bottom:8px;">' + L('Pick a delivery order', 'Pilih DL') + '</div>'
      + rd.shipments.map(function(s,i){
          return '<button type="button" class="sm-pick-dl" data-k="' + _esc(s.shipmentKey) + '" style="display:block;width:100%;text-align:left;margin-bottom:6px;background:#fff;border:1.5px solid #C4B5FD;border-radius:9px;padding:11px 12px;font-size:14px;cursor:pointer;"><b>' + _esc(s.shipmentKey) + '</b> &middot; ' + (s.itemCount||'?') + ' ' + L('invoices', 'invois') + '</button>';
        }).join('')
      + '</div>';
    sec.querySelectorAll('.sm-pick-dl').forEach(function(b){
      b.onclick = function(){ _smUseShipment(b.getAttribute('data-k')); };
    });
    return;
  }
  _smUseShipment((window._smShipments[0] || {}).shipmentKey, quiet);
}
function _smUseShipment(key, quiet){
  if (!key) return;
  _shipKey = key;
  var items = (window._smItems || []).filter(function(it){ return it.shipmentKey === key; });
  _buildGroups(items);
  _unconfReconcile_();   // [R3] same rule as the driver list: the server's list settles an unconfirmed Save
  var man = document.getElementById('manualPodSection'); if (man) man.style.display = 'none';
  var sec = document.getElementById('shipmentSection'); if (sec) sec.style.display = 'block';
  renderShipmentList();
}

// boot: toggle link + deep-link (?sm=1&id=TER%20500 — the DSR "My Deliveries" button)
// Salesman mode is reached ONLY via the DSR "My Deliveries" deep link (?sm=1&id=…) — there is
// deliberately NO toggle on the driver-facing form, so drivers never see a salesman control.
(function smBoot(){
  try{
    var q = new URLSearchParams(location.search);
    if (q.get('sm') === '1'){
      _smRestore();
      smEnter(q.get('id') || '');
    }
  }catch(e){ console.warn('smBoot failed', e); }
})();

</script>
