<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Management — moved</title>
<!--
  RETIRED 2026-07-24. Leave management moved into the PIN-locked Staff Admin hub
  (CLF_Staff_Admin.html, Leave tab). The old page wrote leave over an
  unauthenticated GET (anyone with the URL could edit attendance); the hub
  requires an office login and its Leave tab is open to any unlocked operator.
  This stub just forwards old bookmarks.
-->
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F9FAFB;color:#111827;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
  .card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.06);
        max-width:420px;width:100%;padding:32px 26px;text-align:center;}
  .ico{font-size:38px;margin-bottom:8px;}
  h1{font-size:19px;margin:0 0 6px;}
  p{font-size:14px;color:#6B7280;line-height:1.6;margin:0 0 18px;}
  a.go{display:inline-block;background:#1A56DB;color:#fff;text-decoration:none;border-radius:10px;padding:13px 22px;font-weight:700;font-size:15px;}
</style>
</head>
<body>
  <div class="card">
    <div class="ico">&#128197;</div>
    <h1>Leave management has moved</h1>
    <p>It now lives in <b>Staff Admin &rarr; Leave</b> (with a login). Redirecting you now&hellip;</p>
    <a class="go" id="go" href="CLF_Staff_Admin.html#leave">Open Staff Admin &middot; Leave</a>
  </div>
<script>
  (function(){
    var url = 'CLF_Staff_Admin.html#leave';
    var q = location.search || '';
    if (q) url += q;   // carry ?branch=… through
    document.getElementById('go').href = url;
    setTimeout(function(){ location.replace(url); }, 1500);
  })();
</script>
</body>
</html>
