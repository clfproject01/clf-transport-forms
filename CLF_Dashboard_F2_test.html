<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C77">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex">
<title>CLF Fleet (TEST)</title>
<style>
  /* F2 design draft v3.1 (2026-10-24): two review rounds, then the boss's D6-D13 decisions (fuel report per lorry, month table kept). Same tokens as the POD form
     (Round 2, boss-approved): navy header, white cards, 12px radius, system fonts 13/15/17/22 + one 32px number.
     Colour = status only, always next to a word. Everything below runs on FAKE data generated in this file. */
  :root{
    --navy:#141C77; --navy-2:#0E1458; --navy-50:#EEF0FA;
    --red-700:#C8101E; --red-50:#FEF2F2; --red-line:#F5C2C7;
    --green:#15803D; --green-50:#ECFDF3; --green-line:#A7D7B8;
    --lime:#87C329;
    --amber:#B45309; --amber-50:#FFFBEB; --amber-line:#F3D19C;
    --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8;
    --line:#E2E8F0; --bg:#FFFFFF; --bg-2:#F4F6FA;
    --r:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  html,body{background:var(--bg-2)}
  body{font:15px/1.45 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left}
  [hidden]{display:none!important}
  svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  svg.i.s{width:16px;height:16px}
  .num{font-variant-numeric:tabular-nums}

  .app{max-width:1200px;margin:0 auto;min-height:100vh;background:var(--bg-2);padding-bottom:90px}

  /* header: the POD form's bar; right side = data time (tap to refresh) + branch */
  .bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;padding-top:max(8px, env(safe-area-inset-top));background:var(--navy);color:#fff}
  .bar img{height:30px;width:auto;display:block}
  .bar .sep{width:1px;height:26px;background:rgba(255,255,255,.28)}
  .bar .ttl{font-size:17px;font-weight:800;letter-spacing:.6px}
  .bar .sp{flex:1}
  @media (max-width:359px){ .bar{gap:8px} .bar .sep{display:none} }
  .clock{display:flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:800}
  .clock.old{background:var(--amber-50);color:var(--amber)}
  .brp{display:flex;align-items:center;gap:4px;min-height:36px;padding:0 10px 0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:13px;font-weight:800}

  /* date row */
  .daterow{display:flex;align-items:center;gap:6px;padding:10px 14px 4px}
  .daterow .arw{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center}
  .daterow .arw:disabled{opacity:.35}
  .dbox{position:relative;flex:1;min-width:0}
  .dbox .day{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:800;text-align:center;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbox .day small{font-weight:600;color:var(--ink-2)}
  .dbox input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .today{flex:none;min-height:44px;padding:0 12px;border-radius:10px;background:var(--navy);color:#fff;font-size:13px;font-weight:800}
  .loadline{padding:2px 16px 0;font-size:13px;color:var(--ink-2)}
  .offline{display:flex;align-items:center;gap:8px;margin:8px 14px 0;padding:8px 10px 8px 12px;border-radius:10px;background:var(--amber-50);color:var(--amber);font-size:13px;font-weight:800}
  .offline span{flex:1}
  .offline.grey{background:var(--bg-2);color:var(--ink-2)}
  .offline.grey .pill{background:#fff;color:var(--navy);border-color:var(--line)!important}

  /* card grid: a card keeps its width, a wider screen gets more columns (max 4) */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px 14px 0}
  .span2{grid-column:span 2}
  @media (min-width:700px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:12px 20px 0;max-width:800px} .daterow{padding:12px 20px 4px;max-width:800px} .rows{padding:14px 20px 0;max-width:800px} .offline{max-width:772px} }

  .card{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:14px;min-height:104px}
  .card.short{min-height:0;padding:12px 14px}
  .card:active{background:var(--bg-2)}
  .card .go{position:absolute;top:12px;right:10px;color:#64748B}
  .lbl{font-size:13px;font-weight:700;color:var(--ink-2);line-height:18px;padding-right:22px}
  .lbl .rt{position:absolute;top:13px;right:32px;font-weight:600}
  .big{font-size:32px;font-weight:800;line-height:36px;margin-top:4px;letter-spacing:-.5px;white-space:nowrap}
  .big .u{font-size:17px;font-weight:700;color:var(--ink-2);letter-spacing:0;margin-left:4px}
  .big .u.pre{margin:0 3px 0 0}
  .big.amb{color:var(--amber)} .big.mute{color:var(--ink-2)} .big.ok{color:var(--green);font-size:22px;display:flex;align-items:center;gap:6px}
  .big.word{font-size:22px;color:var(--ink-2)}
  .card.short .big{margin-top:2px}
  .sub{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:18px}
  .sub b{color:var(--ink);font-weight:700}
  .sub .warn{color:var(--amber);font-weight:700}
  .sub .bad{color:var(--red-700);font-weight:700}
  .sub .rty{margin-left:6px;color:var(--navy);font-weight:800;text-decoration:underline}
  .pill{display:inline-flex;align-items:center;gap:4px;height:24px;font-size:12px;font-weight:800;padding:0 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
  .pill.sm{height:20px;font-size:11px;padding:0 8px}
  .card .chipline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px;line-height:24px}
  .chipline .unit{font-size:13px;font-weight:700;color:var(--ink-2)}
  .p-done{background:var(--green-50);color:var(--green)}
  .p-late{background:var(--amber-50);color:var(--amber)}
  .p-fail{background:var(--red-50);color:var(--red-700)}
  .p-grey{background:var(--bg-2);color:var(--ink-2)}
  .p-navy{background:var(--navy-50);color:var(--navy)}
  /* stacked bar with 2px white gaps between segments (readable without colour) */
  .sbar{display:flex;gap:2px;height:10px;margin-top:10px}
  .sbar i{display:block;height:100%;border-radius:3px}
  .sbar .g{background:var(--green)} .sbar .r{background:var(--red-700)} .sbar .a{background:#E8B26A} .sbar .k{background:var(--line)}
  .skel{color:var(--ink-2)!important}
  .clock svg.spin{animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* rows under the cards */
  .rows{padding:14px 14px 0}
  .row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
  .row:active{background:var(--bg-2)}
  .row .t{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800}
  .row .m{flex:1;min-width:0;font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .go{color:#64748B}
  .state{padding:18px 14px;text-align:center;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink-2);font-size:15px}
  .state b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}

  /* level 1: full page (right-hand panel on a wide screen); level 2: bottom sheet */
  .page{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:var(--bg-2);overflow-y:auto;-webkit-overflow-scrolling:touch}
  @media (min-width:900px){ .page{left:auto;width:520px;box-shadow:-8px 0 30px rgba(15,23,42,.15)} }
  .page .bar{gap:6px}
  .page .back{display:flex;align-items:center;gap:2px;color:#fff;font-weight:800;font-size:15px;min-height:44px;padding:0 6px 0 0}
  .pbody{max-width:760px;margin:0 auto;padding:12px 14px 40px}
  .h2{font-size:13px;font-weight:800;color:var(--ink-2);margin:18px 2px 8px}
  .h2:first-child{margin-top:4px}
  .li{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
  .li:active{background:var(--bg-2)}
  .li.done{background:var(--bg-2);border-color:transparent}
  .li .mn{flex:1;min-width:0}
  .li .l1{font-size:17px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .l1.s{font-size:15px}
  .li .l2{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .l2.w{white-space:normal}
  .li .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .li .rt .v{font-size:15px;font-weight:800}
  .li .go{color:#64748B}
  .tot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tot .card{min-height:92px}
  .note{font-size:13px;color:var(--ink-2);margin:2px 2px 10px}
  .link{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;margin-top:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:800;font-size:15px}
  table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13px}
  table.t th{background:var(--bg-2);color:var(--ink-2);font-weight:800;text-align:left;padding:8px 10px}
  table.t td{padding:9px 10px;border-top:1px solid var(--line)}
  table.t .n{text-align:right;font-variant-numeric:tabular-nums}
  .days{display:flex;align-items:flex-end;gap:3px;height:70px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px 12px}
  .days i{flex:1;background:var(--green);border-radius:3px 3px 0 0;min-height:2px}
  .days i.k{background:var(--line)}

  .scrim{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px;padding-bottom:max(20px, calc(env(safe-area-inset-bottom) + 14px))}
  .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheet h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:800;line-height:1.3}
  .sheet .s2{font-size:13px;color:var(--ink-2);margin-top:2px}
  .stop{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
  .stop.done{background:var(--bg-2);border-color:transparent}
  .stop .top{display:flex;align-items:flex-start;gap:10px}
  .stop .nm{flex:1;min-width:0;font-size:15px;font-weight:800}
  .stop .mt{font-size:13px;color:var(--ink-2);font-weight:600}
  .ths{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .th{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,#E9EDF5,#F8FAFC);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .reason{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--red-50);color:var(--red-700);font-size:13px;font-weight:800}
  .reason.g{background:var(--bg-2);color:var(--ink-2)}
  .kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .kv div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .kv small{display:block;font-size:12px;color:var(--ink-2);font-weight:700}
  .kv b{font-size:17px}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;font-weight:800;font-size:15px;text-align:center}
  .b-pri{background:var(--navy);color:#fff}
  .b-ghost{background:#fff;border:1.5px solid var(--line)}
  .form2{display:grid;gap:4px;margin-top:12px}
  .fl{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:6px}
  .in{display:block;width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;color:var(--ink);background:#fff}
  .in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,28,119,.12)}
  .err{font-size:13px;font-weight:700;color:var(--red-700);margin-top:2px}
  textarea{width:100%;min-height:96px;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:16px/1.4 var(--font);color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,28,119,.12)}
  .disc{border:1.5px solid var(--ink-2);background:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
  .disc .w{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink)}
  .disc .t{font-size:15px;font-weight:800;margin-top:4px}
  .disc .q{font-size:13px;color:var(--ink-2);margin-top:2px}
  .disc .btn{margin-top:10px;min-height:46px;border:1.5px solid var(--line)}
  .disc.closed{border-color:transparent;background:var(--bg-2)}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .opts button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:800;text-align:center;padding:0 6px}
  .opts button.on{border-color:var(--navy);background:var(--navy-50);color:var(--navy)}


  /* live test page additions */
  .testbar{background:#FEF3C7;border-bottom:1px solid #F59E0B;color:#92400E;font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px}
  a.link{text-decoration:none}
  .rcpt{font-size:12px;color:var(--ink-2);margin-top:2px}
  .lock{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(15,23,42,.92);display:flex;align-items:center;justify-content:center;padding:20px}
  .lockbox{background:#fff;border-radius:16px;max-width:360px;width:100%;padding:22px 20px}
  .lockbox .in{margin-top:4px}
</style>
</head>
<body>
<div class="testbar">TEST PAGE &middot; new dashboard on live data &middot; current one unchanged</div>
<div class="app">
  <header class="bar">
    <img src="brand/clf-logo-horizontal-white.png" alt="CLF Trading" width="72" height="30" decoding="async">
    <span class="sep" aria-hidden="true"></span>
    <span class="ttl">FLEET</span>
    <span class="sp"></span>
    <button type="button" class="clock" id="clock" data-act="refresh" aria-label="Data time, tap to refresh"></button>
    <button type="button" class="brp" id="brp" data-act="branch" aria-label="Branch"></button>
  </header>
  <div class="daterow">
    <button type="button" class="arw" id="dPrev" aria-label="Previous day"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="dbox"><div class="day" id="dDay"></div><input type="date" id="dPick" aria-label="Pick a date" min="2026-06-09"></div>
    <button type="button" class="arw" id="dNext" aria-label="Next day"><svg class="i" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    <button type="button" class="today" id="dToday" hidden>Today</button>
  </div>
  <div class="loadline" id="loadline" hidden></div>
  <main class="grid" id="home"></main>
  <div class="rows" id="rows"></div>
</div>

<div class="page" id="page" hidden>
  <header class="bar"><button type="button" class="back" id="pBack"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back</button><span class="ttl" id="pTitle"></span></header>
  <div class="pbody" id="pBody"></div>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function () {
  'use strict';
  /* F2 dashboard, TEST page (2026-10-24). Same backend and the same office sign-in + read grant as the live
     dashboard; the layout is the approved F2 design (6 cards, POD form style). Parts the backend cannot answer
     yet say "Coming soon". Reads only: nothing on this page writes. */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxabHh2Kd04z7k0zZOOoaJs2i5hgycQsO_AYoRS99xZx2WqMJ6cowumY0e1znehiRM1/exec';
  var BC_SINCE = '2026-10-24';   // the POD form reads invoice barcodes from this day (same rule as POD Admin)
  var KEY_BRANCH = 'clfDashF2T_branch_v1', KEY_SNAP = 'clfDashF2T_snap_v1', KEY_VEH = 'clfDashF2T_veh_v1';
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var REASON_ORDER = ['Shop closed', 'Rejected', 'Partial', 'Reschedule'];

  // ================================================================ helpers
  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function np(p) { return String(p || '').toUpperCase().replace(/\s+/g, ''); }   // plate key: "CDQ 9098" == "cdq9098"
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function hm(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function nowHour() { var d = new Date(); return d.getHours() + d.getMinutes() / 60; }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function fmtRM(v) { v = num(v); return v >= 1e6 ? 'RM ' + (v / 1e6).toFixed(2) + 'M' : v >= 100000 ? 'RM ' + Math.round(v / 1000) + 'K' : v >= 10000 ? 'RM ' + (v / 1000).toFixed(1) + 'K' : 'RM ' + Math.round(v).toLocaleString('en-MY'); }
  function bigRM(v) { var s = fmtRM(v).slice(3), m = /^([\d.,]+)([KM]?)$/.exec(s); return '<span class="u pre">RM</span>' + m[1] + (m[2] ? '<span class="u" style="margin-left:1px">' + m[2] + '</span>' : ''); }
  function pill(t, c, sm) { return '<span class="pill ' + c + (sm ? ' sm' : '') + '">' + t + '</span>'; }
  function readLS(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  var GO = '<svg class="i s go" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
  var CAM = '<svg class="i s" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
  var DOC = '<svg class="i s" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  var OK = '<svg class="i s" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var REF = '<svg class="i s" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>';

  // ================================================================ state

    if (a === 'deliveries') return pageDeliveries();
    if (a === 'matched') return pageMatched();
    if (a === 'open') return pageOpen();
    if (a === 'lorries') return pageLorries();
    if (a === 'fuel') return pageFuel();
    if (a === 'fuelmonth') return pageFuelMonth();
    if (a === 'month') return pageMonth();
    if (a === 'branch') return sheetBranch();
    if (a === 'refresh') { if (!st.updating) load(true); return; }
    if (t.hasAttribute('data-b')) { var b = t.getAttribute('data-b'); history.back(); if (b !== st.branch) go(st.date, b); return; }
    if (t.hasAttribute('data-lorry')) return sheetLorry(t.getAttribute('data-lorry'));
    if (t.hasAttribute('data-slip')) return sheetSlip(+t.getAttribute('data-slip'));
    if (t.id === 'pBack') { history.back(); return; }
    if (t.id === 'dPrev') return go(addDays(st.date, -1), st.branch);
    if (t.id === 'dNext') { if (st.date < addDays(today(), 2)) go(addDays(st.date, 1), st.branch); return; }
    if (t.id === 'dToday') return go(today(), st.branch);
  });
  $('dPick').addEventListener('change', function () { if (/^\d{4}-\d{2}-\d{2}$/.test(this.value) && this.value <= addDays(today(), 2)) go(this.value, st.branch); });
  $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) history.back(); });
  window.addEventListener('popstate', function () { if (!$('scrim').hidden) closeSheet(); else if (!$('page').hidden) closePage(); });
  // a page or sheet waiting for data repaints when that data lands
  var _reopenPage = null;
  Object.defineProperty(st, 'reopen', { get: function () { return function () { if (_reopenPage && !$('page').hidden) _reopenPage(); if (st.sheet && !$('scrim').hidden) st.sheet(); }; }, set: function (f) { _reopenPage = f; } });
  // every 5 minutes while the page is on screen; at midnight a page left on "today" follows the date
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    if (st.follow && st.date !== today()) return go(today(), st.branch);
    if (st.follow && !st.updating) load(false);
  }, 5 * 60000);
  setInterval(function () { if (st.updating && !DATA.ship) render(); }, 1000);   // the "Loading · n s" counter

  // ================================================================ start
  (async function () {
    paintSnap(); render();
    if (!_rgAuth()) { _rgShowLock(); return; }
    await _rgEnsure();
    load(false);
  })();
})();

</script>
