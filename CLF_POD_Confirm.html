<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title data-en="CLF Confirm Delivery" data-bm="CLF Sahkan Penghantaran">CLF Sahkan Penghantaran</title>
<style>
  :root{
    --page:#FAF7F2; --surface:#FFFFFF; --text:#1A1B2E; --muted:#5F6072; --line:#ECE7DE; --soft:#F4F0EA; --hover:#FCFBF8;
    --ctl:#C5C8E0; --navy:#141C77; --navy-2:#2A3189; --navy-tint:#EEF0FA; --on-navy:#D9DBF2;
    --ok:#15803D; --ok-tint:#ECFDF3; --warn:#B45309; --warn-tint:#FFFBEB; --fault:#C8101E; --fault-tint:#FDF1F1;
    --red:#FC091B; --lime:#87C329;
    --shadow:0 1px 2px rgba(26,27,46,.05),0 8px 24px rgba(26,27,46,.07);
    --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  [hidden]{display:none !important;}
  h1,h2{margin:0;}
  button,input,select{font:inherit;color:inherit;}
  button{cursor:pointer;}
  button:disabled{cursor:default;}
  :focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
  .band :focus-visible{outline-color:#fff;}

  /* line icons (24px grid, drawn inline: no icon font, no emoji) */
  .i{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;}
  .i.i22{width:22px;height:22px;}
  .i.i32{width:32px;height:32px;stroke-width:1.75;}

  /* ---- navy band: white logo, title, language switch; the 3px red line sits under it ---- */
  .band{position:relative;background:var(--navy);color:#fff;overflow:hidden;padding:13px 0;font-family:var(--sys);line-height:1.4;}
  .band::after{content:"";position:absolute;right:-60px;top:-260px;width:600px;height:600px;border-radius:50%;background:#1B2485;}
  .band__in{position:relative;z-index:1;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;margin:0 auto;padding:0 24px;}
  .band__logo{display:block;height:40px;width:auto;}
  .band__sep{width:1px;height:38px;background:#4148A0;}
  .band__txt{flex:1 1 200px;min-width:0;}
  .band h1{font-size:21px;font-weight:800;line-height:1.2;}
  .redline{height:3px;background:var(--red);}

  /* ---- language switch ---- */
  .lang{flex:none;display:inline-flex;border:1.5px solid #4148A0;border-radius:999px;}
  .lang-btn{min-width:50px;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--on-navy);font-size:13px;font-weight:800;line-height:1;}
  .lang-btn:hover{background:var(--navy-2);}
  .lang-btn.active,.lang-btn.active:hover{background:#fff;color:var(--navy);}
  .lang-btn:focus-visible{outline-offset:-4px;}
  .lang-btn.active:focus-visible{outline-color:var(--navy);}

  @media (max-width:720px){
    /* header: logo + switch on row 1, title below */
    .band__in{gap:10px 12px;padding:0 16px;}
    .band__sep{display:none;}
    .band .lang{order:1;margin-left:auto;}
    .band__txt{order:2;flex:1 1 100%;}
    .band h1{font-size:19px;}
  }

  body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font-family:var(--sys);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .band__in{max-width:560px;}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;}

  /* ---- cards ---- */
  .card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .lbl{font-size:13px;font-weight:700;color:var(--muted);}
  .big{font-size:19px;font-weight:800;line-height:1.25;margin-top:2px;overflow-wrap:anywhere;}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0 0;font-size:15px;}
  .kv dt{color:var(--muted);font-weight:600;}
  .kv dd{margin:0;font-weight:700;overflow-wrap:anywhere;}

  /* ---- invoice rows: the whole row is the tap target ---- */
  .invs{margin-top:4px;}
  .inv{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;}
  .inv:first-child{border-top:none;}
  .inv input[type=checkbox]{flex:none;width:24px;height:24px;margin:0;accent-color:var(--navy);}
  .inv .no{min-width:0;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
  .inv .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .inv.done{color:var(--muted);cursor:default;}
  .donetag{display:inline-flex;align-items:center;height:22px;padding:0 9px;margin-left:4px;border-radius:999px;background:var(--ok-tint);color:var(--ok);font-size:12px;font-weight:800;white-space:nowrap;vertical-align:middle;}
  .total{display:flex;justify-content:space-between;gap:12px;padding-top:12px;margin-top:4px;border-top:2px solid var(--text);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;}
  .untick{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:700;}

  /* ---- photo ---- */
  .photo{display:flex;align-items:center;justify-content:center;min-height:96px;margin-top:10px;padding:16px;border:2px dashed var(--ctl);border-radius:14px;background:var(--hover);color:var(--navy);font-size:16px;font-weight:800;text-align:center;cursor:pointer;}
  .photo.has{border-style:solid;border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
  .photo img{display:block;max-width:100%;max-height:240px;margin:10px auto 0;border-radius:10px;}

  /* ---- the one action ---- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:4px;padding:10px 18px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-size:17px;font-weight:800;}
  .btn:hover{background:var(--navy-2);}
  .btn:disabled{opacity:.6;background:var(--navy);}
  .note{font-size:13px;font-weight:600;color:var(--muted);}
  .left{text-align:center;margin-top:12px;}

  /* ---- whole-card messages ---- */
  .msg{text-align:center;font-size:16px;font-weight:700;color:var(--muted);}
  .msg .i{display:block;margin:0 auto 8px;}
  .msg .note{margin-top:6px;color:inherit;font-size:14px;}
  .msg.ok{background:var(--ok-tint);color:var(--ok);}
  .msg.ok .hd{font-size:20px;font-weight:800;}
  .msg.err{background:var(--fault-tint);color:var(--fault);}
  .hide{display:none;}
</style>
</head>

  // The choice is kept in localStorage 'clf_lang' (shared with the other CLF pages); a stored choice wins over
  // this page's default.
  var LANG_KEY = 'clf_lang';
  var LANG_DEFAULT = 'bm';
  var LANG = LANG_DEFAULT;
  try{ var _stored = localStorage.getItem(LANG_KEY); if(_stored === 'en' || _stored === 'bm') LANG = _stored; }catch(e){}
  function L(en, bm){ return LANG === 'bm' ? bm : en; }
  function T(en, bm){ return '<span data-en="'+esc(en)+'" data-bm="'+esc(bm)+'">'+esc(L(en, bm))+'</span>'; }

    each('[data-en-ph]', function(el){ el.setAttribute('placeholder', el.getAttribute('data-' + sfx + '-ph')); });

    each('[data-en-alt]', function(el){ el.setAttribute('alt', el.getAttribute('data-' + sfx + '-alt')); });

  }
  // Switch in place: no reload, no backend call, nothing typed or ticked is lost (only text nodes change).
  function setLang(v){
    v = (v === 'bm') ? 'bm' : 'en';
    if(v === LANG) return;
    LANG = v;
    try{ localStorage.setItem(LANG_KEY, v); }catch(e){}
    applyLang();
  }
  document.addEventListener('click', function(e){
    var t = e.target, b = (t && t.closest) ? t.closest('[data-lang]') : null;
    if(b) setLang(b.getAttribute('data-lang'));
  });

  var IC_WARN = '<svg class="i i22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
  var IC_OK = '<svg class="i i22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>';
  var IC_CAMERA = '<svg class="i i22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>';
  // a whole-card error: main line + one short "what to do" line (both already HTML)
  function errCard(main, note){ return '<div class="card msg err">'+IC_WARN+'<div>'+main+'</div>'+(note ? '<div class="note">'+note+'</div>' : '')+'</div>'; }

  function start(){
    var g = new URLSearchParams(location.search).get('g') || '';
    if(!g){ show(errCard(T('No code.','Tiada kod.'), T('Scan the QR on the combination invoice.','Imbas kod QR pada invois gabungan.'))); return; }
    fetch(SCRIPT_URL + '?action=getCombinationGroupByToken&g=' + encodeURIComponent(g))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || d.status!=='ok'){ show(errCard((d&&d.message) ? esc(d.message) : T('Invalid or expired code.','Kod tidak sah atau sudah tamat tempoh.'), T('Use the POD form instead.','Guna borang POD.'))); return; }
        if(!d.invoices || !d.invoices.length){ show(errCard(T('No invoices for this code.','Tiada invois untuk kod ini.'))); return; }
        G = d; renderForm();
      })
      .catch(function(){ show(errCard(T('Cannot reach the server.','Tidak dapat sambung ke sistem.'), T('Check your internet, then reload.','Semak internet, kemudian muat semula.'))); });
  }

  function renderForm(){
    var pending = G.invoices.filter(function(x){ return x.status!=='delivered'; });
    var rows = G.invoices.map(function(iv){
      var done = iv.status==='delivered';
      return '<label class="inv'+(done?' done':'')+'">'
        + '<input type="checkbox" class="ivchk" data-no="'+esc(iv.invoiceNo)+'" '+(done?'checked disabled':'checked')+'>'
        + '<span class="no">'+esc(iv.invoiceNo)+(done?' <span class="donetag">'+T('Delivered','Sudah dihantar')+'</span>':'')+'</span>'
        + '<span class="amt">RM '+money(iv.amount)+'</span></label>';
    }).join('');
    var tot = G.invoices.reduce(function(a,x){ return a+(Number(x.amount)||0); },0);
    show(
      '<div class="card">'
        + '<div class="lbl">'+T('Customer','Pelanggan')+'</div><div class="big">'+esc(G.customer||'-')+'</div>'
        + '<dl class="kv">'
          + '<dt>'+T('Station','Stesen')+'</dt><dd>'+esc(G.area||'-')+'</dd>'
          + '<dt>'+T('Lorry','Lori')+'</dt><dd>'+esc(G.lorryNo||'-')+'</dd>'
          + '<dt>Driver</dt><dd>'+esc(G.driver||'-')+'</dd>'
        + '</dl>'
      + '</div>'
      + '<div class="card">'
        + '<div class="lbl">'+T('Invoices received','Invois diterima')+'</div>'
        + '<div class="invs">'+rows+'</div>'
        + '<div class="total"><span>'+T('Total','Jumlah')+'</span><span>RM '+money(tot)+'</span></div>'
        + '<div class="untick">'+T('Untick any the customer did NOT take.','Buang tanda pada invois yang pelanggan TIDAK ambil.')+'</div>'
      + '</div>'
      + '<div class="card">'
        + '<div class="lbl">'+T('Photo of the signed invoice','Gambar invois bertandatangan')+'</div>'
        + '<label class="photo" id="photoBox"><span id="photoTxt">'+IC_CAMERA+' '+T('Take photo','Ambil gambar')+'</span>'
        + '<input type="file" accept="image/*" capture="environment" id="photoIn" class="hide"></label>'
      + '</div>'
      + '<button class="btn" id="submitBtn">'+IC_OK+'<span id="submitTxt" data-en="Confirm delivery" data-bm="Sahkan penghantaran">'+L('Confirm delivery','Sahkan penghantaran')+'</span></button>'
      + '<div class="note left">'+T(pending.length+' to confirm', pending.length+' untuk disahkan')+'</div>'
    );
    $('photoIn').addEventListener('change', onPhoto);
    $('submitBtn').addEventListener('click', submit);
  }

  function onPhoto(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      PHOTO = { base64: String(rd.result).split(',')[1], name: 'cmb_signed.jpg', type: f.type||'image/jpeg' };
      $('photoBox').classList.add('has');
      $('photoTxt').innerHTML = IC_OK+' '+T('Photo taken','Gambar diambil')+'<br><img src="'+rd.result+'" alt="'+esc(L('signed invoice','invois bertandatangan'))+'" data-en-alt="signed invoice" data-bm-alt="invois bertandatangan">';
    };
    rd.readAsDataURL(f);
  }

  async function submit(){
    var checked = Array.prototype.slice.call(document.querySelectorAll('.ivchk:checked:not(:disabled)')).map(function(c){ return c.getAttribute('data-no'); });
    if(!checked.length){ alert(L('Tick at least one invoice.','Tanda sekurang-kurangnya satu invois.')); return; }
    if(!PHOTO){ alert(L('Take a photo of the signed invoice first.','Ambil gambar invois bertandatangan dulu.')); return; }
    var btn = $('submitBtn'); btn.disabled = true; setTxt($('submitTxt'),'Submitting…','Menghantar…');
    var res = await postWrite({
      formType: 'SUBMIT_POD_FOR_INVOICE',
      shipmentKey: G.shipmentKey, invoiceNos: checked,
      driverName: G.driver, secondDriver: G.secondDriver, vehicleNo: G.lorryNo,
      deliveryDate: G.shipDate, timestamp: new Date().toISOString(),
      branch: G.branch, photos: [PHOTO]
    });
    if(res && res.status==='success'){
      show('<div class="card msg ok">'+IC_OK+'<div class="hd">'+T('Confirmed','Disahkan')+'</div><div><b>'+(res.delivered!=null?res.delivered:checked.length)+'</b> '+T('invoice(s) marked delivered.','invois ditanda sudah dihantar.')+'</div><div class="note">'+esc(G.customer||'')+'<br>'+esc(G.area||'')+'</div></div>');
    } else {
      btn.disabled = false; setTxt($('submitTxt'),'Confirm delivery','Sahkan penghantaran');
      alert('⚠ ' + ((res&&res.message) || L('Failed, try again.','Gagal, cuba lagi.')));
    }
  }

  async function postWrite(payload){
    var ct = 'cmb_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    payload.clientToken = ct;
    try{
      await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    }catch(e){ return { status:'error', message:L('No internet. Try again.','Tiada internet. Cuba lagi.') }; }
    for(var i=0;i<10;i++){
      await new Promise(function(r){ setTimeout(r,1500); });
      try{
        var res = await fetch(SCRIPT_URL + '?action=getImportResult&token=' + encodeURIComponent(ct));
        var data = await res.json();
        if(data && data.status && data.status !== 'pending') return data;
      }catch(e){}
    }
    return { status:'error', message:L('Timed out. Check the dashboard.','Tamat masa. Semak dashboard.') };
  }

  applyLang();
  start();
</script>
</body>
</html>
